services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aral
      POSTGRES_PASSWORD: aral
      POSTGRES_DB: aral
    ports:
      # 5433 to avoid clashing with any locally installed Postgres
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
