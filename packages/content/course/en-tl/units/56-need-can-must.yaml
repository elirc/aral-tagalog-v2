      - type: fill_blank
        sentence: "Marunong ___ magsalita ng Tagalog."
        translation: "I know how to speak Tagalog."
        answer: akong
        options: [akong, kong, ako]
        hint: "Marunong takes ako/ka/siya plus the linker: akong, kang, siyang."
      - type: translate
        prompt_en: I don't know how to swim.
        answer_tl: Hindi ako marunong lumangoy.
        accept: ["Hindi ako marunong na lumangoy", "Hindi po ako marunong lumangoy"]
        extra_words: [ko, kaya, magmaneho]
        audio: hindi_ako_marunong_lumangoy
        hint: 'After "hindi" the pronoun comes first: hindi ako marunong…'
      - type: translate
        prompt_en: Does he know how to drive?
        answer_tl: Marunong ba siyang magmaneho?
        extra_words: [niyang, ka, lumangoy]
        audio: marunong_ba_siyang_magmaneho
  - id: needcan-6
    title: Hindi ako maka-… — I can't
    xp: 10
    exercises:
      - type: choice
        prompt: "'Hindi ako makatulog' means..."
        answer: I can't sleep.
        distractors: [I don't want to sleep., I shouldn't sleep., I don't need to sleep.]
        audio: hindi_ako_makatulog
        audio_text: Hindi ako makatulog.
        hint: 'maka- + root = to be able to: tulog → makatulog.'
      - type: match
        pairs:
          - { tl: makatulog, en: to be able to sleep }
          - { tl: makakain, en: to be able to eat }
          - { tl: makapunta, en: to be able to go }
          - { tl: matulog, en: to sleep }
      - type: translate
        prompt_tl: Hindi ako makatulog kasi maingay.
        answer_en: I can't sleep because it's noisy.
        accept:
          - "I cannot sleep because it's noisy"
          - "I can't sleep because it is noisy"
          - "I cannot sleep because it is noisy"
          - "I am unable to sleep because it's noisy"
        extra_words: [eat, quiet, need]
        audio: hindi_ako_makatulog_kasi_maingay
      - type: choice
        prompt: "Add 'able to' to kain (eat). Which is right?"
        answer: makakain
        distractors: [kumakain, kakainin, magkain]
        audio: makakain
        audio_text: Makakain
      - type: translate
        prompt_tl: Hindi siya makakain; masakit ang tiyan niya.
        answer_en: She can't eat; her stomach hurts.
        accept:
          - "He can't eat; his stomach hurts"
          - "She cannot eat; her stomach hurts"
          - "He cannot eat; his stomach hurts"
          - "She can't eat; she has a stomachache"
          - "He can't eat; he has a stomachache"
        extra_words: [sleep, head, wants]
        audio: hindi_siya_makakain_masakit_ang_tiyan_niya
      - type: listen
        audio: hindi_ako_makapunta_sa_opisina_ngayon
        answer_tl: Hindi ako makapunta sa opisina ngayon
        extra_words: [makatulog, bukas]
      - type: fill_blank
        sentence: "Maingay ang mga aso. Hindi kami ___."
        translation: "The dogs are noisy. We can't sleep."
        answer: makatulog
        options: [makatulog, makakain, makapunta]
      - type: translate
        prompt_en: I can't sleep.
        answer_tl: Hindi ako makatulog.
        accept: ["Hindi po ako makatulog"]
        extra_words: [ko, matulog, kaya]
        audio: hindi_ako_makatulog
      - type: translate
        prompt_en: I can't go to school today because I'm sick.
        answer_tl: Hindi ako makapunta sa paaralan ngayon kasi may sakit ako.
