          - "Hindi ako makapunta ngayon sa paaralan kasi may sakit ako"
          - "Hindi ako makapunta ngayon sa paaralan dahil may sakit ako"
          - "Hindi ako makakapunta sa paaralan ngayon kasi may sakit ako"
          - "Hindi ako makakapunta sa paaralan ngayon dahil may sakit ako"
        extra_words: [makatulog, ko, bukas]
        audio: hindi_ako_makapunta_sa_paaralan_ngayon_kasi_may_sakit_ako
        hint: 'After "hindi", the plain maka- form says what you can''t do right now.'
  - id: needcan-7
    title: Naka- and makaka- — managed to, will be able to
    xp: 10
    exercises:
      - type: choice
        prompt: "'Nakatulog ka ba?' means..."
        answer: Were you able to sleep?
        distractors: [Do you need to sleep?, Will you be able to sleep?, Do you want to sleep?]
        audio: nakatulog_ka_ba
        audio_text: Nakatulog ka ba?
        hint: "naka- is the completed form of maka-: it happened, you managed it."
      - type: match
        pairs:
          - { tl: nakatulog, en: was able to sleep }
          - { tl: makakatulog, en: will be able to sleep }
          - { tl: nakabili, en: was able to buy }
          - { tl: makakapunta, en: will be able to go }
      - type: translate
        prompt_tl: Hindi ako nakatulog kagabi.
        answer_en: I wasn't able to sleep last night.
        accept:
          - "I was not able to sleep last night"
          - "I couldn't sleep last night"
          - "I could not sleep last night"
          - "I didn't get to sleep last night"
        extra_words: [tomorrow, eat, will]
        audio: hindi_ako_nakatulog_kagabi
      - type: choice
        prompt: "'Nakakain ka na ba?' means..."
        answer: Have you eaten yet?
        distractors: [Can you eat this?, Will you eat later?, Are you eating now?]
        audio: nakakain_ka_na_ba
        audio_text: Nakakain ka na ba?
      - type: translate
        prompt_tl: Nakabili ako ng gamot sa botika.
        answer_en: I was able to buy medicine at the pharmacy.
        accept:
          - "I managed to buy medicine at the pharmacy"
          - "I was able to buy medicine at the drugstore"
          - "I managed to buy medicine at the drugstore"
          - "I got to buy medicine at the pharmacy"
        extra_words: [will, hospital, need]
        audio: nakabili_ako_ng_gamot_sa_botika
      - type: listen
        audio: makakapunta_ka_ba_bukas
        answer_tl: Makakapunta ka ba bukas
        extra_words: [nakapunta, kagabi]
      - type: fill_blank
        sentence: "___ ka na ba sa Cebu?"
        translation: "Have you ever been to Cebu?"
        answer: Nakapunta
        options: [Nakapunta, Makakapunta, Pupunta]
        hint: 'naka- with "na" also means "have (ever) done": Nakapunta na ako sa Cebu = I have been to Cebu.'
      - type: translate
        prompt_en: I won't be able to go tomorrow.
        answer_tl: Hindi ako makakapunta bukas.
        accept: ["Hindi ako makapupunta bukas", "Hindi po ako makakapunta bukas"]
        extra_words: [nakapunta, kahapon, ko]
        audio: hindi_ako_makakapunta_bukas
        hint: "For the future, repeat ka: makapunta → makakapunta."
      - type: translate
        prompt_en: Were you able to buy medicine?
        answer_tl: Nakabili ka ba ng gamot?
        accept: ["Nakabili ka na ba ng gamot", "Nakabili po ba kayo ng gamot", "Nakabili ba kayo ng gamot"]
        extra_words: [makakabili, ako, pera]
        audio: nakabili_ka_ba_ng_gamot
  - id: needcan-8
