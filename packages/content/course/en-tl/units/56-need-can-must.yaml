id: need-can-must
title: Need, Can, Must
description: >-
  Say what you need, should, can and may do with kailangan, dapat, kaya,
  marunong, maka- verbs, pwede and bawal.
tip: >-
  Tagalog puts a small helper word in front of the verb, and the trick is
  knowing which pronoun set it takes. Kailangan (need) and kaya (can manage)
  take ko/mo/niya: "Kailangan kong umalis", "Kaya ko ito". Dapat (should),
  marunong (know how to) and pwede (may / allowed — also spelled puwede) take
  ako/ka/siya: "Dapat kang magpahinga", "Marunong akong lumangoy", "Pwede kang
  umupo". Before a verb the pronoun carries the -ng linker (kong, kang). For
  "able to", put maka- on the verb itself: "Hindi ako makatulog" (I can't
  sleep); naka- is the past, "Nakatulog ako" (I managed to sleep), and makaka-
  the future. On signs, "bawal" means forbidden: "Bawal pumarada."
lessons:
  - id: needcan-1
    title: Kailangan ko ng… — I need
    xp: 10
    exercises:
      - type: choice
        prompt: "'Kailangan ko ng tubig' means..."
        answer: I need water.
        distractors: [I want water., I have water., I am drinking water.]
        audio: kailangan_ko_ng_tubig
        audio_text: Kailangan ko ng tubig.
      - type: match
        pairs:
          - { tl: kailangan ko, en: I need }
          - { tl: kailangan mo, en: you need }
          - { tl: kailangan niya, en: he / she needs }
          - { tl: kailangan namin, en: we need }
      - type: translate
        prompt_tl: Kailangan ko ng pahinga.
        answer_en: I need rest.
        accept: ["I need a rest", "I need some rest", "I need a break"]
        extra_words: [money, help, water]
        audio: kailangan_ko_ng_pahinga
        hint: '"pahinga" = rest — you already know the verb "magpahinga".'
      - type: choice
        prompt: "'Pasaporte' means..."
        answer: Passport
        distractors: [Umbrella, Medicine, Money]
        audio: pasaporte
        audio_text: Pasaporte
      - type: translate
        prompt_tl: Kailangan mo ba ng payong?
        answer_en: Do you need an umbrella?
        accept: ["Do you need an umbrella"]
        extra_words: [want, passport, rest]
        audio: kailangan_mo_ba_ng_payong
      - type: listen
        audio: kailangan_namin_ng_pahinga
        answer_tl: Kailangan namin ng pahinga
        extra_words: [pasaporte, niya]
      - type: fill_blank
        sentence: "Kailangan ___ ng gamot; may lagnat siya."
        translation: "He needs medicine; he has a fever."
        answer: niya
        options: [niya, siya, kanya]
        hint: 'Kailangan takes the ko/mo/niya set, just like "gusto".'
      - type: translate
        prompt_en: We need help.
        answer_tl: Kailangan namin ng tulong.
        accept: ["Kailangan natin ng tulong", "Kailangan po namin ng tulong"]
        extra_words: [kami, pera, niya]
        audio: kailangan_namin_ng_tulong
      - type: translate
        prompt_en: Do you need a passport?
        answer_tl: Kailangan mo ba ng pasaporte?
        accept: ["Kailangan ba ng pasaporte", "Kailangan po ba ninyo ng pasaporte", "Kailangan ba ninyo ng pasaporte", "Kailangan ba niyo ng pasaporte"]
        extra_words: [ka, pahinga, ko]
        audio: kailangan_mo_ba_ng_pasaporte
  - id: needcan-2
    title: Kailangan kong… — I need to
    xp: 10
    exercises:
      - type: choice
        prompt: "Which means 'I need to leave'?"
        answer: Kailangan kong umalis.
        distractors: [Gusto kong umalis., Ayaw kong umalis., Umalis na ako.]
        audio: kailangan_kong_umalis
        audio_text: Kailangan kong umalis.
      - type: match
        pairs:
          - { tl: pumasok, en: to enter / go in }
          - { tl: magbayad, en: to pay }
          - { tl: umalis, en: to leave }
          - { tl: maghintay, en: to wait }
      - type: translate
        prompt_tl: Kailangan kong pumasok sa opisina bukas.
        answer_en: I need to go in to the office tomorrow.
        accept:
          - "I need to go to the office tomorrow"
          - "I have to go in to the office tomorrow"
          - "I have to go to the office tomorrow"
          - "I need to go into the office tomorrow"
        extra_words: [school, yesterday, want]
        audio: kailangan_kong_pumasok_sa_opisina_bukas
        hint: '"pumasok" = to enter — and also to go in to work or school.'
      - type: choice
        prompt: "'Kailangan mo bang magbayad?' means..."
        answer: Do you need to pay?
        distractors: [Do you want to pay?, Did you pay already?, Do you need money?]
        audio: kailangan_mo_bang_magbayad
        audio_text: Kailangan mo bang magbayad?
      - type: listen
        audio: kailangan_nating_maghintay_dito
        answer_tl: Kailangan nating maghintay dito
        extra_words: [kong, umalis]
      - type: translate
        prompt_tl: Hindi mo kailangang magbayad.
        answer_en: You don't need to pay.
        accept: ["You do not need to pay", "You don't have to pay", "You do not have to pay"]
        extra_words: [wait, I, want]
        audio: hindi_mo_kailangang_magbayad
        hint: 'With "hindi" the pronoun jumps forward and the linker moves onto kailangan: hindi mo kailangang…'
      - type: fill_blank
        sentence: "Kailangan ___ uminom ng gamot."
        translation: "She needs to take medicine."
        answer: niyang
        options: [niyang, niya, siyang]
        hint: "Before a verb the pronoun takes the -ng linker: niya → niyang."
      - type: translate
        prompt_en: I need to sleep.
        answer_tl: Kailangan kong matulog.
        extra_words: [ko, akong, gusto]
        audio: kailangan_kong_matulog
        hint: "ko + -ng = kong before a verb, just like in \"gusto kong\"."
      - type: translate
        prompt_en: We need to leave early.
        answer_tl: Kailangan nating umalis nang maaga.
        accept: ["Kailangan naming umalis nang maaga"]
        extra_words: [ng, pumasok, kong]
        audio: kailangan_nating_umalis_nang_maaga
  - id: needcan-3
    title: Dapat — should
    xp: 10
    exercises:
      - type: choice
        prompt: "'Dapat' means..."
        answer: Should / must
        distractors: [Can / may, Want, Don't]
        audio: dapat
        audio_text: Dapat
      - type: match
        pairs:
          - { tl: dapat, en: should }
          - { tl: hindi dapat, en: should not }
          - { tl: kailangan, en: need }
          - { tl: huwag, en: don't }
      - type: translate
        prompt_tl: Dapat kang magpahinga.
        answer_en: You should rest.
        accept: ["You must rest", "You ought to rest", "You should take a rest"]
        extra_words: [need, I, sleep]
        audio: dapat_kang_magpahinga
      - type: choice
        prompt: "Which is correct for 'I should study'?"
        answer: Dapat akong mag-aral.
        distractors: [Dapat kong mag-aral., Dapat ko ng aral., Dapat sa akin mag-aral.]
        audio: dapat_akong_mag_aral
        audio_text: Dapat akong mag-aral.
        hint: "Dapat takes ako/ka/siya — unlike kailangan, which takes ko/mo/niya."
      - type: listen
        audio: dapat_tayong_umalis_nang_maaga
        answer_tl: Dapat tayong umalis nang maaga
        extra_words: [kang, pumasok]
      - type: translate
        prompt_tl: Hindi ka dapat uminom ng kape sa gabi.
        answer_en: You should not drink coffee at night.
        accept:
          - "You shouldn't drink coffee at night"
          - "You should not drink coffee in the evening"
          - "You shouldn't drink coffee in the evening"
        extra_words: [need, morning, water]
        audio: hindi_ka_dapat_uminom_ng_kape_sa_gabi
      - type: fill_blank
        sentence: "___ kang magdala ng payong; umuulan."
        translation: "You should bring an umbrella; it's raining."
        answer: Dapat
        options: [Dapat, Bawal, Gusto]
      - type: translate
        prompt_en: I should study.
        answer_tl: Dapat akong mag-aral.
        accept: ["Dapat mag-aral ako"]
        extra_words: [kong, ko, matulog]
        audio: dapat_akong_mag_aral
        hint: "Dapat + ako + linker → \"Dapat akong…\"."
      - type: translate
        prompt_en: You should not go in to work; you have a fever.
        answer_tl: Hindi ka dapat pumasok; may lagnat ka.
        accept:
          - "Hindi ka dapat pumasok, may lagnat ka"
          - "Hindi ka dapat pumasok. May lagnat ka"
          - "Hindi ka dapat pumasok sa trabaho; may lagnat ka"
        extra_words: [mo, kailangan, umalis]
        audio: hindi_ka_dapat_pumasok_may_lagnat_ka
  - id: needcan-4
    title: Kaya ko! — I can manage
    xp: 10
    exercises:
      - type: choice
        prompt: "'Kaya ko ito' means..."
        answer: I can do this.
        distractors: [I need this., I want this., I know this.]
        audio: kaya_ko_ito
        audio_text: Kaya ko ito.
        hint: 'You met "kaya" as "so". Followed by ko/mo/niya it means having the strength or ability.'
      - type: match
        pairs:
          - { tl: kaya ko, en: I can manage }
          - { tl: kaya mo, en: you can manage }
          - { tl: hindi ko kaya, en: I can't manage }
          - { tl: mabigat, en: heavy }
      - type: translate
        prompt_tl: Mabigat ang bag. Kaya mo ba?
        answer_en: The bag is heavy. Can you manage?
        accept:
          - "The bag is heavy. Can you manage it?"
          - "The bag is heavy. Can you do it?"
          - "The bag is heavy. Can you handle it?"
          - "The bag is heavy. Can you carry it?"
        extra_words: [need, small, I]
        audio: mabigat_ang_bag_kaya_mo_ba
      - type: choice
        prompt: "Your friend is nervous before an exam. You say..."
        answer: Kaya mo iyan!
        distractors: [Bawal iyan!, Hindi mo kaya!, Mabigat iyan!]
        audio: kaya_mo_iyan
        audio_text: Kaya mo iyan!
      - type: listen
        audio: hindi_ko_na_kaya_kailangan_ko_ng_pahinga
        answer_tl: Hindi ko na kaya, kailangan ko ng pahinga
        extra_words: [mo, mabigat]
      - type: translate
        prompt_tl: Kaya niyang maglakad nang malayo.
        answer_en: He can walk far.
        accept:
          - "She can walk far"
          - "He is able to walk far"
          - "She is able to walk far"
          - "He can walk a long way"
          - "She can walk a long way"
        extra_words: [run, should, near]
        audio: kaya_niyang_maglakad_nang_malayo
      - type: fill_blank
        sentence: "Hindi ___ kayang kumain ng maanghang."
        translation: "I can't eat spicy food."
        answer: ko
        options: [ko, ako, akin]
        hint: 'Kaya takes ko/mo/niya; after "hindi" the pronoun comes first and the linker moves onto kaya: hindi ko kayang…'
      - type: translate
        prompt_en: This is heavy, but I can manage.
        answer_tl: Mabigat ito, pero kaya ko.
        accept: ["Mabigat ito pero kaya ko", "Mabigat ito, pero kaya ko ito", "Mabigat ito pero kaya ko ito"]
        extra_words: [ako, kailangan, mo]
        audio: mabigat_ito_pero_kaya_ko
      - type: translate
        prompt_en: Are you able to walk?
        answer_tl: Kaya mo bang maglakad?
        accept: ["Kaya mo bang lumakad", "Kaya mo po bang maglakad", "Kaya ba ninyong maglakad", "Kaya po ba ninyong maglakad"]
        extra_words: [ka, ba, tumakbo]
        audio: kaya_mo_bang_maglakad
        hint: 'mo + ba + linker → "Kaya mo bang…" — the linker rides on "ba".'
  - id: needcan-5
