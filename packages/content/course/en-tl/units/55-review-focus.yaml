id: review-focus
title: "Review: Who Did What"
description: >-
  Markers and focus together — say who did it, what it was done to, and who it
  was for, at home, in the kitchen, and at the market.
tip: >-
  Every Tagalog sentence puts one thing in the spotlight, marked by ang (or si
  for a name). The verb tells you what that thing is. Actor focus (-um-, mag-):
  the doer is the star → "Kumain ako ng mangga" (I ate a mango). Object focus
  (-in, i-, -an): the thing or person acted on is the star, and the doer steps
  back to the ng-set (ko, mo, niya, ni Ana) → "Kinain ko ang mangga" (I ate
  the mango). A quick test: if English says "the", "it" or names a person as
  the object, reach for object focus. Sa and kay mark the place or the person
  something goes to: "Ibinigay ko ang regalo kay Lola." And with bigyan the
  receiver takes the spotlight: "Binigyan ko si Lola ng regalo."
lessons:
  - id: revfocus-1
    title: Actor or object focus?
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: Kumain ako, en: I ate }
          - { tl: Kinain ko, en: I ate it }
          - { tl: Uminom ako, en: I drank }
          - { tl: Ininom ko, en: I drank it }
      - type: choice
        prompt: "'Kinain ko ang mangga.' What is in focus (marked by ang)?"
        answer: The mango
        distractors: [The person eating, The place, The time]
        audio: kinain_ko_ang_mangga
        audio_text: Kinain ko ang mangga.
      - type: translate
        prompt_tl: Kumain ako ng mangga.
        answer_en: I ate a mango.
        accept: ["I ate mango", "I ate some mango"]
        extra_words: [the, drank, bought]
        audio: kumain_ako_ng_mangga
      - type: translate
        prompt_tl: Kinain ko ang mangga.
        answer_en: I ate the mango.
        extra_words: [a, drank, bought]
        audio: kinain_ko_ang_mangga
      - type: choice
        prompt: "Which sentence means 'I bought the fish'?"
        answer: Binili ko ang isda.
        distractors: [Bumili ako ng isda., Binili ako ng isda., Bumili ko ang isda.]
        audio: binili_ko_ang_isda
        audio_text: Binili ko ang isda.
      - type: fill_blank
        sentence: "___ ko ang gatas."
        translation: "I drank the milk."
        answer: Ininom
        options: [Ininom, Uminom, Iinom]
        hint: '"Ko" and "ang gatas" signal object focus, so the verb is the -in form: ininom.'
      - type: listen
        audio: binili_ko_ang_tinapay
        answer_tl: Binili ko ang tinapay
        extra_words: [bumili, ng]
      - type: translate
        prompt_en: I bought fish at the market.
        answer_tl: Bumili ako ng isda sa palengke.
        accept: ["Bumili ako sa palengke ng isda"]
        extra_words: [binili, ko, ang]
        audio: bumili_ako_ng_isda_sa_palengke
        hint: 'No "the" before fish, so the buyer stays in focus: bumili ako ng…'
      - type: translate
        prompt_en: I drank the coffee.
        answer_tl: Ininom ko ang kape.
        extra_words: [uminom, ako, ng]
        audio: ininom_ko_ang_kape
        hint: '"The coffee" is definite, so it takes ang and the drinker becomes ko.'
  - id: revfocus-2
    title: Ang, ng, sa in action
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: si Ana, en: Ana (in focus) }
          - { tl: ni Ana, en: of Ana / by Ana }
          - { tl: kay Ana, en: to Ana }
          - { tl: sina Ana, en: Ana and the others }
      - type: choice
        prompt: "'Tinawag ni Ben si Ana.' Who called whom?"
        answer: Ben called Ana
        distractors: [Ana called Ben, Ben and Ana called someone, Someone called Ben and Ana]
        audio: tinawag_ni_ben_si_ana
        audio_text: Tinawag ni Ben si Ana.
      - type: translate
        prompt_tl: Binili ni Ana ang isda sa palengke.
        answer_en: Ana bought the fish at the market.
        accept: ["Ana bought the fish in the market", "Ana bought the fish from the market"]
        extra_words: [Ben, cooked, kitchen]
        audio: binili_ni_ana_ang_isda_sa_palengke
      - type: fill_blank
        sentence: "Kumain ___ Ben ng tinapay."
        translation: "Ben ate bread."
        answer: si
        options: [si, ni, kay]
        hint: 'With an actor-focus verb like kumain, the doer is in focus: si.'
      - type: fill_blank
        sentence: "Kinain ___ Ben ang tinapay."
        translation: "Ben ate the bread."
        answer: ni
        options: [ni, si, kay]
        hint: 'The bread already has ang, so the doer steps back to ni.'
      - type: listen
        audio: nagluto_si_nanay_ng_adobo
        answer_tl: Nagluto si Nanay ng adobo
        extra_words: [ni, ang]
      - type: translate
        prompt_tl: Ibinigay ko ang pera kay Ben.
        answer_en: I gave the money to Ben.
        accept: ["I gave Ben the money"]
        extra_words: [Ana, from, bread]
        audio: ibinigay_ko_ang_pera_kay_ben
      - type: translate
        prompt_en: Mom cooked the chicken.
        answer_tl: Niluto ni Nanay ang manok.
        accept: ["Niluto ng nanay ko ang manok"]
        extra_words: [si, ng, nagluto]
        audio: niluto_ni_nanay_ang_manok
        hint: 'The chicken is definite ("the"), so it takes ang and Mom steps back to ni.'
      - type: translate
        prompt_en: Ana read a book at school.
        answer_tl: Nagbasa si Ana ng libro sa paaralan.
        accept:
          - "Nagbasa ng libro si Ana sa paaralan"
          - "Bumasa si Ana ng libro sa paaralan"
        extra_words: [ni, ang, binasa]
        audio: nagbasa_si_ana_ng_libro_sa_paaralan
  - id: revfocus-3
    title: Ako or ko?
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: ako, en: I }
          - { tl: ko, en: my / by me }
          - { tl: sa akin, en: to me }
          - { tl: siya, en: he / she }
          - { tl: niya, en: his / her }
      - type: match
        pairs:
          - { tl: ito, en: this (in focus) }
          - { tl: nito, en: of this }
          - { tl: dito, en: here }
          - { tl: sa iyo, en: to you }
      - type: choice
        prompt: "Which sentence is correct?"
        answer: Kinuha ko ang libro.
        distractors: [Kinuha ako ang libro., Kumuha ko ang libro., Kumuha ko ng libro.]
        audio: kinuha_ko_ang_libro
        audio_text: Kinuha ko ang libro.
      - type: translate
        prompt_tl: Tinawag niya ako.
        answer_en: She called me.
        accept: ["He called me"]
        extra_words: [I, her, him]
        audio: tinawag_niya_ako
      - type: translate
        prompt_tl: Kumain ako nito kahapon.
        answer_en: I ate some of this yesterday.
        accept: ["I ate this yesterday", "I ate some of this one yesterday"]
        extra_words: [here, tomorrow, drank]
        audio: kumain_ako_nito_kahapon
      - type: fill_blank
        sentence: "Binasa ___ ang libro mo."
        translation: "I read your book."
        answer: ko
        options: [ko, ako, akin]
        hint: 'In object focus the doer comes from the ng-set: ko, mo, niya.'
      - type: listen
        audio: hinanap_ka_namin
        answer_tl: Hinanap ka namin
        extra_words: [kami, mo]
      - type: translate
        prompt_en: He looked for me at school.
        answer_tl: Hinanap niya ako sa paaralan.
        extra_words: [siya, ko, akin]
        audio: hinanap_niya_ako_sa_paaralan
        hint: 'The one being looked for is in focus (ako); the one looking is niya.'
      - type: translate
        prompt_en: We ate this.
        answer_tl: Kinain namin ito.
        accept: ["Kinain natin ito"]
        extra_words: [kami, nito, dito]
        audio: kinain_namin_ito
