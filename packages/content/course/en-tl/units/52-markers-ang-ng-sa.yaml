id: markers-ang-ng-sa
title: Ang, Ng, Sa
description: >-
  The three little markers that hold every Tagalog sentence together — who it
  is about, what or whose, and where or to whom.
tip: >-
  Every noun in a Tagalog sentence wears a marker. "Ang" marks the topic — who
  or what the sentence is about: "Kumain ang bata". "Ng" (say "nang") marks the
  object or the owner: "Kumain ang bata ng mangga", "susi ng kotse". "Sa" marks
  a place, a direction or a receiver: "sa palengke", "Nagbigay ako ng pera sa
  bata". People's names get their own set: si / ni / kay (plural sina / nina /
  kina) — "Nagbigay si Ana ng sulat kay Ben". Pronouns come in the same three
  sets: ako / ko / sa akin, ito / nito / dito. Don't mix up "ng" with the longer
  "nang", which tells how something is done: "Tumakbo siya nang mabilis".
lessons:
  - id: markers-1
    title: Ang — the spotlight
    xp: 10
    exercises:
      - type: choice
        prompt: "In 'Natutulog ang bata', what does 'ang' do?"
        answer: It marks the topic — who the sentence is about
        distractors: [It marks the place, It marks the owner, It makes the sentence a question]
        audio: natutulog_ang_bata
        audio_text: Natutulog ang bata.
      - type: match
        pairs:
          - { tl: ang bata, en: the child }
          - { tl: ang kotse, en: the car }
          - { tl: ang susi, en: the key }
          - { tl: ang bahay, en: the house }
      - type: translate
        prompt_tl: Maganda ang kotse.
        answer_en: The car is beautiful.
        accept: ["The car is nice", "The car is pretty"]
        extra_words: [key, house, big]
        audio: maganda_ang_kotse
      - type: choice
        prompt: "'Susi' means..."
        answer: Key
        distractors: [Car, Door, Bag]
        audio: susi
        audio_text: Susi
      - type: listen
        audio: nasaan_ang_susi
        answer_tl: Nasaan ang susi
        extra_words: [kotse, ng]
      - type: translate
        prompt_tl: Kumakain ang aso.
        answer_en: The dog is eating.
        extra_words: [cat, sleeping, ate]
        audio: kumakain_ang_aso
      - type: fill_blank
        sentence: "Malaki ___ kotse."
        translation: "The car is big."
        answer: ang
        options: [ang, ng, sa]
        hint: 'The thing being described is the topic, so it takes "ang".'
      - type: translate
        prompt_en: The key is small.
        answer_tl: Maliit ang susi.
        extra_words: [ng, kotse, malaki]
        audio: maliit_ang_susi
      - type: translate
        prompt_en: The child is sleeping.
        answer_tl: Natutulog ang bata.
        extra_words: [ng, sa, kumakain]
        audio: natutulog_ang_bata
        hint: 'With -um- and mag- verbs, the doer is the topic and takes "ang".'
