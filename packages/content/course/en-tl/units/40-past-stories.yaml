id: past-stories
title: Telling Stories
description: Tell what happened — narrate your day in the past with kanina, tapos, bago, and noong.
tip: >-
  Completed (past) verbs are easy to spot: -um- verbs look like their plain
  base form (kumain = ate / to eat), and mag- verbs swap mag- for nag-
  (magluto → nagluto = cooked). To chain events like a storyteller, use
  kanina (earlier today), tapos (then), pagkatapos (after), bago (before),
  muna (first), and noong (back when) — "Kumain ako, tapos naglakad kami."
  Note that muna and na follow the verb, never the front: "Uminom muna
  ako." A short pronoun like ka slips in ahead of them: "Uminom ka muna."
lessons:
  - id: stories-1
    title: Earlier today
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: kumain, en: ate }
          - { tl: uminom, en: drank }
          - { tl: pumunta, en: went }
          - { tl: bumili, en: bought }
      - type: choice
        prompt: "'Kanina' means..."
        answer: Earlier today
        distractors: [Yesterday, Tomorrow, Right now]
        audio: kanina
        audio_text: Kanina
      - type: translate
        prompt_tl: Kumain ako kanina.
        answer_en: I ate earlier.
        accept:
          - "I ate earlier today"
        extra_words: [drank, yesterday, slept]
        audio: kumain_ako_kanina
      - type: translate
        prompt_en: I drank coffee earlier.
        answer_tl: Uminom ako ng kape kanina.
        accept:
          - "Kanina ako uminom ng kape"
        extra_words: [kumain, gatas, bukas]
        audio: uminom_ako_ng_kape_kanina
      - type: choice
        prompt: "'Gumising' means..."
        answer: Woke up
        distractors: [Slept, Went home, Took a bath]
        audio: gumising
        audio_text: Gumising
      - type: fill_blank
        sentence: "Pumunta si Maria sa ___ kanina."
        translation: "Maria went to the market earlier."
        answer: palengke
        options: [palengke, paaralan, simbahan]
      - type: listen
        audio: umuwi_ako_kanina
        answer_tl: Umuwi ako kanina
        extra_words: [kumain, bukas]
      - type: choice
        prompt: "'Umuwi' means..."
        answer: Went home
        distractors: [Woke up, Walked, Arrived]
        audio: umuwi
        audio_text: Umuwi
      - type: translate
        prompt_tl: Gumising ako kanina, tapos uminom ako ng kape.
        answer_en: I woke up earlier, then I drank coffee.
        accept:
          - "I woke up earlier then I drank coffee"
          - "I woke up earlier, then drank coffee"
        extra_words: [slept, milk, yesterday]
        audio: gumising_ako_kanina_tapos_uminom_ako_ng_kape
        hint: '"tapos" glues two finished events together — and then...'
