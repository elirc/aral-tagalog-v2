id: doctor
title: At the Doctor
description: Say what hurts, describe a fever or cough, and get medicine and rest.
tip: >-
  To say something hurts, use "masakit" + "ang" + the body part: "Masakit ang
  ulo ko" — my head hurts. Careful: "masakit" means it hurts, while "may sakit
  ako" means I'm sick. When talking to a doctor or any elder, slip in "po":
  "Masakit po ang tiyan ko."
lessons:
  - id: doctor-1
    title: It hurts
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: masakit, en: painful }
          - { tl: ulo, en: head }
          - { tl: tiyan, en: stomach }
          - { tl: ngipin, en: tooth }
      - type: choice
        prompt: "'Masakit ang ulo ko' means..."
        answer: My head hurts
        distractors: [My stomach hurts, My head is big, I have a fever]
        audio: masakit_ang_ulo_ko
        audio_text: Masakit ang ulo ko.
      - type: translate
        prompt_tl: Masakit ang tiyan ko.
        answer_en: My stomach hurts.
        accept: ["My belly hurts", "My stomach is aching"]
        extra_words: [head, tooth, his]
        audio: masakit_ang_tiyan_ko
      - type: translate
        prompt_en: My tooth hurts.
        answer_tl: Masakit ang ngipin ko.
        extra_words: [ulo, paa, mo]
        audio: masakit_ang_ngipin_ko
      - type: fill_blank
        sentence: "Masakit ang ___ ko."
        translation: "My back hurts."
        answer: likod
        options: [likod, ulo, paa]
      - type: listen
        audio: masakit_ang_paa_ko
        answer_tl: Masakit ang paa ko
        extra_words: [kamay, ulo]
      - type: choice
        prompt: "'Sakit' means..."
        answer: Pain or illness
        distractors: [Medicine, Wound, Fever]
        audio: sakit
        audio_text: Sakit
      - type: translate
        prompt_tl: Masakit ang mata niya.
        answer_en: His eye hurts.
        accept: ["Her eye hurts", "His eyes hurt", "Her eyes hurt"]
        extra_words: [my, hand, tooth]
        audio: masakit_ang_mata_niya
      - type: translate
        prompt_tl: Masakit ang likod ko kasi nagtatrabaho ako araw-araw.
        answer_en: My back hurts because I work every day.
        accept: ["My back hurts because I am working every day", "My back hurts because I work everyday"]
        extra_words: [head, sleeping, tomorrow]
        audio: masakit_ang_likod_ko_kasi_nagtatrabaho_ako_araw_araw
        grading: { hyphens: true }
  - id: doctor-2
    title: Fever, cough, and cold
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: lagnat, en: fever }
          - { tl: ubo, en: cough }
          - { tl: sipon, en: a cold }
          - { tl: gamot, en: medicine }
      - type: choice
        prompt: "'May sakit ako' means..."
        answer: I am sick
        distractors: [I am tired, I have a fever, I am fine]
        audio: may_sakit_ako
        audio_text: May sakit ako.
      - type: translate
        prompt_tl: May lagnat ang anak ko.
        answer_en: My child has a fever.
        accept: ["My child has fever"]
        extra_words: [cough, dog, friend]
        audio: may_lagnat_ang_anak_ko
      - type: translate
        prompt_en: I have a cough and a cold.
        answer_tl: May ubo at sipon ako.
        accept: ["May sipon at ubo ako"]
        extra_words: [lagnat, gamot, siya]
        audio: may_ubo_at_sipon_ako
      - type: fill_blank
        sentence: "May ___ ako. Mainit ang katawan ko."
        translation: "I have a fever. My body is hot."
        answer: lagnat
        options: [lagnat, sipon, ubo]
        hint: 'Which sickness makes your body hot?'
      - type: listen
        audio: may_lagnat_ako
        answer_tl: May lagnat ako
        extra_words: [ubo, sipon]
      - type: choice
        prompt: "'Masama ang pakiramdam ko' means..."
        answer: I don't feel well
        distractors: [I feel great, I am tired, My head hurts]
        audio: masama_ang_pakiramdam_ko
        audio_text: Masama ang pakiramdam ko.
      - type: translate
        prompt_tl: Kumusta ang pakiramdam mo?
        answer_en: How are you feeling?
        accept: ["How do you feel?", "How are you feeling now?"]
        extra_words: [name, doctor, why]
        audio: kumusta_ang_pakiramdam_mo
      - type: translate
        prompt_en: I am not going to school today because I am sick.
        answer_tl: Hindi ako pupunta sa paaralan ngayon kasi may sakit ako.
        accept: ["Hindi ako pupunta sa paaralan ngayon dahil may sakit ako"]
        extra_words: [bukas, trabaho, wala]
        audio: hindi_ako_pupunta_sa_paaralan_ngayon_kasi_may_sakit_ako
  - id: doctor-3
    title: Doctor and medicine
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: doktor, en: doctor }
          - { tl: nars, en: nurse }
          - { tl: botika, en: pharmacy }
          - { tl: ospital, en: hospital }
      - type: choice
        prompt: "Where do you buy gamot (medicine)?"
        answer: Botika
        distractors: [Palengke, Simbahan, Paaralan]
        audio: botika
        audio_text: Botika
      - type: translate
        prompt_tl: Pupunta ako sa doktor bukas.
        answer_en: I will go to the doctor tomorrow.
        accept: ["I am going to the doctor tomorrow", "I'm going to the doctor tomorrow"]
        extra_words: [hospital, today, nurse]
        audio: pupunta_ako_sa_doktor_bukas
      - type: translate
        prompt_en: The doctor went to the hospital.
        answer_tl: Pumunta ang doktor sa ospital.
        accept: ["Pumunta sa ospital ang doktor"]
        extra_words: [nars, botika, ako]
        audio: pumunta_ang_doktor_sa_ospital
      - type: fill_blank
        sentence: "Uminom ka ng ___."
        translation: "Take (drink) your medicine."
        answer: gamot
        options: [gamot, tubig, kape]
        hint: 'In Tagalog you "drink" medicine — uminom ng gamot.'
      - type: listen
        audio: uminom_ka_ng_gamot
        answer_tl: Uminom ka ng gamot
        extra_words: [tubig, doktor]
      - type: choice
        prompt: "You're telling the doctor your head hurts. Politely say:"
        answer: Masakit po ang ulo ko.
        distractors: [Masakit ang ulo mo, Mainit po ngayon, Magandang gabi po]
        audio: masakit_po_ang_ulo_ko
        audio_text: Masakit po ang ulo ko.
      - type: translate
        prompt_tl: Uminom siya ng gamot kahapon.
        answer_en: She took medicine yesterday.
        accept: ["He took medicine yesterday", "She drank medicine yesterday", "He drank medicine yesterday"]
        extra_words: [water, tomorrow, coffee]
        audio: uminom_siya_ng_gamot_kahapon
      - type: translate
        prompt_en: My mom bought medicine at the pharmacy.
        answer_tl: Bumili ang nanay ko ng gamot sa botika.
        accept: ["Bumili ng gamot sa botika ang nanay ko", "Bumili ng gamot ang nanay ko sa botika"]
        extra_words: [ospital, tindahan, kumain]
        audio: bumili_ang_nanay_ko_ng_gamot_sa_botika
  - id: doctor-4
    title: Rest and get well
    xp: 10
    exercises:
      - type: choice
        prompt: "'Magpahinga' means..."
        answer: To rest
        distractors: [To sleep, To work, To play]
        audio: magpahinga
        audio_text: Magpahinga
      - type: match
        pairs:
          - { tl: magpahinga, en: to rest }
          - { tl: sugat, en: wound }
          - { tl: lagnat, en: fever }
          - { tl: masakit, en: painful }
      - type: translate
        prompt_en: Rest, because you are sick.
        answer_tl: Magpahinga ka kasi may sakit ka.
        accept: ["Magpahinga ka dahil may sakit ka"]
        extra_words: [ako, pagod, gamot]
        audio: magpahinga_ka_kasi_may_sakit_ka
      - type: choice
        prompt: "'Sugat' means..."
        answer: Wound
        distractors: [Fever, Pain, Cough]
        audio: sugat
        audio_text: Sugat
      - type: translate
        prompt_tl: May sugat ang kamay niya.
        answer_en: His hand has a wound.
        accept: ["Her hand has a wound", "There is a wound on his hand", "There is a wound on her hand", "He has a wound on his hand", "She has a wound on her hand"]
        extra_words: [foot, my, fever]
        audio: may_sugat_ang_kamay_niya
      - type: fill_blank
        sentence: "Nagpapahinga siya kasi ___ siya."
        translation: "She is resting because she is tired."
        answer: pagod
        options: [pagod, masaya, gutom]
      - type: listen
        audio: nagpapahinga_ako_sa_bahay
        answer_tl: Nagpapahinga ako sa bahay
        extra_words: [natutulog, kwarto]
      - type: translate
        prompt_tl: Magpahinga po kayo at uminom ng tubig.
        answer_en: Please rest and drink water.
        accept: ["Rest and drink water", "Please rest and drink some water"]
        extra_words: [medicine, eat, sleep]
        audio: magpahinga_po_kayo_at_uminom_ng_tubig
      - type: choice
        prompt: "Your friend has a fever. What do you say?"
        answer: Magpahinga ka at uminom ka ng gamot.
        distractors: [Kain tayo sa handaan, Maglaro tayo ng basketbol, Bumili ka ng sapatos]
        audio: magpahinga_ka_at_uminom_ka_ng_gamot
        audio_text: Magpahinga ka at uminom ka ng gamot.
  - id: doctor-5
    title: How long has it been?
    xp: 10
    exercises:
      - type: choice
        prompt: "'Gaano katagal?' means..."
        answer: How long?
        distractors: [How much?, How many?, How far?]
        audio: gaano_katagal
        audio_text: Gaano katagal?
      - type: match
        pairs:
          - { tl: gaano katagal, en: how long }
          - { tl: tatlong araw, en: three days }
          - { tl: isang linggo, en: one week }
          - { tl: dalawang buwan, en: two months }
      - type: choice
        prompt: "'Tatlong araw na akong may lagnat' means..."
        answer: I have had a fever for three days now
        distractors: [I had a fever three days ago, I will have a fever for three days, My fever left after three days]
        audio: tatlong_araw_na_akong_may_lagnat
        audio_text: Tatlong araw na akong may lagnat.
        hint: '"na" after a time phrase = it has already been that long.'
      - type: fill_blank
        sentence: "___ katagal na ang ubo mo?"
        translation: "How long have you had your cough?"
        answer: Gaano
        options: [Gaano, Magkano, Kailan]
      - type: listen
        audio: isang_linggo_na_ang_sipon_ko
        answer_tl: Isang linggo na ang sipon ko
        extra_words: [araw, ubo]
      - type: translate
        prompt_tl: Dalawang araw nang masama ang pakiramdam ko.
        answer_en: I have been feeling unwell for two days now.
        accept: ["I have been feeling unwell for two days", "I have felt unwell for two days", "I have been feeling bad for two days now"]
        extra_words: [week, good, tomorrow]
        audio: dalawang_araw_nang_masama_ang_pakiramdam_ko
      - type: translate
        prompt_en: I have had a cough for one week now.
        answer_tl: Isang linggo na akong may ubo.
        accept: ["Isang linggo na po akong may ubo"]
        extra_words: [kahapon, lagnat, siya]
        audio: isang_linggo_na_akong_may_ubo
      - type: translate
        prompt_en: How long has your head been hurting?
        answer_tl: Gaano katagal nang masakit ang ulo mo?
        extra_words: [tiyan, kailan, kanina]
        audio: gaano_katagal_nang_masakit_ang_ulo_mo
        grading: { ng_nang: true }
  - id: doctor-6
    title: More symptoms
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: nahihilo, en: dizzy }
          - { tl: nagsusuka, en: vomiting }
          - { tl: lalamunan, en: throat }
          - { tl: dugo, en: blood }
      - type: choice
        prompt: "'Nahihilo ako' means..."
        answer: I feel dizzy
        distractors: [I am vomiting, I am tired, I have a cold]
        audio: nahihilo_ako
        audio_text: Nahihilo ako.
      - type: translate
        prompt_tl: Masakit ang lalamunan ko at may ubo ako.
        answer_en: My throat hurts and I have a cough.
        accept: ["My throat is sore and I have a cough"]
        extra_words: [head, fever, cold]
        audio: masakit_ang_lalamunan_ko_at_may_ubo_ako
      - type: fill_blank
        sentence: "May ___ ang sugat niya."
        translation: "There is blood on his wound."
        answer: dugo
        options: [dugo, gamot, tubig]
      - type: choice
        prompt: "'Hirap akong huminga' means..."
        answer: I am having a hard time breathing
        distractors: [I am breathing fine, I am very tired, I stopped coughing]
        audio: hirap_akong_huminga
        audio_text: Hirap akong huminga.
        hint: '"hirap" = having a hard time — same root as "mahirap" (difficult).'
      - type: listen
        audio: nagsusuka_ang_anak_ko
        answer_tl: Nagsusuka ang anak ko
        extra_words: [nahihilo, asawa]
      - type: translate
        prompt_en: I feel dizzy and I am vomiting.
        answer_tl: Nahihilo ako at nagsusuka.
        accept: ["Nahihilo at nagsusuka ako"]
        extra_words: [ubo, siya, lagnat]
        audio: nahihilo_ako_at_nagsusuka
      - type: translate
        prompt_tl: Pumunta kami sa ospital kasi hirap siyang huminga.
        answer_en: We went to the hospital because he was having a hard time breathing.
        accept: ["We went to the hospital because she was having a hard time breathing", "We went to the hospital because he had a hard time breathing", "We went to the hospital because she had a hard time breathing"]
        extra_words: [clinic, dizzy, yesterday]
        audio: pumunta_kami_sa_ospital_kasi_hirap_siyang_huminga
  - id: doctor-7
    title: Sa klinika
    xp: 10
    exercises:
      - type: choice
        prompt: "'Klinika' means..."
        answer: Clinic
        distractors: [Pharmacy, Hospital, Office]
        audio: klinika
        audio_text: Klinika
      - type: match
        pairs:
          - { tl: klinika, en: clinic }
          - { tl: doktor, en: doctor }
          - { tl: nars, en: nurse }
          - { tl: gamot, en: medicine }
      - type: translate
        prompt_tl: Ano po ang pakiramdam ninyo ngayon?
        answer_en: How are you feeling now?
        accept: ["What are you feeling now?", "How do you feel now?"]
        extra_words: [name, where, yesterday]
        audio: ano_po_ang_pakiramdam_ninyo_ngayon
        hint: 'A doctor asks politely with "po" and "ninyo".'
      - type: fill_blank
        sentence: "Pumunta ako sa ___ kasi may lagnat ako."
        translation: "I went to the clinic because I have a fever."
        answer: klinika
        options: [klinika, palengke, paaralan]
      - type: listen
        audio: nasaan_po_ang_doktor
        answer_tl: Nasaan po ang doktor
        extra_words: [nars, klinika]
      - type: choice
        prompt: "The nurse asks 'Ano po ang pangalan ninyo?' You reply:"
        answer: Ako po si Ana.
        distractors: [Masakit po ang ulo ko., Magandang umaga po., Tatlong araw na po.]
        audio: ako_po_si_ana
        audio_text: Ako po si Ana.
      - type: translate
        prompt_en: Doctor, my stomach hurts and I feel dizzy.
        answer_tl: Doktor, masakit ang tiyan ko at nahihilo ako.
        accept: ["Doktor, masakit po ang tiyan ko at nahihilo po ako"]
        extra_words: [ulo, siya, lagnat]
        audio: doktor_masakit_ang_tiyan_ko_at_nahihilo_ako
      - type: translate
        prompt_tl: Magandang umaga po, doktor. Masama po ang pakiramdam ko.
        answer_en: Good morning, doctor. I am not feeling well.
        accept: ["Good morning doctor. I am not feeling well", "Good morning, doctor. I don't feel well", "Good morning doctor, I feel unwell"]
        extra_words: [evening, head, nurse]
        audio: magandang_umaga_po_doktor_masama_po_ang_pakiramdam_ko
  - id: doctor-8
    title: Reseta at gamot
    xp: 10
    exercises:
      - type: choice
        prompt: "'Reseta' means..."
        answer: Prescription
        distractors: [Medicine, Receipt, Appointment]
        audio: reseta
        audio_text: Reseta
      - type: match
        pairs:
          - { tl: reseta, en: prescription }
          - { tl: isang beses, en: once }
          - { tl: dalawang beses, en: twice }
          - { tl: tatlong beses, en: three times }
      - type: fill_blank
        sentence: "Uminom ng gamot tatlong ___ sa isang araw."
        translation: "Take medicine three times a day."
        answer: beses
        options: [beses, araw, piso]
      - type: translate
        prompt_tl: Heto po ang reseta ninyo.
        answer_en: Here is your prescription.
        accept: ["Here's your prescription"]
        extra_words: [medicine, my, change]
        audio: heto_po_ang_reseta_ninyo
      - type: listen
        audio: uminom_po_kayo_ng_gamot_dalawang_beses
        answer_tl: Uminom po kayo ng gamot dalawang beses sa isang araw
        extra_words: [tatlong, tubig]
      - type: choice
        prompt: "The doctor hands you medicine. She says:"
        answer: Uminom po kayo ng gamot sa umaga at sa gabi.
        distractors: [Bumili po kayo ng kanin sa palengke., Magandang gabi po., Nasaan po ang banyo?]
        audio: uminom_po_kayo_ng_gamot_sa_umaga_at_sa_gabi
        audio_text: Uminom po kayo ng gamot sa umaga at sa gabi.
      - type: translate
        prompt_en: Take (drink) the medicine twice a day.
        answer_tl: Uminom ng gamot dalawang beses sa isang araw.
        accept: ["Uminom ka ng gamot dalawang beses sa isang araw"]
        extra_words: [tatlong, tubig, bukas]
        audio: uminom_ng_gamot_dalawang_beses_sa_isang_araw
      - type: translate
        prompt_tl: Wala po akong reseta. Pwede po bang bumili ng gamot?
        answer_en: I don't have a prescription. Can I buy medicine?
        accept: ["I have no prescription. Can I buy medicine?", "I don't have a prescription. May I buy medicine?"]
        extra_words: [doctor, water, where]
        audio: wala_po_akong_reseta_pwede_po_bang_bumili_ng_gamot
  - id: doctor-9
    title: Doctor's orders
    xp: 10
    exercises:
      - type: choice
        prompt: "'Magpahinga po kayo sa loob ng tatlong araw' means..."
        answer: Rest for three days
        distractors: [Rest in three days, Work for three days, Come back in three days]
        audio: magpahinga_po_kayo_sa_loob_ng_tatlong_araw
        audio_text: Magpahinga po kayo sa loob ng tatlong araw.
        hint: '"sa loob ng" + a time = for/within that length of time.'
      - type: match
        pairs:
          - { tl: magpahinga, en: to rest }
          - { tl: huwag, en: "don't" }
          - { tl: uminom, en: to drink }
          - { tl: sa loob ng, en: within }
      - type: fill_blank
        sentence: "___ kang magtrabaho ngayon."
        translation: "Don't work today."
        answer: Huwag
        options: [Huwag, Pwede, Gusto]
      - type: translate
        prompt_tl: Huwag kang uminom ng kape ngayon.
        answer_en: Don't drink coffee today.
        accept: ["Do not drink coffee today", "Don't drink coffee now"]
        extra_words: [medicine, tomorrow, eat]
        audio: huwag_kang_uminom_ng_kape_ngayon
      - type: listen
        audio: magpahinga_ka_muna_sa_bahay
        answer_tl: Magpahinga ka muna sa bahay
        extra_words: [ospital, huwag]
      - type: choice
        prompt: "You must stay home from work. Tell your boss politely:"
        answer: May sakit po ako. Magpapahinga po ako sa bahay.
        distractors: [Masaya po ako sa trabaho., Pupunta po ako sa handaan., Gutom po ako.]
        audio: may_sakit_po_ako_magpapahinga_po_ako_sa_bahay
        audio_text: May sakit po ako. Magpapahinga po ako sa bahay.
      - type: translate
        prompt_en: Rest first and drink a lot of water.
        answer_tl: Magpahinga ka muna at uminom ng maraming tubig.
        accept: ["Magpahinga muna at uminom ng maraming tubig"]
        extra_words: [kape, bukas, gamot]
        audio: magpahinga_ka_muna_at_uminom_ng_maraming_tubig
      - type: translate
        prompt_en: Don't play basketball for one week.
        answer_tl: Huwag kang maglaro ng basketbol sa loob ng isang linggo.
        extra_words: [dalawang, trabaho, kahapon]
        audio: huwag_kang_maglaro_ng_basketbol_sa_loob_ng_isang_linggo
  - id: doctor-10
    title: Emergency!
    xp: 10
    exercises:
      - type: choice
        prompt: "'Emerhensiya' means..."
        answer: Emergency
        distractors: [Ambulance, Medicine, Wound]
        audio: emerhensiya
        audio_text: Emerhensiya
      - type: match
        pairs:
          - { tl: emerhensiya, en: emergency }
