        distractors: [Magandang hapon po!, Magkano ang gamot?, Kumain ka na ba?]
        audio: tumawag_ka_ng_ambulansya
        audio_text: Tumawag ka ng ambulansya!
      - type: fill_blank
        sentence: "May ___ ang ulo niya. Pumunta tayo sa ospital!"
        translation: "His head is bleeding. Let's go to the hospital!"
        answer: dugo
        options: [dugo, sipon, sukli]
      - type: listen
        audio: emerhensiya_po_ito
        answer_tl: Emerhensiya po ito
        extra_words: [ambulansya, ospital]
      - type: translate
        prompt_tl: Hirap huminga ang lolo ko. Tumawag kayo ng doktor!
        answer_en: My grandpa is having a hard time breathing. Call a doctor!
        accept: ["My grandfather is having a hard time breathing. Call a doctor!", "My grandpa has a hard time breathing. Call a doctor!"]
        extra_words: [grandma, nurse, slowly]
        audio: hirap_huminga_ang_lolo_ko_tumawag_kayo_ng_doktor
      - type: translate
        prompt_en: This is an emergency. We will go to the hospital now.
        answer_tl: Emerhensiya ito. Pupunta kami sa ospital ngayon.
        accept: ["Emerhensiya po ito. Pupunta po kami sa ospital ngayon"]
        extra_words: [klinika, bukas, siya]
        audio: emerhensiya_ito_pupunta_kami_sa_ospital_ngayon
      - type: translate
        prompt_tl: Nasaan ang pinakamalapit na ospital?
        answer_en: Where is the nearest hospital?
        accept: ["Where is the closest hospital?"]
        extra_words: [pharmacy, far, clinic]
        audio: nasaan_ang_pinakamalapit_na_ospital
  - id: doctor-11
    title: The whole visit
    xp: 15
    exercises:
      - type: match
        pairs:
          - { tl: lagnat, en: fever }
          - { tl: reseta, en: prescription }
          - { tl: nahihilo, en: dizzy }
          - { tl: klinika, en: clinic }
      - type: choice
        prompt: "You arrive at the clinic. The nurse asks 'Ano po ang pakiramdam ninyo?' You say:"
        answer: Masakit po ang ulo ko at nahihilo ako.
