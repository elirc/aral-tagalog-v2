id: work-school
title: Work & School
description: Talk about jobs, workplaces, and what you study.
tip: >-
  "Ano ang trabaho mo?" asks what someone does for a living. Answer with the
  job first and the pronoun after — "Guro ako." (I'm a teacher.) Tagalog has
  no word for "am" or "is", so that is the whole sentence.
lessons:
  - id: work-1
    title: What do you do?
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: guro, en: teacher }
          - { tl: doktor, en: doctor }
          - { tl: nars, en: nurse }
          - { tl: pulis, en: police officer }
      - type: choice
        prompt: "'Guro' means..."
        answer: Teacher
        distractors: [Student, Doctor, Driver]
        audio: guro
        audio_text: Guro
      - type: translate
        prompt_tl: Guro ako.
        answer_en: I am a teacher.
        accept: ["I'm a teacher"]
        extra_words: [doctor, nurse, you]
        audio: guro_ako
      - type: choice
        prompt: "To ask someone what they do for a living, say:"
        answer: Ano ang trabaho mo?
        distractors: [Nasaan ang trabaho mo?, Ilan ang trabaho mo?, Kumusta ang trabaho mo?]
        audio: ano_ang_trabaho_mo
        audio_text: Ano ang trabaho mo?
      - type: translate
        prompt_en: She is a doctor.
        answer_tl: Doktor siya.
        extra_words: [nars, ako, guro]
        hint: The job comes first, the pronoun after.
      - type: fill_blank
        sentence: "___ ang trabaho mo?"
        translation: "What is your job?"
        answer: Ano
        options: [Ano, Sino, Nasaan]
        hint: '"ano" = what.'
      - type: listen
        audio: nars
        answer_tl: Nars
        extra_words: [guro, pulis]
      - type: choice
        prompt: "Where does a 'nars' work?"
        answer: Sa ospital
        distractors: [Sa paaralan, Sa palengke, Sa simbahan]
      - type: translate
        prompt_tl: Pulis ang tatay ko.
        answer_en: My dad is a police officer.
        accept: ["My dad is a policeman", "My father is a police officer", "My father is a policeman"]
        extra_words: [teacher, mom, doctor]
  - id: work-2
    title: Jobs and workplaces
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: magsasaka, en: farmer }
          - { tl: drayber, en: driver }
          - { tl: tindera, en: vendor }
          - { tl: inhinyero, en: engineer }
      - type: choice
        prompt: "'Magsasaka' means..."
        answer: Farmer
        distractors: [Driver, Vendor, Engineer]
        audio: magsasaka
        audio_text: Magsasaka
        hint: 'From "saka" (to farm) — mag- plus a repeated syllable names many jobs.'
      - type: translate
        prompt_tl: Magsasaka ang lolo ko.
        answer_en: My grandfather is a farmer.
        accept: ["My grandpa is a farmer"]
        extra_words: [driver, dad, teacher]
      - type: fill_blank
        sentence: "Nagtatrabaho ang ate ko sa ___."
        translation: "My older sister works in an office."
        answer: opisina
        options: [opisina, palengke, bahay]
      - type: translate
        prompt_en: He is a driver.
        answer_tl: Drayber siya.
        extra_words: [magsasaka, ako, guro]
      - type: listen
        audio: nagtatrabaho_ako_sa_opisina
        answer_tl: Nagtatrabaho ako sa opisina
        extra_words: [paaralan, guro]
      - type: choice
        prompt: "'Mataas ang sahod ko' means..."
        answer: My salary is high
        distractors: [My salary is low, I have no money, My work is hard]
        audio: mataas_ang_sahod_ko
        audio_text: Mataas ang sahod ko.
        hint: '"sahod" is your pay — "mataas ang sahod" = a high salary.'
      - type: translate
        prompt_tl: Ano ang trabaho ng tatay mo?
        answer_en: What is your dad's job?
        accept: ["What does your dad do?", "What is your father's job?", "What does your father do?"]
        extra_words: [where, mom, school]
        audio: ano_ang_trabaho_ng_tatay_mo
      - type: translate
        prompt_en: The vendor is at the market.
        answer_tl: Nasa palengke ang tindera.
        extra_words: [tindahan, opisina, siya]
  - id: work-3
    title: At school
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: estudyante, en: student }
          - { tl: klase, en: class }
          - { tl: unibersidad, en: university }
          - { tl: aralin, en: lesson }
      - type: choice
        prompt: "'Estudyante' means..."
        answer: Student
        distractors: [Teacher, Class, Lesson]
        audio: estudyante
        audio_text: Estudyante
      - type: translate
        prompt_tl: Estudyante ako sa unibersidad.
        answer_en: I am a student at the university.
        accept: ["I'm a student at the university"]
        extra_words: [teacher, market, work]
        audio: estudyante_ako_sa_unibersidad
      - type: fill_blank
        sentence: "May ___ ako sa umaga."
        translation: "I have a class in the morning."
        answer: klase
        options: [klase, aralin, bolpen]
      - type: translate
        prompt_en: The teacher is at school.
        answer_tl: Nasa paaralan ang guro.
        extra_words: [estudyante, opisina, siya]
      - type: choice
        prompt: "'Bolpen' means..."
        answer: Pen
        distractors: [Book, Paper, Class]
        audio: bolpen
        audio_text: Bolpen
        hint: 'From English "ballpen" — the everyday word for a pen.'
      - type: listen
        audio: may_klase_ako_ngayon
        answer_tl: May klase ako ngayon
        extra_words: [aralin, bukas]
      - type: translate
        prompt_tl: Ano ang aralin ngayon?
        answer_en: What is the lesson today?
        accept: ["What's the lesson today?"]
        extra_words: [where, class, teacher]
      - type: fill_blank
        sentence: "Nag-aaral ang mga ___ sa klase."
        translation: "The students are studying in class."
        answer: estudyante
        options: [estudyante, guro, aralin]
        hint: '"mga" makes it plural — mga estudyante = students.'
  - id: work-4
    title: School subjects
    xp: 15
    exercises:
      - type: match
        pairs:
          - { tl: matematika, en: math }
          - { tl: agham, en: science }
          - { tl: kasaysayan, en: history }
          - { tl: Ingles, en: English }
      - type: choice
        prompt: "'Kasaysayan' means..."
        answer: History
        distractors: [Science, Math, English]
        audio: kasaysayan
        audio_text: Kasaysayan
      - type: translate
        prompt_tl: Nag-aaral siya ng agham.
        answer_en: She is studying science.
        accept: ["He is studying science", "She studies science", "He studies science"]
        extra_words: [math, history, book]
        grading: { hyphens: true }
      - type: fill_blank
        sentence: "May ___ kami sa math bukas."
        translation: "We have a test in math tomorrow."
        answer: pagsusulit
        options: [pagsusulit, aralin, sahod]
        hint: '"Matematika" is the formal word — day to day, people just say "math".'
      - type: choice
        prompt: "'Madali ang pagsusulit' means..."
        answer: The test is easy
        distractors: [The test is difficult, There is no test, The test is tomorrow]
        audio: madali_ang_pagsusulit
        audio_text: Madali ang pagsusulit.
      - type: translate
        prompt_en: The English lesson is difficult.
        answer_tl: Mahirap ang aralin sa Ingles.
        extra_words: [madali, pagsusulit, siya]
        hint: '"mahirap" = difficult (it also means poor).'
      - type: listen
        audio: may_pagsusulit_kami_bukas
        answer_tl: May pagsusulit kami bukas
        extra_words: [klase, ngayon]
      - type: match
        pairs:
          - { tl: bolpen, en: pen }
          - { tl: libro, en: book }
          - { tl: pagsusulit, en: test }
          - { tl: aralin, en: lesson }
      - type: translate
        prompt_tl: Magaling siya sa matematika.
        answer_en: She is good at math.
        accept: ["He is good at math", "She's good at math", "He's good at math"]
        extra_words: [difficult, easy, history]
        hint: '"magaling sa..." = good at...'
  - id: work-5
    title: Who does what?
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: nagtuturo, en: teaches }
          - { tl: nagtitinda, en: sells }
          - { tl: nagmamaneho, en: drives }
          - { tl: nagtatrabaho, en: works }
      - type: choice
        prompt: "'Nagtuturo siya' means..."
        answer: She teaches
        distractors: [She studies, She sells, She drives]
        audio: nagtuturo_siya
        audio_text: Nagtuturo siya.
        hint: 'From "turo" (teach): nag- + the repeated "tu" = teaches / is teaching.'
      - type: translate
        prompt_tl: Nagtuturo ng Ingles ang guro ko.
        answer_en: My teacher teaches English.
        accept: ["My teacher is teaching English"]
        extra_words: [math, studies, student]
        audio: nagtuturo_ng_ingles_ang_guro_ko
      - type: fill_blank
        sentence: "Nagmamaneho ng jeepney ang ___."
        translation: "The driver drives a jeepney."
        answer: drayber
        options: [drayber, nars, guro]
      - type: fill_blank
        sentence: "___ ng isda ang tindera sa palengke."
        translation: "The vendor sells fish at the market."
        answer: Nagtitinda
        options: [Nagtitinda, Nagtuturo, Nagmamaneho]
      - type: listen
        audio: nagtitinda_ng_isda_ang_tindera
        answer_tl: Nagtitinda ng isda ang tindera
        extra_words: [nagtuturo, guro]
      - type: choice
        prompt: "Who 'nagtuturo sa paaralan'?"
        answer: Ang guro
        distractors: [Ang drayber, Ang tindera, Ang magsasaka]
      - type: translate
        prompt_en: My dad drives a jeepney.
        answer_tl: Nagmamaneho ng jeepney ang tatay ko.
        accept: ["Nagmamaneho ang tatay ko ng jeepney."]
        extra_words: [nanay, nagtitinda, siya]
        audio: nagmamaneho_ng_jeepney_ang_tatay_ko
      - type: translate
        prompt_en: She teaches math.
        answer_tl: Nagtuturo siya ng matematika.
        accept: ["Nagtuturo siya ng math."]
        extra_words: [nag-aaral, Ingles, ako]
        audio: nagtuturo_siya_ng_matematika
  - id: work-6
    title: Where do you work?
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: ospital, en: hospital }
          - { tl: opisina, en: office }
          - { tl: paaralan, en: school }
          - { tl: palengke, en: market }
      - type: choice
        prompt: "'Saan ka nagtatrabaho?' asks..."
        answer: Where do you work?
        distractors: [What is your job?, When do you work?, Do you like your work?]
        audio: saan_ka_nagtatrabaho
        audio_text: Saan ka nagtatrabaho?
      - type: translate
        prompt_tl: Sa ospital nagtatrabaho ang nanay ko.
        answer_en: My mom works at the hospital.
        accept: ["My mother works at the hospital", "My mom works in the hospital", "My mother works in the hospital"]
        extra_words: [school, dad, office]
        audio: sa_ospital_nagtatrabaho_ang_nanay_ko
        hint: 'Putting "Sa ospital" first stresses the place.'
      - type: fill_blank
        sentence: "Saan ___ nagtatrabaho?"
        translation: "Where do you work?"
        answer: ka
        options: [ka, ko, mo]
        hint: 'Short pronouns like "ka" slip in right after the question word.'
      - type: choice
        prompt: "Where does a magsasaka work?"
        answer: Sa bukid
        distractors: [Sa opisina, Sa ospital, Sa paaralan]
        hint: '"bukid" = farm / field'
      - type: listen
        audio: saan_ka_nagtatrabaho
        answer_tl: Saan ka nagtatrabaho
        accept: ["Saan ka nagtatrabaho?"]
        extra_words: [ano, ako]
      - type: translate
        prompt_tl: Nars siya sa ospital.
        answer_en: She is a nurse at the hospital.
        accept: ["He is a nurse at the hospital", "She's a nurse at the hospital", "He's a nurse at the hospital", "She is a nurse in the hospital", "He is a nurse in the hospital"]
        extra_words: [doctor, office, I]
        audio: nars_siya_sa_ospital
      - type: translate
        prompt_en: I work at an office.
        answer_tl: Nagtatrabaho ako sa opisina.
        accept: ["Sa opisina ako nagtatrabaho."]
        extra_words: [ospital, ka, nag-aaral]
        audio: nagtatrabaho_ako_sa_opisina
      - type: translate
        prompt_en: Where does your older sister work?
        answer_tl: Saan nagtatrabaho ang ate mo?
        extra_words: [ano, kuya, ka]
        audio: saan_nagtatrabaho_ang_ate_mo
  - id: work-7
    title: What time?
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: oras, en: time / hour }
          - { tl: alas-otso, en: "8 o'clock" }
          - { tl: alas-singko, en: "5 o'clock" }
          - { tl: pasok, en: start of work or school }
      - type: choice
        prompt: "'Anong oras na?' asks..."
        answer: What time is it?
        distractors: [How many hours?, Where is the clock?, Are you late?]
        audio: anong_oras_na
        audio_text: Anong oras na?
        hint: '"Anong" = ano + -ng, linking to "oras".'
      - type: choice
        prompt: "Clock times use Spanish numbers. 'Alas-otso' is..."
        answer: "8:00"
        distractors: ["5:00", "7:00", "10:00"]
        audio: alas_otso
        audio_text: Alas-otso
      - type: translate
        prompt_tl: Alas-otso ang pasok ko.
        answer_en: I start at eight o'clock.
        accept: ["I start at 8 o'clock", "I start at eight", "My work starts at eight o'clock", "My school starts at eight o'clock", "My class starts at eight o'clock"]
        extra_words: [five, end, night]
        audio: alas_otso_ang_pasok_ko
        hint: '"pasok" = when you start work or school (literally "going in").'
      - type: fill_blank
        sentence: "Anong ___ ang pasok mo?"
        translation: "What time do you start?"
        answer: oras
        options: [oras, araw, minuto]
      - type: listen
        audio: anong_oras_ang_pasok_mo
        answer_tl: Anong oras ang pasok mo
        accept: ["Anong oras ang pasok mo?"]
        extra_words: [alas-otso, ko]
      - type: choice
        prompt: "Work ends at 5:00 PM. You say the time as..."
        answer: alas-singko
        distractors: [alas-otso, lima, limang minuto]
      - type: translate
        prompt_en: It's eight o'clock.
        answer_tl: Alas-otso na.
        accept: ["Alas-otso."]
        extra_words: [alas-singko, oras, ang]
        audio: alas_otso_na
        grading: { hyphens: true }
      - type: translate
        prompt_en: What time is your class?
        answer_tl: Anong oras ang klase mo?
        extra_words: [ano, araw, ko]
        audio: anong_oras_ang_klase_mo
  - id: work-8
    title: My schedule
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: umaga, en: morning }
          - { tl: tanghali, en: noon }
          - { tl: hapon, en: afternoon }
          - { tl: gabi, en: evening }
      - type: choice
        prompt: "'Tanghali' means..."
        answer: Noon
        distractors: [Morning, Evening, Midnight]
        audio: tanghali
        audio_text: Tanghali
      - type: translate
        prompt_tl: Mula alas-otso hanggang alas-singko ang trabaho ko.
        answer_en: My work is from eight to five.
        accept: ["I work from eight to five", "My work is from 8 to 5", "I work from 8 to 5", "My job is from eight to five"]
        extra_words: [seven, noon, night]
        audio: mula_alas_otso_hanggang_alas_singko_ang_trabaho_ko
        hint: '"mula ... hanggang" = from ... until. You met hanggang giving directions.'
      - type: fill_blank
        sentence: "Kumakain kami sa ___."
        translation: "We eat at noon."
        answer: tanghali
        options: [tanghali, oras, opisina]
      - type: fill_blank
        sentence: "May pasok ako ___ alas-otso hanggang alas-singko."
        translation: "I have work from eight to five."
        answer: mula
        options: [mula, tapos, sa]
      - type: listen
        audio: kumakain_kami_sa_tanghali
        answer_tl: Kumakain kami sa tanghali
        extra_words: [gabi, umaga]
      - type: choice
        prompt: "'Anong oras ka uuwi?' asks..."
        answer: What time will you go home?
        distractors: [What time do you start?, Where do you live?, Are you going to work?]
        audio: anong_oras_ka_uuwi
        audio_text: Anong oras ka uuwi?
        hint: '"uuwi" = will go home.'
      - type: translate
        prompt_en: I'll go home at five.
        answer_tl: Alas-singko ako uuwi.
        accept: ["Uuwi ako ng alas-singko.", "Uuwi ako nang alas-singko."]
        extra_words: [alas-otso, ka, pasok]
        audio: alas_singko_ako_uuwi
        grading: { hyphens: true }
      - type: translate
        prompt_en: I work from eight to five.
        answer_tl: Nagtatrabaho ako mula alas-otso hanggang alas-singko.
        accept: ["Mula alas-otso hanggang alas-singko ako nagtatrabaho."]
        extra_words: [sa, tanghali, ka]
        audio: nagtatrabaho_ako_mula_alas_otso_hanggang_alas_singko
        grading: { hyphens: true }
  - id: work-9
    title: In the classroom
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: makinig, en: to listen }
          - { tl: tanong, en: question }
          - { tl: aralin, en: lesson }
          - { tl: estudyante, en: student }
      - type: choice
        prompt: "The teacher claps and says 'Makinig kayo!' She wants everyone to..."
        answer: Listen
        distractors: [Go home, Write, Sing]
        audio: makinig_kayo
        audio_text: Makinig kayo!
        hint: '"kayo" = you all.'
      - type: choice
        prompt: "You raise your hand to ask something. You say:"
        answer: May tanong po ako.
        distractors: [Makinig po kayo., Wala pong klase., Guro po ako.]
      - type: translate
        prompt_tl: May tanong ba kayo?
        answer_en: Do you have any questions?
        accept: ["Do you have a question?", "Do you have questions?", "Do you all have questions?", "Any questions?"]
        extra_words: [lesson, teacher, I]
        audio: may_tanong_ba_kayo
      - type: fill_blank
        sentence: "Makinig kayo sa ___."
        translation: "Listen to the teacher."
        answer: guro
        options: [guro, libro, bolpen]
      - type: listen
        audio: may_tanong_po_ako
        answer_tl: May tanong po ako
        extra_words: [kayo, wala]
      - type: translate
        prompt_tl: Nasaan ang libro at bolpen mo?
        answer_en: Where are your book and pen?
        accept: ["Where is your book and pen?", "Where are your book and your pen?"]
        extra_words: [my, lesson, class]
        audio: nasaan_ang_libro_at_bolpen_mo
      - type: translate
        prompt_en: Listen to the lesson.
        answer_tl: Makinig kayo sa aralin.
        accept: ["Makinig ka sa aralin."]
        extra_words: [guro, ng, tanong]
        audio: makinig_kayo_sa_aralin
      - type: translate
        prompt_en: I have a question.
        answer_tl: May tanong ako.
        accept: ["May tanong po ako."]
        extra_words: [po, wala, ka]
        audio: may_tanong_ako
  - id: work-10
    title: I don't understand
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: Pakiulit po., en: Please repeat. }
          - { tl: Dahan-dahan po., en: "Slowly, please." }
          - { tl: Hindi ko po naiintindihan., en: "I don't understand." }
          - { tl: May tanong po ako., en: I have a question. }
      - type: choice
        prompt: "'Hindi ko naiintindihan' means..."
        answer: I don't understand
        distractors: [I don't know, I don't like it, I can't hear]
        audio: hindi_ko_naiintindihan
        audio_text: Hindi ko naiintindihan.
        hint: 'From "intindi" (understand). To a teacher, add po: Hindi ko po naiintindihan.'
      - type: choice
        prompt: "The teacher spoke too fast. You ask her to say it again:"
        answer: Pakiulit po.
        distractors: [Makinig po kayo., Salamat po., Paalam po.]
        hint: '"paki-" + a verb root = please do it: pakiulit = please repeat.'
      - type: translate
        prompt_tl: Pakiulit po, dahan-dahan lang.
        answer_en: Please repeat, slowly.
        accept: ["Please repeat that slowly", "Please repeat it slowly", "Please repeat, just slowly", "Please say it again, slowly"]
        extra_words: [fast, question, teacher]
        audio: pakiulit_po_dahan_dahan_lang
      - type: fill_blank
        sentence: "Hindi ko po ___."
        translation: "I don't understand."
        answer: naiintindihan
        options: [naiintindihan, nag-aaral, makinig]
      - type: listen
        audio: dahan_dahan_po
        answer_tl: Dahan-dahan po
        extra_words: [lang, pakiulit]
        grading: { hyphens: true }
      - type: translate
        prompt_tl: Naiintindihan mo ba ang aralin?
        answer_en: Do you understand the lesson?
        extra_words: [question, teacher, don't]
        audio: naiintindihan_mo_ba_ang_aralin
      - type: translate
        prompt_en: I don't understand the question.
        answer_tl: Hindi ko naiintindihan ang tanong.
        accept: ["Hindi ko po naiintindihan ang tanong."]
        extra_words: [aralin, mo, ba]
        audio: hindi_ko_naiintindihan_ang_tanong
      - type: translate
        prompt_en: Slowly, please.
        answer_tl: Dahan-dahan po.
        accept: ["Dahan-dahan lang po."]
        extra_words: [pakiulit, lang, ako]
        audio: dahan_dahan_po
        grading: { hyphens: true }
  - id: work-11
    title: A day at work and school
    xp: 10
    exercises:
      - type: choice
        prompt: "A classmate asks 'Ano ang trabaho ng nanay mo?' Your mom teaches at a university. You answer:"
        answer: Nagtuturo siya sa unibersidad.
        distractors: [Nag-aaral siya sa unibersidad., Nagtitinda siya sa palengke., Nagmamaneho siya ng jeepney.]
        audio: ano_ang_trabaho_ng_nanay_mo
        audio_text: Ano ang trabaho ng nanay mo?
      - type: translate
        prompt_tl: Mula alas-otso hanggang alas-singko ang klase ko, tapos uuwi ako.
        answer_en: My classes are from eight to five, then I go home.
        accept: ["My class is from eight to five, then I go home", "My classes are from eight to five, then I'll go home", "My class is from eight to five, then I'll go home", "My classes are from eight to five, then I will go home"]
        extra_words: [seven, work, noon]
        audio: mula_alas_otso_hanggang_alas_singko_ang_klase_ko
      - type: fill_blank
        sentence: "Anong oras ang ___ mo bukas?"
        translation: "What time do you start tomorrow?"
        answer: pasok
        options: [pasok, tanong, baha]
      - type: match
        pairs:
          - { tl: nagtitinda, en: sells }
          - { tl: tanghali, en: noon }
          - { tl: pakiulit, en: please repeat }
          - { tl: mula, en: from }
      - type: listen
        audio: hindi_ko_po_naiintindihan
        answer_tl: Hindi ko po naiintindihan
        extra_words: [mo, makinig]
      - type: translate
        prompt_en: My older brother is an engineer. He works in an office.
