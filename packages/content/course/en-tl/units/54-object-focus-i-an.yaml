id: object-focus-i-an
title: I- and -AN Verbs
description: >-
  Two more object-focus families: i- verbs for things you move or hand over,
  and -an verbs for the person, place or surface you act on — plus commands
  like "Buksan mo ang pinto."
tip: >-
  Not every object-focus verb takes -in. Verbs for moving or handing something
  over take i-: ibigay (give), ilagay (put), itapon (throw away). Past adds
  -in- after the i: ibinigay; ongoing doubles the next syllable: ibinibigay;
  future drops the -in-: ibibigay. Verbs aimed at a person, place or surface
  take -an: buksan (open), hugasan (wash), tulungan (help) — binuksan,
  binubuksan, bubuksan. The doer is still ko/mo/niya or ng, and the thing in
  focus still takes ang: "Ibinigay ko ang susi kay Tatay." Compare "Ibinigay ko
  ang regalo kay Lola" (the gift is in focus) with "Binigyan ko si Lola ng
  regalo" (Lola is in focus). For commands just use the base form with mo:
  "Buksan mo ang pinto." "Huwag mong itapon!" Add paki- to ask nicely.
lessons:
  - id: ofian-1
    title: Ibigay — hand it over
    xp: 10
    exercises:
      - type: choice
        prompt: "'Ibigay' means..."
        answer: To give (something)
        distractors: [To take (something), To buy (something), To look for (something)]
        audio: ibigay
        audio_text: Ibigay
      - type: match
        pairs:
          - { tl: ibigay, en: to give }
          - { tl: ibinigay, en: gave }
          - { tl: ibinibigay, en: is giving }
          - { tl: ibibigay, en: will give }
          - { tl: susi, en: key }
      - type: translate
        prompt_tl: Ibinigay ko ang susi kay Tatay.
        answer_en: I gave the key to Dad.
        accept: ["I gave Dad the key", "I gave the key to my dad", "I gave the key to Father"]
        extra_words: [letter, will, Mom]
        audio: ibinigay_ko_ang_susi_kay_tatay
      - type: choice
        prompt: "'Ibibigay ko ang sulat kay Lola bukas' means..."
        answer: I will give the letter to Grandma tomorrow
        distractors:
          - I gave the letter to Grandma yesterday
          - Grandma will give me the letter tomorrow
          - I am giving the key to Grandma now
        audio: ibibigay_ko_ang_sulat_kay_lola_bukas
        audio_text: Ibibigay ko ang sulat kay Lola bukas.
      - type: fill_blank
        sentence: "___ ko ang pera sa tindera kanina."
        translation: "I gave the money to the vendor earlier."
        answer: Ibinigay
        options: [Ibinigay, Ibibigay, Nagbigay]
        hint: 'With "ko" and an ang-object you need the object-focus form; "kanina" makes it completed: ibinigay.'
      - type: listen
        audio: ibinigay_niya_ang_susi_sa_akin
        answer_tl: Ibinigay niya ang susi sa akin
        extra_words: [sulat, ibibigay]
      - type: translate
        prompt_tl: Ibinibigay ng guro ang mga libro sa mga bata.
        answer_en: The teacher is giving the books to the children.
        accept:
          - "The teacher is giving the books to the kids"
          - "The teacher gives the books to the children"
          - "The teacher is giving the children the books"
        extra_words: [gave, letters, doctor]
        audio: ibinibigay_ng_guro_ang_mga_libro_sa_mga_bata
      - type: translate
        prompt_en: Give the letter to Mom.
        answer_tl: Ibigay mo ang sulat kay Nanay.
        accept: ["Ibigay mo kay Nanay ang sulat"]
        extra_words: [susi, ibinigay, si]
        audio: ibigay_mo_ang_sulat_kay_nanay
        hint: 'Command = base form + mo. The thing given takes "ang"; the receiver takes "kay" (names) or "sa".'
      - type: translate
        prompt_en: I will give the key to you later.
        answer_tl: Ibibigay ko ang susi sa iyo mamaya.
        accept:
          - "Ibibigay ko sa iyo ang susi mamaya"
          - "Ibibigay ko sa iyo mamaya ang susi"
          - "Ibibigay ko mamaya ang susi sa iyo"
          - "Ibibigay ko ang susi sa'yo mamaya"
          - "Ibibigay ko sa'yo ang susi mamaya"
          - "Mamaya ko ibibigay ang susi sa iyo"
          - "Mamaya ko ibibigay sa iyo ang susi"
        extra_words: [ibinigay, sulat, kahapon]
        audio: ibibigay_ko_ang_susi_sa_iyo_mamaya
