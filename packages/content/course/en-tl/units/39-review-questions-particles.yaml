id: review-questions-particles
title: "Review: Questions & Particles"
description: Ask real questions and answer like a local — stack na, pa, and ba onto ano, saan, and kailan.
tip: >-
  Question words and particles stack in a fixed order: question word, then the
  one-syllable pronoun (ka, mo), then na or pa, then ba last — two-syllable pronouns like ako and siya come after the particles instead ("Uminom na ako") — "Saan ka na ba
  pupunta?" (So where are you off to now?). The pair na/pa flips the meaning of
  the same question: "Ano na?" asks what's happening now, "Ano pa?" asks what
  else. And "ba" marks the question by itself, so the word order never
  changes — "Masarap ito." becomes "Masarap ba ito?"
lessons:
  - id: revquest-1
    title: The question words again
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: ano, en: what }
          - { tl: sino, en: who }
          - { tl: saan, en: where (to) }
          - { tl: kailan, en: when }
      - type: choice
        prompt: "Which one asks where something IS right now?"
        answer: Nasaan ang nanay mo?
        distractors:
          - Saan ka pupunta?
          - Sino ang nanay mo?
          - Kailan ka pupunta?
        audio: nasaan_ang_nanay_mo
        audio_text: Nasaan ang nanay mo?
      - type: translate
        prompt_tl: Sino ang guro mo?
        answer_en: Who is your teacher?
        extra_words: [what, where, friend]
        audio: sino_ang_guro_mo
      - type: translate
        prompt_en: Where are you going now?
        answer_tl: Saan ka pupunta ngayon?
        accept: ["Saan po kayo pupunta ngayon?"]
        extra_words: [nasaan, kailan, bukas]
        audio: saan_ka_pupunta_ngayon
        hint: '"Saan" pairs with an action; "nasaan" asks where a thing is.'
      - type: fill_blank
        sentence: "___ ang pagsusulit?"
        translation: "When is the test?"
        answer: Kailan
        options: [Kailan, Ilan, Magkano]
      - type: listen
        audio: bakit_ka_pagod
        answer_tl: Bakit ka pagod
        extra_words: [paano, masaya]
      - type: choice
        prompt: "'Magkano ang manok?' asks about the..."
        answer: Price
        distractors: [Number, Time, Reason]
        audio: magkano_ang_manok
        audio_text: Magkano ang manok?
      - type: translate
        prompt_tl: Ilan ang anak nila?
        answer_en: How many children do they have?
        accept:
          - "How many kids do they have?"
          - "How many children do they have"
        extra_words: [much, when, siblings]
        audio: ilan_ang_anak_nila
      - type: translate
        prompt_en: Why did you go to the hospital yesterday?
        answer_tl: Bakit ka pumunta sa ospital kahapon?
        accept: ["Bakit po kayo pumunta sa ospital kahapon?"]
        extra_words: [paano, botika, bukas]
        audio: bakit_ka_pumunta_sa_ospital_kahapon
