id: review-verb-forms
title: "Review: All Verb Forms"
description: One root, three shapes — say what you did, what you are doing, and what you will do.
tip: >-
  Every Tagalog verb you have met has three shapes. Completed: kumain, uminom,
  nagluto. Ongoing — and habits too: double the root's first syllable and keep
  the -um-/nag- marker → kumakain, umiinom, nagluluto. Contemplated (future):
  double the same syllable, but drop -um- entirely and swap nag- for mag- →
  kakain, iinom, magluluto. The time word tells you which to reach for:
  kahapon and kanina take the completed form, ngayon and araw-araw the ongoing
  one, bukas and mamaya the future.
lessons:
  - id: revverbs-1
    title: Kahapon, ngayon, bukas
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: kumain, en: ate }
          - { tl: kumakain, en: eating }
          - { tl: kakain, en: will eat }
          - { tl: iinom, en: will drink }
      - type: choice
        prompt: "Which sentence means 'I will eat tomorrow'?"
        answer: Kakain ako bukas.
        distractors: [Kumain ako kahapon., Kumakain ako ngayon., Kumain ako bukas.]
        audio: kakain_ako_bukas
        audio_text: Kakain ako bukas.
      - type: translate
        prompt_tl: Kumakain ako ngayon.
        answer_en: I am eating now.
        accept: ["I'm eating now", "I am eating right now"]
        extra_words: [ate, tomorrow, drank]
        audio: kumakain_ako_ngayon
      - type: translate
        prompt_tl: Kumain ako kahapon.
        answer_en: I ate yesterday.
        accept: ["Yesterday I ate"]
        extra_words: [eating, tomorrow, will]
        audio: kumain_ako_kahapon
      - type: translate
        prompt_en: She will drink milk tomorrow.
        answer_tl: Iinom siya ng gatas bukas.
        accept:
          - "Bukas, iinom siya ng gatas"
          - "Iinom siya bukas ng gatas"
          - "Bukas siya iinom ng gatas"
        extra_words: [uminom, kape, kahapon]
        audio: iinom_siya_ng_gatas_bukas
        hint: 'Future of "uminom": drop the -um- and double the first syllable → iinom.'
      - type: fill_blank
        sentence: "___ ako ng kape kahapon."
        translation: "I drank coffee yesterday."
        answer: Uminom
        options: [Uminom, Umiinom, Iinom]
        hint: '"Kahapon" is done and over — the completed form has no doubled syllable.'
      - type: listen
        audio: kumakain_kami_ngayon
        answer_tl: Kumakain kami ngayon
        extra_words: [kumain, bukas]
      - type: choice
        prompt: "Which form of 'to drink' goes with 'kahapon' (yesterday)?"
        answer: Uminom
        distractors: [Umiinom, Iinom, Inom]
        audio: uminom
        audio_text: Uminom
      - type: translate
        prompt_tl: Kumain ako kahapon, kumakain ako ngayon, at kakain ako bukas.
        answer_en: I ate yesterday, I am eating now, and I will eat tomorrow.
        accept:
          - "I ate yesterday, I'm eating now, and I will eat tomorrow"
          - "I ate yesterday, I am eating now and I will eat tomorrow"
        extra_words: [drank, drinking, rice]
        audio: kumain_ako_kahapon_kumakain_ako_ngayon_at_kakain_ako_bukas
