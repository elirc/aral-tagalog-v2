id: beach-islands
title: Beach & Islands
description: Talk about the sea, sand, and islands — swimming, boats, and a sunny beach vacation.
tip: >-
  Many weather and nature words are just a noun with "ma-" in front: araw (sun) →
  maaraw (sunny), ulan → maulan, hangin → mahangin, init → mainit. "Tabing-dagat"
  is literally "edge of the sea". The Philippines is an archipelago of 7,641
  islands, so almost every town is within a few hours of one.
lessons:
  - id: beach-1
    title: The sea and the sand
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: dagat, en: sea }
          - { tl: buhangin, en: sand }
          - { tl: alon, en: wave }
          - { tl: isla, en: island }
      - type: choice
        prompt: "'Buhangin' means..."
        answer: Sand
        distractors: [Sea, Wave, Island]
        audio: buhangin
        audio_text: Buhangin
      - type: translate
        prompt_tl: Maganda ang dagat.
        answer_en: The sea is beautiful.
        accept: ["The ocean is beautiful"]
        extra_words: [sand, mountain, big]
        audio: maganda_ang_dagat
      - type: translate
        prompt_en: The sand is hot.
        answer_tl: Mainit ang buhangin.
        extra_words: [malamig, dagat, alon]
        audio: mainit_ang_buhangin
      - type: fill_blank
        sentence: "Malakas ang ___ ngayon."
        translation: "The waves are strong today."
        answer: alon
        options: [alon, buhangin, isla]
      - type: choice
        prompt: "'Isla' means..."
        answer: Island
        distractors: [Mountain, River, Beach]
        audio: isla
        audio_text: Isla
      - type: listen
        audio: malaki_ang_alon
        answer_tl: Malaki ang alon
        extra_words: [buhangin, dagat]
      - type: translate
        prompt_tl: Pumunta kami sa tabing-dagat.
        answer_en: We went to the beach.
        accept: ["We went to the seaside", "We went to the shore"]
        extra_words: [mountain, market, they]
        audio: pumunta_kami_sa_tabing_dagat
        grading: { hyphens: true }
      - type: translate
        prompt_en: We want to go to the beach tomorrow.
        answer_tl: Gusto naming pumunta sa tabing-dagat bukas.
        accept: ["Bukas, gusto naming pumunta sa tabing-dagat"]
        extra_words: [bundok, palengke, ako]
        audio: gusto_naming_pumunta_sa_tabing_dagat_bukas
        grading: { hyphens: true }
        hint: '"gusto namin" + a verb → "gusto naming".'
  - id: beach-2
    title: Swimming and boats
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: lumangoy, en: to swim }
          - { tl: lumalangoy, en: swimming }
          - { tl: bangka, en: boat }
          - { tl: mangingisda, en: fisherman }
      - type: choice
        prompt: "'Lumangoy' means..."
        answer: To swim
        distractors: [To walk, To ride, To play]
        audio: lumangoy
        audio_text: Lumangoy
      - type: translate
        prompt_tl: Lumalangoy sila sa dagat.
        answer_en: They are swimming in the sea.
        accept: ["They swim in the sea", "They are swimming in the ocean"]
        extra_words: [walking, boat, sand]
        audio: lumalangoy_sila_sa_dagat
      - type: translate
        prompt_en: I like to swim.
        answer_tl: Gusto kong lumangoy.
        extra_words: [sumayaw, kumanta, siya]
        audio: gusto_kong_lumangoy
      - type: fill_blank
        sentence: "Sumakay kami sa ___."
        translation: "We rode a boat."
        answer: bangka
        options: [bangka, jeepney, bundok]
      - type: choice
        prompt: "'Bangka' means..."
        answer: Boat
        distractors: [Jeepney, Island, Wave]
        audio: bangka
        audio_text: Bangka
      - type: listen
        audio: lumalangoy_ako_sa_dagat
        answer_tl: Lumalangoy ako sa dagat
        extra_words: [bangka, buhangin]
      - type: translate
        prompt_tl: Maraming isda sa dagat.
        answer_en: There are many fish in the sea.
        accept: ["There are a lot of fish in the sea", "There is a lot of fish in the sea"]
        extra_words: [sand, boat, small]
        audio: maraming_isda_sa_dagat
      - type: translate
        prompt_en: The fisherman went to the sea yesterday.
        answer_tl: Pumunta ang mangingisda sa dagat kahapon.
        accept: ["Kahapon pumunta sa dagat ang mangingisda", "Kahapon pumunta ang mangingisda sa dagat", "Pumunta sa dagat ang mangingisda kahapon"]
        extra_words: [bundok, bukas, bangka]
        audio: pumunta_ang_mangingisda_sa_dagat_kahapon
  - id: beach-3
    title: A sunny day
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: maaraw, en: sunny }
          - { tl: sikat ng araw, en: sunshine }
          - { tl: malinaw, en: clear }
          - { tl: mainit, en: hot }
      - type: choice
        prompt: "'Maaraw' means..."
        answer: Sunny
        distractors: [Rainy, Windy, Cold]
        audio: maaraw
        audio_text: Maaraw
      - type: translate
        prompt_tl: Maaraw ngayon sa tabing-dagat.
        answer_en: It is sunny at the beach today.
        accept: ["It's sunny at the beach today", "Today it is sunny at the beach"]
        extra_words: [rainy, mountain, cold]
        audio: maaraw_ngayon_sa_tabing_dagat
        grading: { hyphens: true }
      - type: translate
        prompt_en: The water is clear.
        answer_tl: Malinaw ang tubig.
        extra_words: [malamig, dagat, buhangin]
        audio: malinaw_ang_tubig
      - type: fill_blank
        sentence: "Mainit ang ___ ng araw."
        translation: "The sunshine is hot."
        answer: sikat
        options: [sikat, ulan, hangin]
      - type: choice
        prompt: "It starts to rain while you are at the beach. Say:"
        answer: Umuulan sa tabing-dagat.
        distractors: [Maaraw sa tabing-dagat., Malinaw ang tubig., Mainit ang buhangin.]
        audio: umuulan_sa_tabing_dagat
        audio_text: Umuulan sa tabing-dagat.
      - type: listen
        audio: maaraw_at_mainit_ngayon
        answer_tl: Maaraw at mainit ngayon
        extra_words: [malamig, umuulan]
      - type: translate
        prompt_tl: Malamig ang tubig pero masaya kami.
        answer_en: The water is cold but we are happy.
        accept: ["The water is cold, but we're happy", "The water is cold but we're happy"]
        extra_words: [hot, sad, they]
        audio: malamig_ang_tubig_pero_masaya_kami
        hint: '"pero" means "but" — the everyday word for it.'
      - type: translate
        prompt_en: We are going to the beach because it is sunny today.
        answer_tl: Pupunta kami sa tabing-dagat dahil maaraw ngayon.
        accept: ["Pupunta kami sa tabing-dagat kasi maaraw ngayon", "Dahil maaraw ngayon, pupunta kami sa tabing-dagat"]
        extra_words: [umuulan, bundok, malamig]
        audio: pupunta_kami_sa_tabing_dagat_dahil_maaraw_ngayon
        grading: { hyphens: true }
  - id: beach-4
    title: Island vacation
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: bakasyon, en: vacation }
          - { tl: buko, en: young coconut }
          - { tl: isla, en: island }
          - { tl: mangingisda, en: fisherman }
      - type: choice
        prompt: "'Bakasyon' means..."
        answer: Vacation
        distractors: [Birthday, Party, Work]
        audio: bakasyon
        audio_text: Bakasyon
      - type: translate
        prompt_tl: Sa bakasyon, pupunta kami sa isla.
        answer_en: On vacation, we will go to the island.
        accept: ["We will go to the island on vacation", "We're going to the island on vacation", "On vacation we are going to the island"]
        extra_words: [mountain, market, yesterday]
        audio: sa_bakasyon_pupunta_kami_sa_isla
      - type: translate
        prompt_en: There are many islands in the Philippines.
        answer_tl: Maraming isla sa Pilipinas.
        accept: ["Sa Pilipinas, maraming isla"]
        extra_words: [bundok, bangka, maliit]
        audio: maraming_isla_sa_pilipinas
      - type: fill_blank
        sentence: "Umiinom kami ng ___ sa tabing-dagat."
        translation: "We are drinking young coconut at the beach."
        answer: buko
        options: [buko, kape, gatas]
        grading: { hyphens: true }
      - type: choice
        prompt: "Another Tagalog word for 'isla' is..."
        answer: Pulo
        distractors: [Dagat, Bangka, Buhangin]
        audio: pulo
        audio_text: Pulo
      - type: listen
        audio: masaya_ang_bakasyon_namin
        answer_tl: Masaya ang bakasyon namin
        extra_words: [malungkot, isla]
      - type: translate
        prompt_en: She wants to swim at the beach.
        answer_tl: Gusto niyang lumangoy sa tabing-dagat.
        extra_words: [sumayaw, kumanta, bundok]
        audio: gusto_niyang_lumangoy_sa_tabing_dagat
        grading: { hyphens: true }
      - type: translate
        prompt_tl: Araw-araw siyang lumalangoy sa dagat.
        answer_en: He swims in the sea every day.
        accept: ["She swims in the sea every day", "He is swimming in the sea every day", "She is swimming in the sea every day", "Every day he swims in the sea", "Every day she swims in the sea"]
        extra_words: [walks, boat, sand]
        audio: araw_araw_siyang_lumalangoy_sa_dagat
        grading: { hyphens: true }
      - type: translate
        prompt_en: We ate fish and drank young coconut at the beach.
        answer_tl: Kumain kami ng isda at uminom ng buko sa tabing-dagat.
        extra_words: [kanin, gatas, bundok]
        audio: kumain_kami_ng_isda_at_uminom_ng_buko_sa_tabing_dagat
        grading: { hyphens: true }
  - id: beach-5
    title: Magdala tayo!
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: magdala, en: to bring }
          - { tl: tuwalya, en: towel }
          - { tl: tsinelas, en: flip-flops }
          - { tl: baon, en: packed food }
      - type: choice
        prompt: "'Magdala ka ng tuwalya' means..."
        answer: Bring a towel
        distractors: [Buy a towel, Wash the towel, Here is a towel]
        audio: magdala_ka_ng_tuwalya
        audio_text: Magdala ka ng tuwalya.
        hint: '"magdala" = to bring; "Magdala ka ng ..." = bring some ...'
      - type: translate
        prompt_tl: Nagdala kami ng baon sa tabing-dagat.
        answer_en: We brought packed food to the beach.
        accept: ["We brought food to the beach"]
        extra_words: [bought, mountain, towel]
        audio: nagdala_kami_ng_baon_sa_tabing_dagat
        grading: { hyphens: true }
        hint: '"baon" is food (or money) you pack and take along.'
      - type: fill_blank
        sentence: "Magdala ka ng ___ kasi mainit ang buhangin."
        translation: "Bring flip-flops because the sand is hot."
        answer: tsinelas
        options: [tsinelas, tuwalya, baon]
      - type: listen
        audio: magdadala_ako_ng_tubig_at_baon
        answer_tl: Magdadala ako ng tubig at baon
        extra_words: [tuwalya, kami]
        hint: '"magdadala" = will bring.'
      - type: choice
        prompt: "It is a very sunny day at the beach. What should you bring?"
        answer: Sombrero at tubig
        distractors: [Kalan at kawali, Libro at bolpen, Kama at silya]
      - type: translate
        prompt_tl: May tuwalya ka ba?
        answer_en: Do you have a towel?
        extra_words: [flip-flops, food, sand]
        audio: may_tuwalya_ka_ba
      - type: translate
        prompt_en: Bring water and a towel.
        answer_tl: Magdala ka ng tubig at tuwalya.
        accept: ["Magdala ka ng tuwalya at tubig"]
        extra_words: [baon, kami, dagat]
        audio: magdala_ka_ng_tubig_at_tuwalya
      - type: translate
        prompt_en: We will bring packed food to the island.
        answer_tl: Magdadala kami ng baon sa isla.
        extra_words: [nagdala, tuwalya, sila]
        audio: magdadala_kami_ng_baon_sa_isla
  - id: beach-6
    title: Mag-ingat sa tubig
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: malalim, en: deep }
          - { tl: mababaw, en: shallow }
          - { tl: salbabida, en: life ring }
          - { tl: alon, en: wave }
      - type: choice
        prompt: "'Malalim ang dagat doon' means..."
        answer: The sea is deep over there
        distractors:
          - The sea is shallow over there
          - The sea is cold over there
          - The sea is clear over there
        audio: malalim_ang_dagat_doon
        audio_text: Malalim ang dagat doon.
      - type: translate
        prompt_tl: Mababaw ang tubig dito.
        answer_en: The water is shallow here.
        accept: ["The water here is shallow"]
        extra_words: [deep, there, cold]
        audio: mababaw_ang_tubig_dito
      - type: fill_blank
        sentence: "Huwag kang lumangoy doon, ___ ang tubig."
        translation: "Don't swim there, the water is deep."
        answer: malalim
        options: [malalim, mababaw, malinaw]
      - type: listen
        audio: mag_ingat_ka_malakas_ang_alon
        answer_tl: Mag-ingat ka, malakas ang alon
        extra_words: [malalim, ako]
        hint: '"Mag-ingat ka" = be careful / take care.'
      - type: choice
        prompt: "A little boy cannot swim yet. What does he need in the water?"
        answer: Salbabida
        distractors: [Tsinelas, Tuwalya, Baon]
      - type: translate
        prompt_tl: May salbabida ang bata.
        answer_en: The child has a life ring.
        accept: ["The kid has a life ring"]
        extra_words: [towel, deep, sea]
        audio: may_salbabida_ang_bata
      - type: translate
        prompt_en: Don't swim there because it's deep.
        answer_tl: Huwag kang lumangoy doon kasi malalim.
        accept: ["Huwag kang lumangoy doon dahil malalim"]
        extra_words: [mababaw, dito, ako]
        audio: huwag_kang_lumangoy_doon_kasi_malalim
      - type: translate
        prompt_en: Let's swim here because the water is shallow.
        answer_tl: Lumangoy tayo dito kasi mababaw ang tubig.
        accept: ["Lumangoy tayo dito dahil mababaw ang tubig"]
        extra_words: [malalim, doon, kami]
        audio: lumangoy_tayo_dito_kasi_mababaw_ang_tubig
  - id: beach-7
    title: Maglibot sa mga isla
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: maglibot, en: to tour around }
          - { tl: bangka, en: boat }
          - { tl: isla, en: island }
          - { tl: mangingisda, en: fisherman }
      - type: choice
        prompt: "'Maglilibot kami sa mga isla bukas' means..."
        answer: We will tour the islands tomorrow
        distractors:
          - We toured the islands yesterday
          - We live on an island
          - We will swim to the island tomorrow
        audio: maglilibot_kami_sa_mga_isla_bukas
        audio_text: Maglilibot kami sa mga isla bukas.
        hint: '"maglibot" = to go around / tour — island hopping is "maglibot sa mga isla".'
      - type: translate
        prompt_tl: Sumakay kami sa bangka at pumunta kami sa tatlong isla.
        answer_en: We rode a boat and went to three islands.
        accept: ["We took a boat and went to three islands", "We rode a boat and we went to three islands"]
        extra_words: [two, swam, mountain]
        audio: sumakay_kami_sa_bangka_at_pumunta_kami_sa_tatlong_isla
      - type: fill_blank
        sentence: "Naglibot kami sa limang ___ kahapon."
        translation: "We toured five islands yesterday."
        answer: isla
        options: [isla, alon, bangka]
      - type: listen
        audio: maglilibot_tayo_sa_mga_isla
        answer_tl: Maglilibot tayo sa mga isla
        extra_words: [kami, bangka]
      - type: choice
        prompt: "The boatman says 'Tatlong isla tayo ngayon.' How many islands will you visit today?"
        answer: Three
        distractors: [Two, Four, Five]
        audio: tatlong_isla_tayo_ngayon
        audio_text: Tatlong isla tayo ngayon.
      - type: translate
        prompt_tl: Maganda ang maliit na pulo.
        answer_en: The small island is beautiful.
        accept: ["The little island is beautiful", "The small islet is beautiful"]
        extra_words: [big, boat, sea]
        audio: maganda_ang_maliit_na_pulo
      - type: translate
        prompt_en: The boat is heading to the island.
        answer_tl: Papunta sa isla ang bangka.
        accept: ["Papunta ang bangka sa isla"]
        extra_words: [bundok, bus, kami]
        audio: papunta_sa_isla_ang_bangka
        hint: '"papunta sa" = on the way to / heading to.'
      - type: translate
        prompt_en: The fisherman's boat is small but fast.
        answer_tl: Maliit pero mabilis ang bangka ng mangingisda.
        accept: ["Maliit ang bangka ng mangingisda pero mabilis"]
        extra_words: [malaki, mabagal, isla]
        audio: maliit_pero_mabilis_ang_bangka_ng_mangingisda
  - id: beach-8
    title: Sumisid tayo!
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: sumisid, en: to dive }
          - { tl: kabibe, en: seashell }
          - { tl: isda, en: fish }
          - { tl: malinaw, en: clear }
      - type: choice
        prompt: "'Sumisid siya sa dagat' means..."
        answer: He dived into the sea
        distractors: [He swam across the sea, He fished in the sea, He looked at the sea]
        audio: sumisid_siya_sa_dagat
        audio_text: Sumisid siya sa dagat.
        hint: '"sumisid" = to dive / dived — an -um- verb, like lumangoy.'
      - type: translate
        prompt_tl: Maraming kabibe sa buhangin.
        answer_en: There are many seashells in the sand.
        accept: ["There are a lot of seashells in the sand", "There are many seashells on the sand"]
        extra_words: [fish, sea, few]
        audio: maraming_kabibe_sa_buhangin
      - type: fill_blank
        sentence: "Gusto kong ___ kasi malinaw ang tubig."
        translation: "I want to dive because the water is clear."
        answer: sumisid
        options: [sumisid, matulog, bumili]
      - type: listen
        audio: maraming_isda_at_kabibe
        answer_tl: Maraming isda at kabibe
        extra_words: [buhangin, bangka]
      - type: choice
        prompt: "You find a pretty seashell on the beach. Call out:"
        answer: May kabibe dito!
        distractors: [May isda sa bangka!, Malalim ang tubig!, Nasaan ang tuwalya?]
        audio: may_kabibe_dito
        audio_text: May kabibe dito!
      - type: translate
        prompt_tl: Sumisid kami sa malinaw na tubig.
        answer_en: We dived in the clear water.
        accept: ["We dove in the clear water", "We dived into the clear water", "We dove into the clear water"]
        extra_words: [deep, swam, sand]
        audio: sumisid_kami_sa_malinaw_na_tubig
      - type: translate
        prompt_en: There are many fish in the clear water.
        answer_tl: Maraming isda sa malinaw na tubig.
        extra_words: [kabibe, malalim, dagat]
        audio: maraming_isda_sa_malinaw_na_tubig
      - type: translate
        prompt_en: I want to dive but the water is deep.
        answer_tl: Gusto kong sumisid pero malalim ang tubig.
        extra_words: [lumangoy, mababaw, kami]
        audio: gusto_kong_sumisid_pero_malalim_ang_tubig
  - id: beach-9
    title: Sama-sama tayo!
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: sama-sama, en: all together }
          - { tl: dahan-dahan, en: slowly }
          - { tl: araw-araw, en: every day }
          - { tl: tabing-dagat, en: beach }
      - type: choice
        prompt: "'Sama-sama tayong kumain!' means..."
        answer: Let's all eat together!
        distractors: ["Let's eat later!", "Eat slowly!", "We already ate!"]
        audio: sama_sama_tayong_kumain
        audio_text: Sama-sama tayong kumain!
        hint: '"sama-sama" = all together; it links to the pronoun with -ng: "sama-sama tayong ...".'
      - type: translate
        prompt_tl: Sama-sama kaming pumunta sa tabing-dagat.
        answer_en: We went to the beach together.
        accept: ["We all went to the beach together", "Together we went to the beach"]
        extra_words: [alone, mountain, they]
        audio: sama_sama_kaming_pumunta_sa_tabing_dagat
        grading: { hyphens: true }
      - type: fill_blank
        sentence: "___ lang tayo, malalim na ang tubig."
        translation: "Let's take it slow, the water is getting deep."
        answer: Dahan-dahan
        options: [Dahan-dahan, Sama-sama, Araw-araw]
        grading: { hyphens: true }
      - type: listen
        audio: dahan_dahan_lang
        answer_tl: Dahan-dahan lang
        extra_words: [sama-sama, tayo]
        grading: { hyphens: true }
        hint: '"Dahan-dahan lang" = take it slow / easy does it.'
      - type: choice
        prompt: "Your whole barkada is at the beach. Invite everyone to swim together:"
        answer: Sama-sama tayong lumangoy!
        distractors: [Ayaw kong lumangoy., Huwag kang lumangoy!, Lumalangoy ako araw-araw.]
        audio: sama_sama_tayong_lumangoy
        audio_text: Sama-sama tayong lumangoy!
      - type: translate
        prompt_tl: Sasama ka ba sa tabing-dagat?
        answer_en: Are you coming along to the beach?
        accept: ["Are you coming to the beach?", "Will you come along to the beach?", "Will you come to the beach?"]
        extra_words: [mountain, swimming, we]
        audio: sasama_ka_ba_sa_tabing_dagat
        grading: { hyphens: true }
      - type: translate
        prompt_en: Let's all go to the beach together tomorrow.
        answer_tl: Sama-sama tayong pumunta sa tabing-dagat bukas.
        accept: ["Bukas, sama-sama tayong pumunta sa tabing-dagat"]
        extra_words: [kami, kahapon, bundok]
        audio: sama_sama_tayong_pumunta_sa_tabing_dagat_bukas
        grading: { hyphens: true }
      - type: translate
        prompt_en: Walk slowly, the sand is hot.
        answer_tl: Maglakad ka nang dahan-dahan, mainit ang buhangin.
        extra_words: [malamig, tayo, mabilis]
        audio: maglakad_ka_nang_dahan_dahan_mainit_ang_buhangin
        grading: { hyphens: true, ng_nang: true }
        hint: 'Before a word that describes how you do something, use "nang": maglakad nang dahan-dahan.'
  - id: beach-10
    title: Ang biyahe
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: biyahe, en: trip }
          - { tl: pamasahe, en: fare }
          - { tl: sumakay, en: to ride }
          - { tl: malayo, en: far }
      - type: choice
        prompt: "'Malayo ba ang isla?' means..."
        answer: Is the island far?
        distractors: ["Is the island big?", "Where is the island?", "Is the island beautiful?"]
        audio: malayo_ba_ang_isla
        audio_text: Malayo ba ang isla?
      - type: translate
        prompt_tl: Sumakay kami sa bus at sa bangka.
        answer_en: We rode a bus and a boat.
