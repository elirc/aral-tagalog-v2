      - type: translate
        prompt_en: There was an accident at the corner. Call an ambulance!
        answer_tl: May aksidente sa kanto. Tumawag ka ng ambulansya!
        accept: ["May aksidente sa kanto. Tawagan mo ang ambulansya!"]
        extra_words: [pulis, bumbero, daan]
        audio: may_aksidente_sa_kanto_tumawag_ka_ng_ambulansya
      - type: translate
        prompt_en: My friend is dizzy and there is blood on his hand. We need a doctor.
        answer_tl: Nahihilo ang kaibigan ko at may dugo sa kamay niya. Kailangan namin ng doktor.
        accept: ["Nahihilo ang kaibigan ko at may dugo sa kamay niya. Kailangan natin ng doktor"]
        extra_words: [ulo, nars, ako]
        audio: nahihilo_ang_kaibigan_ko_at_may_dugo_sa_kamay_niya_kailangan_namin_ng_doktor
  - id: emergency-10
    title: Staying calm
