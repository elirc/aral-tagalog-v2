id: emergencies
title: Help & Emergencies
description: Call for help, report a fire or a theft, and keep yourself safe.
tip: >-
  "Tulong!" is the everyday shout for help; "Saklolo!" is the more dramatic cry
  for rescue you hear in movies and news reports. To ask a person directly, use
  the verb: "Tulungan mo ako" — help me. Note that "Ingat!" does double duty:
  it warns you of danger, but Filipinos also say it instead of goodbye when
  someone leaves, the way English uses "take care". The national emergency
  hotline in the Philippines is 911.
lessons:
  - id: emergency-1
    title: Tulong! Asking for help
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: tulong, en: help }
          - { tl: sunog, en: fire }
          - { tl: pulis, en: police officer }
          - { tl: ospital, en: hospital }
      - type: choice
        prompt: "'Tulong!' means..."
        answer: Help!
        distractors: [Fire!, Stop!, Thank you!]
        audio: tulong
        audio_text: Tulong!
      - type: translate
        prompt_en: Help me!
        answer_tl: Tulungan mo ako!
        extra_words: [pulis, tubig, siya]
        audio: tulungan_mo_ako
        hint: '"tulungan mo" = you help — the command form aimed at one person.'
      - type: translate
        prompt_tl: Kailangan ko ng tulong.
        answer_en: I need help.
        accept: ["I need some help", "I need help!"]
        extra_words: [water, money, doctor]
        audio: kailangan_ko_ng_tulong
      - type: fill_blank
        sentence: "___ mo ako!"
        translation: "Help me!"
        answer: Tulungan
        options: [Tulungan, Tumawag, Kailangan]
      - type: choice
        prompt: "'Saklolo!' means..."
        answer: Help! (a cry for rescue)
        distractors: [Fire!, Be careful!, Where is it?]
        audio: saklolo
        audio_text: Saklolo!
      - type: listen
        audio: tulungan_niyo_po_ako
        answer_tl: Tulungan niyo po ako
        accept: ["Tulungan ninyo po ako", "Tulungan po ninyo ako", "Tulungan po niyo ako"]
        extra_words: [ninyo, pulis]
      - type: translate
        prompt_tl: May sakit ang lola ko.
        answer_en: My grandmother is sick.
        accept: ["My grandma is sick", "My grandmother is ill"]
        extra_words: [tired, hungry, friend]
        audio: may_sakit_ang_lola_ko
      - type: translate
        prompt_en: Where is the hospital? I need a doctor.
        answer_tl: Nasaan ang ospital? Kailangan ko ng doktor.
        extra_words: [pulis, bahay, tulong]
        audio: nasaan_ang_ospital_kailangan_ko_ng_doktor
  - id: emergency-2
    title: Fire, police, ambulance
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: emerhensiya, en: emergency }
          - { tl: bumbero, en: firefighter }
          - { tl: ambulansya, en: ambulance }
          - { tl: tumawag, en: to call }
      - type: choice
        prompt: "'Sunog!' means..."
        answer: Fire!
        distractors: [Flood!, Earthquake!, Help!]
        audio: sunog
        audio_text: Sunog!
      - type: translate
        prompt_en: Call an ambulance!
        answer_tl: Tumawag ka ng ambulansya!
        extra_words: [pulis, bumbero, bahay]
        audio: tumawag_ka_ng_ambulansya
      - type: translate
        prompt_tl: May sunog sa palengke!
        answer_en: There is a fire at the market!
        accept: ["There's a fire at the market", "There is a fire in the market"]
        extra_words: [hospital, store, storm]
        audio: may_sunog_sa_palengke
      - type: fill_blank
        sentence: "Tumawag ka ng ___!"
        translation: "Call the police!"
        answer: pulis
        options: [pulis, bumbero, guro]
      - type: listen
        audio: tumawag_tayo_ng_ambulansya
        answer_tl: Tumawag tayo ng ambulansya
        extra_words: [pulis, bumbero]
      - type: choice
        prompt: "'Emerhensiya' means..."
        answer: Emergency
        distractors: [Accident, Ambulance, Hospital]
        audio: emerhensiya
        audio_text: Emerhensiya
      - type: translate
        prompt_tl: Nasaan ang ambulansya?
        answer_en: Where is the ambulance?
        extra_words: [police, hospital, fire]
        audio: nasaan_ang_ambulansya
      - type: translate
        prompt_en: There is a fire near the church. Call the firefighters!
        answer_tl: May sunog malapit sa simbahan. Tumawag ka ng bumbero!
        extra_words: [pulis, ospital, malayo]
        audio: may_sunog_malapit_sa_simbahan_tumawag_ka_ng_bumbero
  - id: emergency-3
    title: Lost and stolen
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: nawawala, en: missing }
          - { tl: magnanakaw, en: thief }
          - { tl: pera, en: money }
          - { tl: pulis, en: police officer }
      - type: choice
        prompt: "'Nawawala' means..."
        answer: Lost / missing
        distractors: [Stolen, Dangerous, Safe]
        audio: nawawala
        audio_text: Nawawala
      - type: translate
        prompt_tl: Nawawala ang anak ko.
        answer_en: My child is missing.
        accept: ["My child is lost"]
        extra_words: [money, dog, friend]
        audio: nawawala_ang_anak_ko
      - type: translate
        prompt_en: I am lost.
        answer_tl: Naliligaw ako.
        accept: ["Nawawala ako"]
        extra_words: [siya, pulis, bahay, nawawala]
        audio: naliligaw_ako
      - type: fill_blank
        sentence: "___ ang pera ko."
        translation: "My money was stolen."
        answer: Ninakaw
        options: [Ninakaw, Nawawala, Kailangan]
        hint: '"nakaw" is theft; "ninakaw" is the completed form — it was stolen.'
      - type: listen
        audio: ninakaw_ang_pera_ko
        answer_tl: Ninakaw ang pera ko
        extra_words: [nawawala, tulong]
      - type: choice
        prompt: "'Magnanakaw' means..."
        answer: Thief
        distractors: [Police officer, Driver, Nurse]
        audio: magnanakaw
        audio_text: Magnanakaw
      - type: translate
        prompt_tl: May magnanakaw sa tindahan!
        answer_en: There is a thief in the store!
        accept: ["There's a thief in the store", "There is a thief at the store"]
        extra_words: [market, police, house]
        audio: may_magnanakaw_sa_tindahan
      - type: translate
        prompt_en: My friend is lost. Where is the police station?
        answer_tl: Nawawala ang kaibigan ko. Nasaan ang istasyon ng pulis?
        extra_words: [ospital, tindahan, magnanakaw]
        audio: nawawala_ang_kaibigan_ko_nasaan_ang_istasyon_ng_pulis
  - id: emergency-4
    title: Stay safe
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: delikado, en: dangerous }
          - { tl: ligtas, en: safe }
          - { tl: lindol, en: earthquake }
          - { tl: aksidente, en: accident }
      - type: choice
        prompt: "'Ingat!' means..."
        answer: Take care!
        distractors: [Help!, Fire!, Please come in!]
        audio: ingat
        audio_text: Ingat!
      - type: translate
        prompt_tl: Delikado ang daan.
        answer_en: The road is dangerous.
        accept: ["The street is dangerous"]
        extra_words: [safe, house, fast]
        audio: delikado_ang_daan
      - type: translate
        prompt_en: We are safe.
        answer_tl: Ligtas kami.
        extra_words: [delikado, sila, bahay]
        audio: ligtas_kami
      - type: fill_blank
        sentence: "___ ka sa daan."
        translation: "Be careful on the road."
        answer: Mag-ingat
        options: [Mag-ingat, Ligtas, Delikado]
        grading: { hyphens: true }
      - type: listen
        audio: mag_ingat_ka_sa_daan
        answer_tl: Mag-ingat ka sa daan
        extra_words: [delikado, ligtas]
      - type: choice
        prompt: "'Lindol' means..."
        answer: Earthquake
        distractors: [Storm, Flood, Fire]
        audio: lindol
        audio_text: Lindol
      - type: translate
        prompt_tl: May aksidente sa kanto.
        answer_en: There is an accident at the corner.
        accept: ["There's an accident at the corner", "There is an accident on the corner"]
        extra_words: [market, fire, road]
        audio: may_aksidente_sa_kanto
      - type: translate
        prompt_en: There is a wound on my hand.
        answer_tl: May sugat sa kamay ko.
        extra_words: [ulo, gamot, ligtas]
        audio: may_sugat_sa_kamay_ko
      - type: translate
        prompt_tl: Mag-ingat kayo, malakas ang bagyo ngayon.
        answer_en: Be careful, the storm is strong today.
        accept: ["Take care, the storm is strong today", "Be careful, the typhoon is strong today"]
        extra_words: [safe, dangerous, market]
        audio: mag_ingat_kayo_malakas_ang_bagyo_ngayon
  - id: emergency-5
    title: Calling for help
    xp: 10
    exercises:
      - type: choice
        prompt: "'Tawagan mo ang pulis!' means..."
        answer: Call the police!
        distractors: [Help the police!, Where are the police?, The police called!]
        audio: tawagan_mo_ang_pulis
        audio_text: Tawagan mo ang pulis!
        hint: 'Like "tulungan mo", "tawagan mo" is a command aimed at one person — call (someone).'
      - type: match
        pairs:
          - { tl: tawagan, en: to call (someone) }
          - { tl: numero, en: number }
          - { tl: selpon, en: cellphone }
          - { tl: emerhensiya, en: emergency }
      - type: translate
        prompt_tl: Ano ang numero ng pulis?
        answer_en: What is the number of the police?
        accept:
          - What is the police number?
          - What's the police number?
          - What's the number of the police?
        extra_words: [hospital, where, fire]
        audio: ano_ang_numero_ng_pulis
      - type: fill_blank
        sentence: "___ mo ang ambulansya!"
        translation: "Call the ambulance!"
        answer: Tawagan
        options: [Tawagan, Tulungan, Tumawag]
      - type: listen
        audio: tawagan_mo_ako_mamaya
        answer_tl: Tawagan mo ako mamaya
        extra_words: [tulungan, bukas]
      - type: choice
        prompt: "The emergency operator answers: 'Ano ang emerhensiya?' She is asking..."
        answer: What is the emergency?
        distractors: [Where are you?, What is your name?, Are you safe?]
        audio: ano_ang_emerhensiya
        audio_text: Ano ang emerhensiya?
      - type: translate
        prompt_tl: Wala akong load. Pakitawagan mo ang nanay ko.
        answer_en: I have no load. Please call my mother.
        accept:
          - I don't have load. Please call my mother.
          - I have no load. Please call my mom.
          - I don't have any load. Please call my mom.
          - I have no phone credit. Please call my mother.
        extra_words: [father, later, hospital]
        audio: wala_akong_load_pakitawagan_mo_ang_nanay_ko
        hint: '"paki-" + "tawagan" = please call.'
      - type: translate
        prompt_en: Call the firefighters! There is a fire at our neighbor's house.
        answer_tl: Tawagan mo ang bumbero! May sunog sa bahay ng kapitbahay namin.
        accept:
          - Tawagan mo ang mga bumbero! May sunog sa bahay ng kapitbahay namin
          - Tumawag ka ng bumbero! May sunog sa bahay ng kapitbahay namin
        extra_words: [pulis, ambulansya, ospital]
        audio: tawagan_mo_ang_bumbero_may_sunog_sa_bahay_ng_kapitbahay_namin
      - type: translate
        prompt_en: What is your number? I will call you later.
        answer_tl: Ano ang numero mo? Tatawagan kita mamaya.
        accept: ["Ano ang numero mo? Mamaya, tatawagan kita"]
        extra_words: [tumawag, ako, bukas]
        audio: ano_ang_numero_mo_tatawagan_kita_mamaya
        hint: '"kita" packs "I ... you" into one word, like "mahal kita". Future: tatawagan.'
  - id: emergency-6
    title: Typhoon and flood
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: bagyo, en: typhoon }
          - { tl: baha, en: flood }
          - { tl: ulan, en: rain }
          - { tl: hangin, en: wind }
      - type: choice
        prompt: "'Baha' means..."
        answer: Flood
        distractors: [Storm, Earthquake, Fire]
        audio: baha
        audio_text: Baha
      - type: translate
        prompt_tl: Malakas ang ulan at may baha sa daan.
        answer_en: The rain is strong and there is a flood on the road.
        accept:
          - The rain is heavy and there is a flood on the road
          - The rain is strong and there's a flood on the road
          - The rain is heavy and there's a flood on the road
        extra_words: [fire, house, weak]
        audio: malakas_ang_ulan_at_may_baha_sa_daan
      - type: choice
        prompt: "'Walang kuryente' means..."
        answer: There's no electricity
        distractors: [There's no water, There's no signal, There's no food]
        audio: walang_kuryente
        audio_text: Walang kuryente.
        hint: 'A "brownout" — what Filipinos call a power outage — means "walang kuryente".'
      - type: fill_blank
        sentence: "Mataas na ang tubig. ___ na tayo!"
        translation: "The water is already high. Let's evacuate now!"
        answer: Lumikas
        options: [Lumikas, Umuwi, Lumangoy]
        hint: '"lumikas" = to evacuate — to leave for somewhere safe.'
      - type: listen
        audio: may_bagyo_raw_bukas
        answer_tl: May bagyo raw bukas
        extra_words: [daw, ngayon]
      - type: translate
        prompt_tl: Lumikas ang mga pamilya sa paaralan kasi mataas ang baha.
        answer_en: The families evacuated to the school because the flood is high.
        accept: ["The families evacuated to the school because the flood was high"]
        extra_words: [hospital, low, market]
        audio: lumikas_ang_mga_pamilya_sa_paaralan_kasi_mataas_ang_baha
      - type: translate
        prompt_en: There is no electricity because of the typhoon.
        answer_tl: Walang kuryente dahil sa bagyo.
        accept: ["Walang kuryente kasi may bagyo", "Walang kuryente dahil may bagyo"]
        extra_words: [baha, ulan, mainit]
        audio: walang_kuryente_dahil_sa_bagyo
        hint: '"dahil sa" + a thing = because of.'
      - type: translate
        prompt_en: Be careful, the typhoon is strong. Let's evacuate now.
        answer_tl: Mag-ingat kayo, malakas ang bagyo. Lumikas na tayo.
        accept:
          - Mag-ingat ka, malakas ang bagyo. Lumikas na tayo
          - Mag-ingat kayo, malakas ang bagyo. Lumikas tayo ngayon
        extra_words: [lindol, umuwi, baha]
        audio: mag_ingat_kayo_malakas_ang_bagyo_lumikas_na_tayo
        grading: { hyphens: true }
  - id: emergency-7
    title: Earthquake!
    xp: 10
    exercises:
      - type: choice
        prompt: "'Lumilindol!' means..."
        answer: There's an earthquake!
        distractors: [There's a fire!, There's a flood!, There's a typhoon!]
        audio: lumilindol
        audio_text: Lumilindol!
        hint: '"lindol" is an earthquake; "lumilindol" means one is happening right now.'
      - type: match
        pairs:
          - { tl: lindol, en: earthquake }
          - { tl: magtago, en: to take cover }
          - { tl: ilalim, en: underneath }
          - { tl: ligtas, en: safe }
      - type: fill_blank
        sentence: "Magtago ka sa ___ ng mesa."
        translation: "Take cover under the table."
        answer: ilalim
        options: [ilalim, loob, ibabaw]
      - type: translate
        prompt_tl: Lumindol kahapon pero ligtas kami.
        answer_en: There was an earthquake yesterday but we are safe.
        accept:
          - There was an earthquake yesterday, but we are safe
          - There was an earthquake yesterday but we're safe
          - There was an earthquake yesterday, but we're safe
        extra_words: [flood, today, dangerous]
        audio: lumindol_kahapon_pero_ligtas_kami
      - type: listen
        audio: huwag_kang_tumakbo
        answer_tl: Huwag kang tumakbo
        extra_words: [magtago, ka]
      - type: choice
        prompt: "The ground starts shaking. What do you shout to your family?"
        answer: Magtago tayo sa ilalim ng mesa!
        distractors: [Umuwi tayo sa probinsya!, Kain tayo!, Sumakay tayo ng jeepney!]
        audio: magtago_tayo_sa_ilalim_ng_mesa
        audio_text: Magtago tayo sa ilalim ng mesa!
      - type: translate
        prompt_tl: Malakas ang lindol at delikado ang gusali.
        answer_en: The earthquake is strong and the building is dangerous.
        accept:
          - The earthquake was strong and the building is dangerous
          - The earthquake is strong and the building is unsafe
        extra_words: [weak, safe, house]
        audio: malakas_ang_lindol_at_delikado_ang_gusali
      - type: translate
        prompt_en: Take cover under the table and don't run.
        answer_tl: Magtago ka sa ilalim ng mesa at huwag kang tumakbo.
        accept:
          - Magtago ka sa ilalim ng mesa, at huwag kang tumakbo
          - Magtago kayo sa ilalim ng mesa at huwag kayong tumakbo
        extra_words: [ibabaw, loob, tumayo]
        audio: magtago_ka_sa_ilalim_ng_mesa_at_huwag_kang_tumakbo
      - type: translate
        prompt_en: There was an earthquake. Are you safe?
        answer_tl: Lumindol. Ligtas ka ba?
        accept: ["Lumindol! Ligtas ka ba?", "Lumindol. Ligtas ba kayo?", "Lumindol. Ligtas po ba kayo?"]
        extra_words: [lindol, kami, delikado]
        audio: lumindol_ligtas_ka_ba
  - id: emergency-8
    title: Reporting a theft
    xp: 10
    exercises:
      - type: choice
        prompt: "A police officer asks you 'Ano ang nangyari?' He means..."
        answer: What happened?
        distractors: [Where are you going?, What is your name?, What did you buy?]
        audio: ano_ang_nangyari
        audio_text: Ano ang nangyari?
      - type: match
        pairs:
          - { tl: nakita ko, en: I saw }
          - { tl: nangyari, en: happened }
          - { tl: ninakaw, en: was stolen }
          - { tl: magnanakaw, en: thief }
      - type: translate
        prompt_tl: Ninakaw ang selpon ko sa jeepney.
        answer_en: My cellphone was stolen on the jeepney.
        accept:
          - My phone was stolen on the jeepney
          - My cellphone was stolen in the jeepney
          - My phone was stolen in the jeepney
        extra_words: [lost, bus, money]
        audio: ninakaw_ang_selpon_ko_sa_jeepney
      - type: fill_blank
        sentence: "___ ko ang magnanakaw!"
        translation: "I saw the thief!"
        answer: Nakita
        options: [Nakita, Nawawala, Ninakaw]
        hint: '"nakita ko" = I saw — the one you saw takes "ang".'
      - type: listen
        audio: kailan_ito_nangyari
        answer_tl: Kailan ito nangyari
        extra_words: [saan, nakita]
      - type: choice
        prompt: "The officer asks what the thief looked like. You say:"
        answer: Matangkad siya at nakasuot ng itim na kamiseta.
        distractors: [Ninakaw niya ang pera ko., Nasa istasyon siya ng pulis., Tumawag ako sa nanay ko.]
        audio: matangkad_siya_at_nakasuot_ng_itim_na_kamiseta
        audio_text: Matangkad siya at nakasuot ng itim na kamiseta.
      - type: translate
        prompt_tl: Nakita ko siya kanina sa palengke. Mabilis siyang tumakbo.
        answer_en: I saw him earlier at the market. He ran fast.
        accept:
          - I saw her earlier at the market. She ran fast.
          - I saw him earlier at the market. He ran quickly.
          - I saw her earlier at the market. She ran quickly.
          - I saw him at the market earlier. He ran fast.
          - I saw her at the market earlier. She ran fast.
        extra_words: [yesterday, slowly, church]
        audio: nakita_ko_siya_kanina_sa_palengke_mabilis_siyang_tumakbo
      - type: translate
        prompt_en: What happened? My money was stolen at the market.
        answer_tl: Ano ang nangyari? Ninakaw ang pera ko sa palengke.
        accept: ["Anong nangyari? Ninakaw ang pera ko sa palengke"]
        extra_words: [nawawala, nakita, tindahan]
        audio: ano_ang_nangyari_ninakaw_ang_pera_ko_sa_palengke
      - type: translate
        prompt_en: I saw the thief. He is thin and he has long hair.
        answer_tl: Nakita ko ang magnanakaw. Payat siya at mahaba ang buhok niya.
        accept: ["Nakita ko ang magnanakaw, payat siya at mahaba ang buhok niya"]
        extra_words: [mataba, maikli, pulis]
        audio: nakita_ko_ang_magnanakaw_payat_siya_at_mahaba_ang_buhok_niya
  - id: emergency-9
    title: Accidents and injuries
    xp: 10
    exercises:
