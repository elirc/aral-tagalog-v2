id: review-descriptions
title: "Review: Describing the World"
description: Put it all together — colors, clothes, animals, looks, and feelings in rich describing sentences.
tip: >-
  Linkers glue a description to whatever comes right before it — even a
  pronoun: "ang aso kong puti" (my white dog), because "ko" ends in a vowel
  and takes -ng. You can also flip a sentence with "ay" for a more formal
  feel: "Matakaw ang pusa kong itim" and "Ang pusa kong itim ay matakaw"
  both mean "My black cat is greedy."
lessons:
  - id: revdesc-1
    title: Colors on clothes
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: pula, en: red }
          - { tl: asul, en: blue }
          - { tl: dilaw, en: yellow }
          - { tl: berde, en: green }
      - type: choice
        prompt: "'Nakasuot' means..."
        answer: Wearing
        distractors: [Buying, Washing, Selling]
        audio: nakasuot
        audio_text: Nakasuot
      - type: translate
        prompt_en: She is wearing a red dress.
        answer_tl: Nakasuot siya ng pulang bestida.
        accept: ["Nakasuot siya ng bestidang pula"]
        extra_words: [asul, sapatos, medyas]
        audio: nakasuot_siya_ng_pulang_bestida
      - type: translate
        prompt_tl: Puti ang kamiseta ko at itim ang pantalon ko.
        answer_en: My shirt is white and my pants are black.
        accept:
          - "My T-shirt is white and my pants are black"
          - "My shirt is white and my trousers are black"
          - "My T-shirt is white and my trousers are black"
        extra_words: [shoes, blue, skirt]
        audio: puti_ang_kamiseta_ko_at_itim_ang_pantalon_ko
      - type: fill_blank
        sentence: "Nakasuot si Ana ng ___ palda."
        translation: "Ana is wearing a green skirt."
        answer: berdeng
        options: [berdeng, berde, itim]
        hint: 'Colors ending in a vowel take the -ng linker: berdeng palda.'
      - type: listen
        audio: itim_ang_sapatos_ko
        answer_tl: Itim ang sapatos ko
        extra_words: [puti, medyas]
      - type: choice
        prompt: "'Anong kulay ang damit mo?' asks about..."
        answer: The color of your clothes
        distractors: [The price of your clothes, The size of your shoes, The color of your hair]
        audio: anong_kulay_ang_damit_mo
        audio_text: Anong kulay ang damit mo?
      - type: translate
        prompt_en: I bought a yellow hat at the market.
        answer_tl: Bumili ako ng dilaw na sombrero sa palengke.
        accept: ["Bumili ako ng sombrerong dilaw sa palengke"]
        extra_words: [pula, tindahan, mura]
        audio: bumili_ako_ng_dilaw_na_sombrero_sa_palengke
