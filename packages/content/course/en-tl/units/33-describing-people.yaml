id: describing-people
title: Describing People
description: Describe how people look and act — tall or short, kind or naughty, smart and hardworking.
tip: >-
  Adjectives link to nouns with "-ng" after a vowel or -n, and "na" after any
  other consonant: "matalinong estudyante" (a smart student), "matulunging
  guro" (a helpful teacher), "mabait na guro" (a kind teacher).
  To compare two people, put "mas" before the adjective and "kaysa kay" before
  the name: "Mas matangkad si Juan kaysa kay Ana" — Juan is taller than Ana.
lessons:
  - id: descpeople-1
    title: Tall and short
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: matangkad, en: tall }
          - { tl: pandak, en: short }
          - { tl: payat, en: thin }
          - { tl: mataba, en: fat }
      - type: choice
        prompt: "'Matangkad' means..."
        answer: Tall
        distractors: [Short, Thin, Big]
        audio: matangkad
        audio_text: Matangkad
      - type: translate
        prompt_tl: Matangkad ang lalaki.
        answer_en: The man is tall.
        accept: ["The boy is tall"]
        extra_words: [short, woman, small]
        audio: matangkad_ang_lalaki
      - type: translate
        prompt_en: The woman is thin.
        answer_tl: Payat ang babae.
        extra_words: [mataba, lalaki, matangkad]
        audio: payat_ang_babae
      - type: fill_blank
        sentence: "Hindi ___ si Juan; pandak siya."
        translation: "Juan is not tall; he is short."
        answer: matangkad
        options: [matangkad, payat, mataba]
      - type: listen
        audio: pandak_si_juan
        answer_tl: Pandak si Juan
        extra_words: [matangkad, babae]
      - type: choice
        prompt: "'Payat' means..."
        answer: Thin
        distractors: [Fat, Tall, Strong]
        audio: payat
        audio_text: Payat
      - type: translate
        prompt_en: My dad is fat.
        answer_tl: Mataba ang tatay ko.
        accept: ["Mataba ang aking tatay"]
        extra_words: [payat, nanay, matangkad]
        audio: mataba_ang_tatay_ko
      - type: translate
        prompt_tl: Matangkad ang tatay ko at pandak ang nanay ko.
        answer_en: My dad is tall and my mom is short.
        accept: ["My father is tall and my mother is short"]
        extra_words: [thin, sister, fat]
        audio: matangkad_ang_tatay_ko_at_pandak_ang_nanay_ko
