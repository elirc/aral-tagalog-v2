id: object-focus-in
title: "Kinain Ko: -IN Verbs"
description: >-
  Meet object focus: put the spotlight on the thing eaten, bought, or done with
  -in verbs like kinain, binili, and ginawa — in past, present, and future.
tip: >-
  So far the ang-word has been the doer: "Kumain ako ng mangga" (I ate a
  mango). Tagalog can also spotlight the thing acted on — usually something
  specific, "the mango". Then the verb changes shape and the markers swap:
  "Kinain ko ang mangga" (I ate the mango). The object takes ang, and the doer
  moves to the ng-set: ko, mo, niya, namin, nila, ng bata, ni Ana. For -in
  verbs, the past puts -in- inside the root (kain → kinain), the present also
  repeats a syllable (kinakain), and the future repeats the syllable and adds
  -in at the end (kakainin). The base form (kainin, bilhin, gawin) follows
  gusto: "Gusto kong kainin ang mangga." Favorite question: "Ano ang ginawa mo?"
lessons:
  - id: ofin-1
    title: Kumain or kinain?
    xp: 10
    exercises:
      - type: choice
        prompt: "Warm-up: 'Kumain ako ng mangga' means..."
        answer: I ate a mango.
        distractors: [I am eating a mango., I will eat a mango., I bought a mango.]
        audio: kumain_ako_ng_mangga
        audio_text: Kumain ako ng mangga.
      - type: choice
        prompt: "'Kinain ko ang mangga' means..."
        answer: I ate the mango.
        distractors: [I am eating the mango., You ate the mango., I bought the mango.]
        audio: kinain_ko_ang_mangga
        audio_text: Kinain ko ang mangga.
      - type: match
        pairs:
          - { tl: kumain ako, en: I ate }
          - { tl: kinain ko, en: I ate it }
          - { tl: ng mangga, en: a mango }
          - { tl: ang mangga, en: the mango }
      - type: translate
        prompt_tl: Kinain ko ang saging.
        answer_en: I ate the banana.
        extra_words: [a, mango, bought]
        audio: kinain_ko_ang_saging
      - type: listen
        audio: kinain_ko_ang_mangga
        answer_tl: Kinain ko ang mangga
        extra_words: [ako, ng]
      - type: choice
        prompt: "In 'Kinain ko ang isda', which word is the ang-marked topic?"
        answer: isda — the thing eaten
        distractors: [ko — the eater, kinain — the action]
        hint: 'In object focus, "ang" marks the thing acted on, not the doer.'
      - type: translate
        prompt_tl: Kinain mo ang tinapay ko.
        answer_en: You ate my bread.
        extra_words: [I, your, rice]
        audio: kinain_mo_ang_tinapay_ko
      - type: fill_blank
        sentence: "Kinain ___ ang mangga."
        translation: "I ate the mango."
        answer: ko
        options: [ko, ako, akin]
        hint: 'With an object-focus verb like "kinain", the doer uses the ng-set: ko, not ako.'
      - type: translate
        prompt_en: I ate the fish.
        answer_tl: Kinain ko ang isda.
        extra_words: [ako, kumain, mangga]
        audio: kinain_ko_ang_isda
        hint: '"The fish" is specific, so it takes ang — and the verb becomes kinain with ko.'
