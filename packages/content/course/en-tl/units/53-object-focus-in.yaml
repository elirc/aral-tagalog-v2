        answer_tl: Binili ko ang libro
        extra_words: [ako, kinain]
      - type: choice
        prompt: "Which says 'Ana ate the mango'?"
        answer: Kinain ni Ana ang mangga.
        distractors:
          - Kinain si Ana ang mangga.
          - Kinain ni Ana ng mangga.
          - Kumain ni Ana ang mangga.
        audio: kinain_ni_ana_ang_mangga
        audio_text: Kinain ni Ana ang mangga.
        hint: 'A named doer takes "ni" in object focus; the thing eaten takes "ang".'
      - type: translate
        prompt_en: You bought the bread.
        answer_tl: Binili mo ang tinapay.
        accept: ["Binili ninyo ang tinapay", "Binili niyo ang tinapay"]
        extra_words: [ka, ikaw, kinain]
