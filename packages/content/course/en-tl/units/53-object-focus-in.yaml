      - type: fill_blank
        sentence: "Kinain ___ aso ang isda."
        translation: "The dog ate the fish."
        answer: ng
        options: [ng, ang, sa]
        hint: 'In object focus the doer is marked "ng"; "ang" is saved for the thing acted on.'
      - type: translate
        prompt_en: Mom bought the fish.
        answer_tl: Binili ni Nanay ang isda.
        accept: ["Binili ng nanay ang isda", "Binili ng nanay ko ang isda"]
        extra_words: [si, kay, kinain]
        audio: binili_ni_nanay_ang_isda
