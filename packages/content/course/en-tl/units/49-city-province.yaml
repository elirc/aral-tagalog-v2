        answer_en: The vegetables in the province are fresher than in the city.
        accept:
          - Vegetables in the province are fresher than in the city
          - Vegetables are fresher in the province than in the city
          - The vegetables are fresher in the province than in the city
        extra_words: [cheaper, town, market]
        audio: mas_sariwa_ang_gulay_sa_probinsya_kaysa_sa_lungsod
