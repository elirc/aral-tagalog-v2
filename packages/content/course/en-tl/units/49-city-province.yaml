        distractors: [I was late, I will go home, I am tired]
        audio: mahuhuli_ako
        audio_text: Mahuhuli ako.
        hint: '"mahuli" is to be late; "mahuhuli" doubles the first syllable of the root — it hasn''t happened yet.'
      - type: translate
        prompt_tl: Siksikan ang jeepney tuwing umaga.
        answer_en: The jeepney is crowded every morning.
        accept: ["The jeepney is packed every morning", "The jeepneys are crowded every morning"]
