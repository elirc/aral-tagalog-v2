      - type: fill_blank
        sentence: "May ___ kami para sa mga pinsan namin."
        translation: "We have gifts from our trip for our cousins."
        answer: pasalubong
        options: [pasalubong, kamag-anak, palayan]
        hint: 'A "pasalubong" is the gift you bring home from a trip — no Filipino visits family without one.'
      - type: listen
        audio: dadalaw_kami_kay_lolo_bukas
        answer_tl: Dadalaw kami kay Lolo bukas
        extra_words: [dumalaw, kahapon]
        hint: 'Future of "dumalaw": drop -um- and double the first syllable → dadalaw.'
      - type: choice
        prompt: "You arrive at your aunt's house in the province. She says 'Ang laki mo na!' She means..."
        answer: You've grown so big!
        distractors: [You're so late!, You look so tired!, You've gotten so thin!]
        audio: ang_laki_mo_na
        audio_text: Ang laki mo na!
        hint: '"Ang" + an adjective root makes an exclamation, like "Ang mahal naman!"'
      - type: translate
        prompt_tl: Dumalaw ang mga kamag-anak namin noong Pasko.
        answer_en: Our relatives visited at Christmas.
        accept:
          - Our relatives visited during Christmas
          - Our relatives visited us at Christmas
          - Our relatives visited us during Christmas
          - Our relatives visited last Christmas
        extra_words: [will, city, cousins]
        audio: dumalaw_ang_mga_kamag_anak_namin_noong_pasko
      - type: translate
        prompt_en: I bought pasalubong for my cousins.
        answer_tl: Bumili ako ng pasalubong para sa mga pinsan ko.
        extra_words: [kamag-anak, tita, dumalaw]
        audio: bumili_ako_ng_pasalubong_para_sa_mga_pinsan_ko
      - type: translate
        prompt_en: We will visit our relatives in the province at Christmas.
        answer_tl: Dadalaw kami sa mga kamag-anak namin sa probinsya sa Pasko.
        accept: ["Sa Pasko, dadalaw kami sa mga kamag-anak namin sa probinsya"]
        extra_words: [dumalaw, lungsod, kahapon]
        audio: dadalaw_kami_sa_mga_kamag_anak_namin_sa_probinsya_sa_pasko
        grading: { hyphens: true }
  - id: cityprov-8
