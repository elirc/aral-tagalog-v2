        answer_tl: Mahuhuli ako sa trabaho
        extra_words: [trapik, bukas]
      - type: translate
        prompt_tl: Mainit at maingay sa lungsod kasi maraming sasakyan.
        answer_en: It is hot and noisy in the city because there are many vehicles.
        accept:
          - It's hot and noisy in the city because there are many vehicles
          - It is hot and noisy in the city because there are a lot of vehicles
          - It's hot and noisy in the city because there are a lot of vehicles
        extra_words: [quiet, cold, province]
        audio: mainit_at_maingay_sa_lungsod_kasi_maraming_sasakyan
      - type: translate
        prompt_en: I will be late because the traffic is really bad.
        answer_tl: Mahuhuli ako kasi sobrang trapik.
        accept: ["Mahuhuli ako dahil sobrang trapik", "Mahuhuli po ako kasi sobrang trapik"]
        extra_words: [tahimik, umuwi, bukid]
        audio: mahuhuli_ako_kasi_sobrang_trapik
      - type: translate
        prompt_en: The bus is crowded and slow.
        answer_tl: Siksikan at mabagal ang bus.
        accept: ["Mabagal at siksikan ang bus"]
        extra_words: [mabilis, jeepney, tahimik]
        audio: siksikan_at_mabagal_ang_bus
  - id: cityprov-6
