        accept: ["There are a lot of trees on the mountain and the river is cold"]
        extra_words: [city, hot, rice]
        audio: maraming_puno_sa_bundok_at_malamig_ang_ilog
      - type: translate
        prompt_en: My grandfather plants rice in the rice field.
        answer_tl: Nagtatanim ng palay ang lolo ko sa palayan.
        accept: ["Nagtatanim ang lolo ko ng palay sa palayan"]
        extra_words: [bukid, kanin, nagtanim]
        audio: nagtatanim_ng_palay_ang_lolo_ko_sa_palayan
        hint: '"palay" is rice still growing in the field; "kanin" is cooked rice on your plate.'
      - type: translate
        prompt_en: We woke up early and walked to the river.
        answer_tl: Gumising kami nang maaga at naglakad kami papunta sa ilog.
        accept: ["Gumising kami nang maaga at naglakad papunta sa ilog"]
        extra_words: [ng, bundok, natulog]
        audio: gumising_kami_nang_maaga_at_naglakad_kami_papunta_sa_ilog
  - id: cityprov-7
