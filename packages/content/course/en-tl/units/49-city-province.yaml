        audio_text: Nagtatanim ng gulay ang magsasaka.
        hint: '"magtanim" is to plant — a mag- verb like magluto: nagtanim, nagtatanim, magtatanim.'
      - type: fill_blank
        sentence: "Gumigising ___ maaga ang mga magsasaka."
        translation: "Farmers wake up early."
        answer: nang
