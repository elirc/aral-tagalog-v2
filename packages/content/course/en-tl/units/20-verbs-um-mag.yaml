        distractors: [Is Ben arriving?, Will Ben leave tomorrow?, Where did Ben go?]
        audio: umalis_na_ba_si_ben
        audio_text: Umalis na ba si Ben?
      - type: fill_blank
        sentence: "Naglaba ka ___ ba?"
        translation: "Have you done the laundry yet?"
        answer: na
        options: [na, pa, ba]
      - type: listen
