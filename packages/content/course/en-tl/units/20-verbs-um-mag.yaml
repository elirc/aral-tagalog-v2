      - type: translate
        prompt_en: The guests arrived at the party.
        answer_tl: Dumating ang mga bisita sa handaan.
        accept: ["Dumating sa handaan ang mga bisita"]
        extra_words: [umalis, regalo, kami]
        audio: dumating_ang_mga_bisita_sa_handaan
      - type: translate
        prompt_en: I am writing a book.
        answer_tl: Sumusulat ako ng libro.
        extra_words: [sumulat, nagbabasa, kanta]
        audio: sumusulat_ako_ng_libro
  - id: umverbs-7
    title: Laundry and chores
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: naglaba, en: did laundry }
          - { tl: naglalaba, en: doing laundry }
          - { tl: nagsaing, en: cooked rice }
          - { tl: naglinis, en: cleaned }
      - type: choice
        prompt: "'Maglaba' means..."
        answer: To wash clothes
        distractors: [To wash dishes, To cook rice, To sweep]
        audio: maglaba
        audio_text: Maglaba
      - type: fill_blank
        sentence: "___ si Ate. May kanin na tayo."
        translation: "Ate cooked rice. We have rice now."
        answer: Nagsaing
        options: [Nagsaing, Naglaba, Naglinis]
        hint: '"magsaing" = to cook rice — its own verb in every Filipino kitchen.'
      - type: listen
        audio: naghugas_ako_ng_mga_plato
        answer_tl: Naghugas ako ng mga plato
        extra_words: [naghuhugas, mesa]
      - type: choice
        prompt: "Yesterday you cleaned your room. Which is correct?"
        answer: Naglinis ako ng kwarto ko kahapon.
        distractors:
          - Naglilinis ako ng kwarto ko kahapon.
          - Maglinis ako ng kwarto ko kahapon.
          - Naglinis ako ng kwarto ko bukas.
        audio: naglinis_ako_ng_kwarto_ko_kahapon
        audio_text: Naglinis ako ng kwarto ko kahapon.
      - type: translate
        prompt_tl: Naglaba ako kahapon.
        answer_en: I did the laundry yesterday.
        accept: ["I washed clothes yesterday", "I did laundry yesterday"]
        extra_words: [cooked, cleaned, tomorrow]
        audio: naglaba_ako_kahapon
      - type: translate
        prompt_en: My mom is doing laundry now.
        answer_tl: Naglalaba ang nanay ko ngayon.
        accept:
          - "Naglalaba ngayon ang nanay ko"
          - "Ngayon, naglalaba ang nanay ko"
        extra_words: [naglaba, naglilinis, kahapon]
        audio: naglalaba_ang_nanay_ko_ngayon
      - type: translate
        prompt_en: I cooked rice and cleaned the kitchen.
        answer_tl: Nagsaing ako at naglinis ng kusina.
        accept: ["Nagsaing ako at naglinis ako ng kusina"]
        extra_words: [naglaba, kwarto, nagluto]
        audio: nagsaing_naglinis_kusina
  - id: umverbs-8
    title: Done, doing, will do
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: kumain, en: ate }
          - { tl: kumakain, en: eating }
          - { tl: kakain, en: will eat }
      - type: choice
        prompt: "'Kakain' means..."
        answer: Will eat
        distractors: [Ate, Eating, Already ate]
        audio: kakain
        audio_text: Kakain
        hint: 'The repeated syllable stays but -um- drops: kain → KAkain (will eat).'
      - type: match
        pairs:
          - { tl: uminom, en: drank }
          - { tl: umiinom, en: drinking }
          - { tl: iinom, en: will drink }
      - type: fill_blank
        sentence: "Kumain ako kahapon, kumakain ako ngayon, at ___ ako bukas."
        translation: "I ate yesterday, I am eating now, and I will eat tomorrow."
        answer: kakain
        options: [kakain, kumain, kumakain]
      - type: listen
        audio: iinom_ako_ng_gatas_bukas
        answer_tl: Iinom ako ng gatas bukas
        extra_words: [uminom, kape]
      - type: choice
        prompt: "'Magluluto si Nanay bukas' means..."
        answer: Mom will cook tomorrow
        distractors: [Mom cooked yesterday, Mom is cooking now, Mom cooks every day]
        audio: magluluto_si_nanay_bukas
        audio_text: Magluluto si Nanay bukas.
        hint: 'MAG verbs keep mag- and repeat the root''s first syllable: magLUluto.'
      - type: choice
        prompt: "Hear the difference: which one means 'bought'?"
        answer: Bumili
        distractors: [Bibili, Bumibili, Bili]
        audio: bumili
        audio_text: Bumili
        hint: 'bumili = bought; bumibili = buying; bibili = will buy.'
      - type: translate
        prompt_tl: Nagluto ako kahapon at magluluto ako bukas.
        answer_en: I cooked yesterday and I will cook tomorrow.
        accept: ["I cooked yesterday and will cook tomorrow"]
        extra_words: [eating, today, rice]
        audio: nagluto_kahapon_magluluto_bukas
  - id: umverbs-9
    title: Will do
    xp: 10
    exercises:
      - type: choice
        prompt: "To say something WILL happen, UM verbs..."
        answer: Drop -um- and repeat the first syllable (kain → kakain)
        distractors:
          - Keep -um- and repeat (kumakain)
          - Just use the root (kain)
          - Add nag- in front (nagkain)
        hint: 'MAG verbs keep mag-: magluluto.'
      - type: fill_blank
        sentence: "Bumili ako ng isda kahapon at ___ ako ng manok bukas."
        translation: "I bought fish yesterday and I will buy chicken tomorrow."
        answer: bibili
        options: [bibili, bumili, bumibili]
      - type: listen
        audio: maglalaro_sila_ng_basketbol_bukas
        answer_tl: Maglalaro sila ng basketbol bukas
        extra_words: [naglalaro, ngayon]
      - type: fill_blank
        sentence: "___ ako ng mga damit bukas."
        translation: "I will wash clothes tomorrow."
        answer: Maglalaba
        options: [Maglalaba, Naglaba, Naglalaba]
      - type: translate
        prompt_tl: Aalis sila bukas.
        answer_en: They will leave tomorrow.
        accept: ["They are leaving tomorrow"]
        extra_words: [arrived, yesterday, we]
        audio: aalis_sila_bukas
      - type: translate
        prompt_en: We will drink milk tomorrow.
        answer_tl: Iinom kami ng gatas bukas.
        accept:
          - "Bukas, iinom kami ng gatas"
          - "Iinom kami bukas ng gatas"
          - "Bukas kami iinom ng gatas"
        extra_words: [umiinom, kape, ngayon]
        audio: iinom_kami_ng_gatas_bukas
      - type: translate
        prompt_en: She will study tomorrow because there is a test.
        answer_tl: Mag-aaral siya bukas kasi may pagsusulit.
        accept: ["Mag-aaral siya bukas dahil may pagsusulit"]
        extra_words: [nag-aral, ngayon, klase]
        audio: mag_aaral_siya_bukas_may_pagsusulit
      - type: translate
        prompt_en: Grandma will arrive tomorrow. I will cook fish.
        answer_tl: Darating si Lola bukas. Magluluto ako ng isda.
        accept:
          - "Darating bukas si Lola. Magluluto ako ng isda"
          - "Bukas, darating si Lola. Magluluto ako ng isda"
        extra_words: [dumating, kahapon, manok]
        audio: darating_si_lola_magluluto_isda
        hint: 'dating softens d to r in the "will" form: DArating, not dadating.'
  - id: umverbs-10
    title: Na and pa in action
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: Kumain na ako, en: I already ate }
          - { tl: Hindi pa ako kumakain, en: "I haven't eaten yet" }
