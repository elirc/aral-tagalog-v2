        options: [Umalis, Dumating, Sumulat]
      - type: listen
        audio: sumulat_ako_ng_kanta
        answer_tl: Sumulat ako ng kanta
        extra_words: [sumusulat, libro]
      - type: choice
        prompt: "Which is the 'happening now' form of 'sumulat' (wrote)?"
        answer: Sumusulat
        distractors: [Susulat, Sumulat, Sulat]
        audio: sumusulat
        audio_text: Sumusulat
      - type: translate
        prompt_tl: Dumating ang lola ko kahapon.
        answer_en: My grandmother arrived yesterday.
        accept: ["My grandma arrived yesterday"]
        extra_words: [left, tomorrow, mother]
