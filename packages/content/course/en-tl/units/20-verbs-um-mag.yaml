      - type: choice
        prompt: "Your friend asks 'Nagluto ka na ba?' You haven't yet. Say:"
        answer: Hindi pa ako nagluluto.
        distractors: ["Oo, nagluto na ako.", Nagluluto pa ako., Magluluto ka ba?]
        audio: hindi_pa_ako_nagluluto
