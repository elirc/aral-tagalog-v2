        answer: Naghahanap ka ba ng trabaho?
        distractors: ["Saan ka nagtatrabaho?", "Ano ang trabaho mo?", "Pagod ka ba?"]
        audio: naghahanap_ka_ba_ng_trabaho
        audio_text: Naghahanap ka ba ng trabaho?
      - type: translate
        prompt_tl: Naghahanap ng empleyado ang kompanya.
        answer_en: The company is looking for an employee.
        accept: ["The company is looking for employees"]
        extra_words: [boss, office, works]
        audio: naghahanap_ng_empleyado_ang_kompanya
      - type: translate
        prompt_en: My older brother is looking for a job.
        answer_tl: Naghahanap ng trabaho ang kuya ko.
        accept: ["Naghahanap ang kuya ko ng trabaho"]
        extra_words: [nagtatrabaho, ate, sa]
        audio: naghahanap_ng_trabaho_ang_kuya_ko
      - type: translate
        prompt_en: I want to apply to a big company.
        answer_tl: Gusto kong mag-apply sa malaking kompanya.
        extra_words: [magtrabaho, maliit, siya]
        audio: gusto_kong_mag_apply_sa_malaking_kompanya
  - id: jobs-6
    title: Ang interbyu
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: interbyu, en: interview }
          - { tl: karanasan, en: experience }
          - { tl: amo, en: boss }
          - { tl: sahod, en: salary }
      - type: choice
        prompt: "'May karanasan ka ba?' means..."
        answer: Do you have experience?
        distractors: ["Do you have a job?", "Are you the boss?", "Do you have an interview?"]
        audio: may_karanasan_ka_ba
        audio_text: May karanasan ka ba?
      - type: translate
        prompt_tl: May interbyu ako bukas.
