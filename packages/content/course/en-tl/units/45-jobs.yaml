  - id: jobs-5
    title: Naghahanap ng trabaho
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: maghanap, en: to look for }
          - { tl: mag-apply, en: to apply }
          - { tl: trabaho, en: job }
          - { tl: kompanya, en: company }
      - type: choice
        prompt: "'Naghahanap ako ng trabaho' means..."
