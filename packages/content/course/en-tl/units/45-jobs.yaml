        extra_words: [yesterday, office, boss]
        audio: may_interbyu_ako_bukas
      - type: fill_blank
        sentence: "Limang taon ___ akong nagtatrabaho."
        translation: "I have been working for five years."
        answer: na
        options: [na, pa, ba]
        hint: '"na" (already) + "ako" takes the -ng linker before the verb: "na akong nagtatrabaho".'
      - type: listen
        audio: may_karanasan_po_ako
        answer_tl: May karanasan po ako
        extra_words: [interbyu, wala]
      - type: translate
        prompt_tl: Bakit gusto mong magtrabaho dito?
        answer_en: Why do you want to work here?
        extra_words: [there, where, live]
        audio: bakit_gusto_mong_magtrabaho_dito
      - type: choice
        prompt: "The interviewer asks 'Bakit gusto mong magtrabaho dito?' A good answer is..."
        answer: Masipag po ako at gusto ko ang kompanya.
        distractors: [Tamad po ako., Ayaw ko ng trabaho., Saan po ang banyo?]
        audio: masipag_po_ako_at_gusto_ko_ang_kompanya
        audio_text: Masipag po ako at gusto ko ang kompanya.
        hint: Use "po" with an interviewer — it is a formal situation.
      - type: translate
        prompt_en: I have been working for three years.
        answer_tl: Tatlong taon na akong nagtatrabaho.
        extra_words: [lima, ako, nag-aaral]
        audio: tatlong_taon_na_akong_nagtatrabaho
      - type: translate
        prompt_en: I have an interview at the company tomorrow.
        answer_tl: May interbyu ako sa kompanya bukas.
        accept: ["Bukas, may interbyu ako sa kompanya"]
        extra_words: [kahapon, opisina, siya]
        audio: may_interbyu_ako_sa_kompanya_bukas
