        extra_words: [nag-aaral, paaralan, tatay]
        audio: nagtuturo_ng_matematika_ang_nanay_ko_sa_unibersidad
  - id: jobs-8
    title: May pasok ka ba?
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: pasok, en: work or school day }
          - { tl: maaga, en: early }
          - { tl: pagod, en: tired }
          - { tl: magpahinga, en: to rest }
      - type: choice
        prompt: "'May pasok ka ba bukas?' asks..."
        answer: If you have work or school tomorrow
        distractors:
          - If you are coming inside now
          - If you are tired tomorrow
          - Where you work tomorrow
        audio: may_pasok_ka_ba_bukas
        audio_text: May pasok ka ba bukas?
        hint: '"pasok" literally means "going in" — the day you go in to work or school.'
      - type: translate
        prompt_tl: Walang pasok sa Linggo.
        answer_en: There is no work on Sunday.
        accept:
          - "There's no work on Sunday"
          - "There is no school on Sunday"
          - "There's no school on Sunday"
        extra_words: [Monday, early, office]
        audio: walang_pasok_sa_linggo
      - type: fill_blank
        sentence: "___ ang pasok ko bukas."
        translation: "I start work early tomorrow."
        answer: Maaga
        options: [Maaga, Pagod, Mabait]
      - type: listen
        audio: maaga_ang_pasok_ko
        answer_tl: Maaga ang pasok ko
        extra_words: [wala, pagod]
      - type: translate
        prompt_tl: Pagod ako kasi maaga ang pasok ko.
        answer_en: I'm tired because I start work early.
        accept:
          - "I am tired because I start work early"
          - "I'm tired because my work starts early"
          - "I am tired because my work starts early"
        extra_words: [late, happy, school]
        audio: pagod_ako_kasi_maaga_ang_pasok_ko
      - type: choice
        prompt: "Tomorrow is your day off. Tell your friend:"
        answer: Wala akong pasok bukas, magpapahinga ako.
        distractors:
          - Maaga ang pasok ko bukas.
          - May interbyu ako bukas.
          - Pagod na ako sa opisina.
        audio: wala_akong_pasok_bukas_magpapahinga_ako
        audio_text: Wala akong pasok bukas, magpapahinga ako.
      - type: translate
        prompt_en: I don't have work tomorrow.
        answer_tl: Wala akong pasok bukas.
        accept: ["Bukas, wala akong pasok"]
        extra_words: [may, maaga, siya]
        audio: wala_akong_pasok_bukas
        hint: '"wala" + "ako" takes the -ng linker: "wala akong pasok".'
      - type: translate
        prompt_en: Do you have work on Saturday?
        answer_tl: May pasok ka ba sa Sabado?
        extra_words: [wala, Linggo, ako]
        audio: may_pasok_ka_ba_sa_sabado
