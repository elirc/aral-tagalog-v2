          - Official Family Welfare
          - Overseas Filipino Weekend
      - type: translate
        prompt_en: My cousin is a soldier.
        answer_tl: Sundalo ang pinsan ko.
        extra_words: [pulis, bumbero, siya]
        audio: sundalo_ang_pinsan_ko
      - type: translate
        prompt_tl: Ano ang propesyon ng nanay mo?
        answer_en: What is your mom's profession?
        accept:
          - "What is your mother's profession?"
          - "What is your mom's job?"
          - "What is your mother's job?"
        extra_words: [where, dad, salary]
        audio: ano_ang_propesyon_ng_nanay_mo
      - type: choice
        prompt: "A neighbor asks what you do for a living. Say:"
        answer: Guro ako sa paaralan.
        distractors:
          - Ano ang trabaho mo?
          - Nasaan ang paaralan?
          - Gusto kong kumanta.
        audio: guro_ako_sa_paaralan
        audio_text: Guro ako sa paaralan.
      - type: translate
        prompt_en: My older brother works in another country and my mom is a teacher.
        answer_tl: Nagtatrabaho ang kuya ko sa ibang bansa at guro ang nanay ko.
        accept: ["Nagtatrabaho sa ibang bansa ang kuya ko at guro ang nanay ko"]
        extra_words: [doktor, sahod, sila]
