        answer_tl: Nagtatrabaho ang magsasaka araw-araw.
        accept: ["Nagtatrabaho araw-araw ang magsasaka", "Araw-araw nagtatrabaho ang magsasaka"]
        extra_words: [bukas, kahapon, mangingisda]
        audio: nagtatrabaho_ang_magsasaka_araw_araw
        grading: { hyphens: true }
  - id: jobs-3
    title: Ano ang trabaho mo?
    xp: 10
    exercises:
      - type: choice
        prompt: "'Saan ka nagtatrabaho?' means..."
        answer: Where do you work?
        distractors: ["What is your job?", "When do you work?", "Do you like your job?"]
        audio: saan_ka_nagtatrabaho
        audio_text: Saan ka nagtatrabaho?
      - type: translate
        prompt_tl: Nagtatrabaho ako sa opisina.
        answer_en: I work in an office.
        accept: ["I work at an office", "I am working in an office"]
        extra_words: [school, market, hospital]
        audio: nagtatrabaho_ako_sa_opisina
      - type: translate
        prompt_en: Where does he work?
        answer_tl: Saan siya nagtatrabaho?
        extra_words: [ano, ako, opisina]
        audio: saan_siya_nagtatrabaho
      - type: match
        pairs:
          - { tl: trabaho, en: work }
          - { tl: opisina, en: office }
          - { tl: kompanya, en: company }
          - { tl: empleyado, en: employee }
      - type: fill_blank
        sentence: "___ ang trabaho mo?"
        translation: "What is your job?"
        answer: Ano
        options: [Ano, Saan, Bakit]
      - type: listen
        audio: nasa_opisina_ang_amo_ko
        answer_tl: Nasa opisina ang amo ko
        extra_words: [kompanya, empleyado]
      - type: choice
        prompt: "'Amo' means..."
        answer: Boss
        distractors: [Employee, Salary, Office]
        audio: amo
        audio_text: Amo
      - type: translate
        prompt_tl: Empleyado siya sa isang kompanya.
        answer_en: He is an employee at a company.
        accept:
          - "She is an employee at a company"
          - "He is an employee of a company"
          - "She is an employee of a company"
        extra_words: [boss, school, office]
        audio: empleyado_siya_sa_isang_kompanya
      - type: translate
        prompt_en: I want to work in a big company.
        answer_tl: Gusto kong magtrabaho sa malaking kompanya.
        extra_words: [opisina, nagtatrabaho, siya]
        audio: gusto_kong_magtrabaho_sa_malaking_kompanya
        hint: '"gusto ko" + a verb takes the -ng linker → "gusto kong magtrabaho".'
  - id: jobs-4
