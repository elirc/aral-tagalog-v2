        distractors: [I have a job, I lost my job, I like my job]
        audio: naghahanap_ako_ng_trabaho
        audio_text: Naghahanap ako ng trabaho.
        hint: '"maghanap" = to look for; "naghahanap" = is looking for.'
      - type: translate
