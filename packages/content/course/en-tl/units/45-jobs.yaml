        hint: '"mag-apply" is borrowed from English and works like any mag- verb: nag-apply = applied.'
      - type: fill_blank
        sentence: "___ siya ng trabaho sa ospital."
        translation: "She is looking for a job at the hospital."
        answer: Naghahanap
        options: [Naghahanap, Nagtatrabaho, Nag-aaral]
      - type: listen
        audio: gusto_kong_mag_apply_sa_ospital
        answer_tl: Gusto kong mag-apply sa ospital
        extra_words: [opisina, siya]
      - type: choice
