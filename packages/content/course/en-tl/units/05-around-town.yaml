        distractors: [Walk to the corner, Go to the pharmacy, Wait in front of the hospital]
        audio: opo_sumakay_po_kayo_ng_jeepney
        audio_text: Opo. Sumakay po kayo ng jeepney.
      - type: translate
        prompt_tl: Malayo ang palengke sa paaralan.
        answer_en: The market is far from the school.
        accept: ["The market is far from school"]
        extra_words: [near, beside, church]
        audio: malayo_ang_palengke_sa_paaralan
      - type: fill_blank
        sentence: "Malapit ang botika ___ ospital."
        translation: "The pharmacy is near the hospital."
        answer: sa
        options: [sa, ng, nasa]
        audio: malapit_ang_botika_sa_ospital
        hint: 'Malapit and malayo take "sa": malapit sa ospital.'
      - type: fill_blank
        sentence: "Nasa harap ___ palengke ang sakayan."
        translation: "The stop is in front of the market."
        answer: ng
        options: [ng, sa, si]
        audio: nasa_harap_ng_palengke_ang_sakayan
        hint: 'Position words like tabi and harap take "ng": harap ng palengke.'
      - type: listen
        audio: sumakay_kami_ng_jeepney_sa_kanto
        answer_tl: Sumakay kami ng jeepney sa kanto
        extra_words: [sakayan, ako]
      - type: match
