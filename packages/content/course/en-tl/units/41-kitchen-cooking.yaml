        answer_tl: Maasim at masarap ang sinigang ni Nanay.
        accept: ["Masarap at maasim ang sinigang ni Nanay"]
        extra_words: [matamis, adobo, ng]
        hint: '"ni Nanay" = Mom''s — "ni" marks the owner when it is a name or title.'
        audio: maasim_at_masarap_ang_sinigang_ni_nanay
  - id: cooking-7
    title: Paki- in the kitchen
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: pakihalo, en: please stir }
          - { tl: pakihiwa, en: please slice }
          - { tl: pakihugas, en: please wash }
          - { tl: pakiabot, en: please pass }
      - type: choice
        prompt: "'Pakihalo ang sabaw' means..."
        answer: Please stir the soup
        distractors: [Please taste the soup, Please pass the soup, Please boil the soup]
        audio: pakihalo_ang_sabaw
        audio_text: Pakihalo ang sabaw.
        hint: '"halo" means mix — the same root as halo-halo, "mix-mix".'
      - type: translate
        prompt_en: Slice some onion.
        answer_tl: Maghiwa ka ng sibuyas.
        extra_words: [bawang, naghihiwa, ang]
        hint: 'A command uses the plain mag- form + "ka": maghiwa ka.'
        audio: maghiwa_ka_ng_sibuyas
      - type: fill_blank
        sentence: "___ mo ang manok sa kaldero."
        translation: "Put the chicken in the pot."
        answer: Ilagay
        options: [Ilagay, Maglagay, Kumain]
        hint: '"Ilagay mo ___" = put ___ in. With "ka" you would say "Maglagay ka ng ___" instead.'
      - type: listen
        audio: pakihiwa_ang_bawang
        answer_tl: Pakihiwa ang bawang
        extra_words: [sibuyas, pakihalo]
      - type: choice
        prompt: "You need someone to wash the rice. Say:"
        answer: Pakihugas ang bigas.
        distractors: [Pakihalo ang bigas., Pakiabot ang bigas., Bumili ka ng bigas.]
        audio: pakihugas_ang_bigas
        audio_text: Pakihugas ang bigas.
      - type: translate
        prompt_tl: Huwag kang maglagay ng asukal sa adobo.
        answer_en: Don't put sugar in the adobo.
        accept: ["Do not put sugar in the adobo", "Don't add sugar to the adobo"]
        extra_words: [salt, vinegar, pot]
        hint: '"maglagay" = to put / add; "huwag kang" + verb = don''t.'
        audio: huwag_kang_maglagay_ng_asukal_sa_adobo
      - type: translate
        prompt_en: Please stir the sinigang.
        answer_tl: Pakihalo ang sinigang.
        accept: ["Pakihalo po ang sinigang", "Pakihalo mo ang sinigang"]
        extra_words: [pakihiwa, sabaw, ng]
        audio: pakihalo_ang_sinigang
      - type: translate
        prompt_en: Slice some onion first, then fry the fish.
        answer_tl: Maghiwa ka muna ng sibuyas, tapos magprito ka ng isda.
        accept: ["Maghiwa ka muna ng sibuyas tapos magprito ka ng isda"]
        extra_words: [nagprito, bago, bawang]
        hint: '"muna" (first) comes right after "ka"; "tapos" = then.'
        audio: maghiwa_ka_muna_ng_sibuyas_tapos_magprito_ka_ng_isda
