        answer_en: I will cook rice later, then I will fry fish.
        accept: ["I will cook rice later, then fry fish", "I'll cook rice later, then I'll fry fish"]
        extra_words: [boiled, yesterday, chicken]
        audio: magsasaing_ako_mamaya_tapos_magpiprito_ako_ng_isda
      - type: translate
        prompt_en: We cook rice every day.
        answer_tl: Araw-araw kaming nagsasaing.
        accept: ["Nagsasaing kami araw-araw"]
        extra_words: [nagsaing, bigas, sila]
        hint: 'After "araw-araw", "kami" takes the linker → "kaming".'
        grading: { hyphens: true }
        audio: araw_araw_kaming_nagsasaing
