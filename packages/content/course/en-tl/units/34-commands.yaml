      - type: translate
        prompt_en: Take care! Don't play in the kitchen.
        answer_tl: Mag-ingat ka! Huwag kang maglaro sa kusina.
        extra_words: [maglinis, sala, kayong]
        audio: mag_ingat_ka_huwag_kang_maglaro_sa_kusina
