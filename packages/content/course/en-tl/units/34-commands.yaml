          - { tl: halika, en: come here }
      - type: choice
        prompt: "'Tumigil ka' means..."
        answer: Stop
        distractors: [Listen, Wait, Sit down]
        audio: tumigil_ka
        audio_text: Tumigil ka!
      - type: choice
        prompt: "'Makinig' means..."
        answer: Listen
        distractors: [Speak, Stop, Wait]
