      - type: translate
        prompt_tl: May kompyuter ba sa paaralan?
        answer_en: Is there a computer at the school?
        accept: ["Is there a computer at school?", "Do they have a computer at the school?"]
        extra_words: [market, hospital, phone]
        audio: may_kompyuter_ba_sa_paaralan
      - type: translate
        prompt_tl: Malungkot ako kasi walang internet sa bahay.
        answer_en: I am sad because there is no internet at home.
        accept: ["I'm sad because there's no internet at home", "I am sad because we have no internet at home"]
        extra_words: [happy, school, fast]
        audio: malungkot_ako_kasi_walang_internet_sa_bahay
