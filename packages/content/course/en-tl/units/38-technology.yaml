id: technology
title: Phones & Internet
description: Buy load, text and call, get on the wifi, and talk about photos and videos.
tip: >-
  English loanwords take Tagalog affixes and are joined with a hyphen:
  load → mag-load (to buy credit), naglo-load (is buying credit); text →
  nag-text (texted), nagte-text (is texting). Phones in the Philippines are
  mostly prepaid, so "load" is bought in small amounts at any corner store —
  "Wala akong load" is a real, everyday excuse.
lessons:
  - id: tech-1
    title: Selpon at load
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: selpon, en: cellphone }
          - { tl: load, en: phone credit }
          - { tl: baterya, en: battery }
          - { tl: charger, en: charger }
      - type: choice
        prompt: "'Mag-load' means..."
        answer: To buy phone credit
        distractors: [To make a call, To send a text, To charge a phone]
        audio: mag_load
        audio_text: Mag-load
      - type: translate
        prompt_tl: Wala akong load.
        answer_en: I have no load.
        accept: ["I don't have load", "I have no phone credit", "I don't have any load"]
        extra_words: [money, water, phone]
        audio: wala_akong_load
      - type: translate
        prompt_en: Do you have load?
        answer_tl: May load ka ba?
        accept: ["May load po ba kayo?"]
        extra_words: [wala, pera, selpon]
        audio: may_load_ka_ba
      - type: fill_blank
        sentence: "Wala nang ___ ang selpon ko."
        translation: "My phone has no battery left."
        answer: baterya
        options: [baterya, load, tubig]
        grading: { ng_nang: true }
      - type: listen
        audio: may_selpon_ako
        answer_tl: May selpon ako
        extra_words: [load, wala]
      - type: choice
        prompt: "'Numero' means..."
        answer: Number
        distractors: [Name, Price, Money]
        audio: numero
        audio_text: Numero
      - type: translate
        prompt_en: What is your number?
        answer_tl: Ano ang numero mo?
        accept: ["Ano po ang numero ninyo?"]
        extra_words: [pangalan, magkano, siya]
        audio: ano_ang_numero_mo
      - type: choice
        prompt: "Your phone is about to die. You ask a friend:"
        answer: "Nasaan ang charger?"
        distractors: ["Magkano ang selpon?", "May load ka ba?", "Ano ang numero mo?"]
        audio: nasaan_ang_charger
        audio_text: Nasaan ang charger?
      - type: translate
        prompt_tl: Bumili ako ng load sa tindahan kahapon.
        answer_en: I bought load at the store yesterday.
        accept: ["Yesterday I bought load at the store", "I bought phone credit at the store yesterday"]
        extra_words: [tomorrow, market, sold]
        audio: bumili_ako_ng_load_sa_tindahan_kahapon
  - id: tech-2
    title: Tawag at text
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: tumawag, en: called }
          - { tl: tumatawag, en: is calling }
          - { tl: tatawag, en: will call }
          - { tl: nagte-text, en: is texting }
      - type: choice
        prompt: "'Tawag' means..."
        answer: A call
        distractors: [A text, A photo, A number]
        audio: tawag
        audio_text: Tawag
      - type: choice
        prompt: "'Tumatawag siya sa nanay niya.' means..."
        answer: She is calling her mom
        distractors: [She called her mom, She will call her mom, She is texting her mom]
        audio: tumatawag_siya_sa_nanay_niya
        audio_text: Tumatawag siya sa nanay niya.
      - type: translate
        prompt_tl: Tumawag ako kahapon.
        answer_en: I called yesterday.
        accept: ["I made a call yesterday", "Yesterday I called"]
        extra_words: [tomorrow, texted, will]
        audio: tumawag_ako_kahapon
      - type: translate
        prompt_en: I will call tomorrow.
        answer_tl: Tatawag ako bukas.
        accept:
          - "Bukas, tatawag ako"
          - "Bukas ako tatawag"
        extra_words: [tumawag, kahapon, siya]
        audio: tatawag_ako_bukas
      - type: fill_blank
        sentence: "___ ako sa kaibigan ko ngayon."
        translation: "I am calling my friend today."
        answer: Tumatawag
        options: [Tumatawag, Tumawag, Tatawag]
        hint: 'Ongoing action → -um- plus a doubled first syllable of the ROOT: tawag → ta-tawag → tumatawag.'
      - type: listen
        audio: tumatawag_ang_kaibigan_ko
        answer_tl: Tumatawag ang kaibigan ko
        extra_words: [tatawag, nanay]
      - type: fill_blank
        sentence: "Marami akong ___ sa selpon ko."
        translation: "I have a lot of texts on my phone."
        answer: text
        options: [text, tawag, load]
      - type: translate
        prompt_tl: Nagte-text siya sa kapatid niya.
        answer_en: He is texting his sibling.
        accept: ["She is texting her sibling", "He is texting his brother", "She is texting her sister", "She is texting her brother", "He is texting his sister"]
        extra_words: [calling, mom, friend]
        grading: { hyphens: true }
        audio: nagte_text_siya_sa_kapatid_niya
      - type: translate
        prompt_en: I will call my mom in the evening.
        answer_tl: Tatawag ako sa nanay ko sa gabi.
        accept:
          - "Sa gabi, tatawag ako sa nanay ko"
          - "Tatawag ako sa gabi sa nanay ko"
        extra_words: [tumawag, bukas, kaibigan]
        audio: tatawag_ako_sa_nanay_ko_sa_gabi
