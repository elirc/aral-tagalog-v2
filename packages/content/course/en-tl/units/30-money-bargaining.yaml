id: money-bargaining
title: Money & Bargaining
description: Ask prices, haggle politely, and count your change at the palengke.
tip: >-
  Bargaining is normal at the palengke — open with "May tawad po ba?" (Is there
  a discount?). Prices are usually said with Spanish-derived numbers: bente
  (20), singkwenta (50). Become a suki — a regular customer — and the discounts
  come on their own. In malls and groceries, prices are fixed: no haggling.
lessons:
  - id: bargain-1
    title: Money basics
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: pera, en: money }
          - { tl: piso, en: peso }
          - { tl: presyo, en: price }
          - { tl: barya, en: coins }
      - type: choice
        prompt: "'Barya' means..."
        answer: Coins / small change
        distractors: [Bills, Payment, Price]
        audio: barya
        audio_text: Barya
      - type: translate
        prompt_tl: Wala akong pera.
        answer_en: I have no money.
        accept: ["I don't have money", "I do not have money"]
        extra_words: [change, price, much]
        audio: wala_akong_pera
      - type: translate
        prompt_en: This is ten pesos.
        answer_tl: Sampung piso ito.
        extra_words: [lima, presyo, pera]
        audio: sampung_piso_ito
      - type: fill_blank
        sentence: "Magkano ang ___ ng isda?"
        translation: "How much is the price of the fish?"
        answer: presyo
        options: [presyo, pera, sukli]
      - type: listen
        audio: magkano_ito
        answer_tl: Magkano ito
        extra_words: [pera, piso]
      - type: choice
        prompt: "'Bente' means..."
        answer: Twenty
        distractors: [Fifty, Twelve, Two]
        audio: bente
        audio_text: Bente
        hint: Prices are usually said with Spanish-derived numbers.
      - type: translate
        prompt_tl: Bumili ako ng tinapay sa tindahan.
        answer_en: I bought bread at the store.
        accept: ["I bought bread in the store"]
        extra_words: [fish, market, money]
        audio: bumili_ako_ng_tinapay_sa_tindahan
  - id: bargain-2
    title: Magkano ito?
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: mahal, en: expensive }
          - { tl: mura, en: cheap }
          - { tl: magkano, en: how much }
          - { tl: tindera, en: vendor }
      - type: choice
        prompt: "'Singkwenta' means..."
