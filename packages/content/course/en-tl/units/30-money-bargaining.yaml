        hint: "The 't links tens and ones: dalawampu't lima = 25, tatlumpu't dalawa = 32."
      - type: translate
        prompt_en: The fare is twenty-five pesos.
        answer_tl: Dalawampu't limang piso ang pamasahe.
        extra_words: [tatlumpung, sukli, bayad]
        audio: dalawamput_limang_piso_ang_pamasahe
      - type: translate
