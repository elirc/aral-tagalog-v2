      - type: translate
        prompt_tl: Singkwenta ang bayad ko at sampu ang sukli.
        answer_en: My payment is fifty and the change is ten.
        accept:
          ["I paid fifty and the change is ten", "My payment is fifty and my change is ten"]
        extra_words: [twenty, price, coins]
        audio: singkwenta_ang_bayad_ko_at_sampu_ang_sukli
  - id: bargain-5
