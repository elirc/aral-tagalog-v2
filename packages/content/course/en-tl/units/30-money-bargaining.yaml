        audio_text: Libre po ito.
      - type: translate
        prompt_tl: Malaki ang gastos namin araw-araw.
        answer_en: Our expenses are big every day.
        accept: ["We spend a lot every day", "Our daily expenses are big", "Every day our expenses are big"]
        extra_words: [small, money, week]
        audio: malaki_ang_gastos_namin_araw_araw
