      - type: translate
        prompt_tl: Magkano ang isang kilo ng manok?
        answer_en: How much is one kilo of chicken?
        accept: ["How much is a kilo of chicken?"]
        extra_words: [fish, cheap, two]
        audio: magkano_ang_isang_kilo_ng_manok
      - type: translate
        prompt_en: The shoes at the store are expensive.
        answer_tl: Mahal ang sapatos sa tindahan.
        accept: ["Mahal sa tindahan ang sapatos"]
        extra_words: [mura, palengke, damit]
        audio: mahal_ang_sapatos_sa_tindahan
  - id: bargain-3
    title: Pwedeng tumawad?
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: tawad, en: discount }
          - { tl: tumawad, en: to haggle }
          - { tl: libre, en: free }
          - { tl: suki, en: regular customer }
      - type: choice
        prompt: "'Tawad' means..."
        answer: Discount
        distractors: [Change, Price, Payment]
        audio: tawad
        audio_text: Tawad
      - type: translate
        prompt_tl: Pwede po bang tumawad?
        answer_en: Can I haggle?
        accept:
          [
            "May I haggle?",
            "Can I ask for a discount?",
            "May I ask for a discount?",
            "Can we haggle?",
          ]
        extra_words: [pay, buy, free]
        audio: pwede_po_bang_tumawad
        hint: '"tumawad" is to haggle — to ask the price down.'
      - type: choice
        prompt: "'Pwede' means..."
        answer: Can / possible
        distractors: [Want, Must, Free]
        audio: pwede
        audio_text: Pwede
      - type: translate
        prompt_en: Is there a discount?
        answer_tl: May tawad po ba?
        accept: ["May tawad ba?"]
        extra_words: [sukli, libre, mura]
        audio: may_tawad_po_ba
      - type: fill_blank
        sentence: "___ po ba ito?"
        translation: "Is this free?"
        answer: Libre
        options: [Libre, Mahal, Bayad]
      - type: listen
        audio: may_tawad_po_ba
        answer_tl: May tawad po ba
        extra_words: [sukli, libre]
      - type: choice
        prompt: "At the palengke, a 'suki' is..."
        answer: A regular customer
        distractors: [A first-time buyer, A discount, A market stall]
        audio: suki
        audio_text: Suki
      - type: translate
        prompt_tl: Mahal po ang isda. May tawad po ba?
        answer_en: The fish is expensive. Is there a discount?
        accept:
          ["The fish is expensive, is there a discount?", "The fish is expensive. Is there a discount, please?"]
        extra_words: [cheap, chicken, change]
        audio: mahal_po_ang_isda_may_tawad_po_ba
  - id: bargain-4
    title: Bayad and sukli
    xp: 10
    exercises:
