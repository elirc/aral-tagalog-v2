        audio_text: Ako naman!
      - type: translate
        prompt_tl: Masarap naman ang kanin.
        answer_en: The rice is delicious, though.
        accept: ["The rice is actually delicious", "The rice is delicious though"]
        extra_words: [bread, expensive, also]
        audio: masarap_naman_ang_kanin
      - type: fill_blank
