        hint: '"Bukas" ends in a consonant — keep "daw".'
      - type: translate
        prompt_en: They say it will rain tomorrow.
        answer_tl: Uulan daw bukas.
        extra_words: [raw, ngayon, mainit]
        audio: uulan_daw_bukas
