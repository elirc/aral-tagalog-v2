      - type: fill_blank
        sentence: "Masaya ___ ang lola ko."
        translation: "My grandmother is also happy."
        answer: rin
        options: [rin, din, pa]
        hint: '"Masaya" ends in a vowel — "din" becomes "rin".'
      - type: listen
        audio: mabuti_rin_ako
        answer_tl: Mabuti rin ako
