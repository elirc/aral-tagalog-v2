id: sports
title: Sports & Exercise
description: Talk about basketball, boxing, and volleyball, and say who runs, swims, wins, and loses.
tip: >-
  Sport verbs love the -um- infix: takbo → tumakbo (run), langoy → lumangoy
  (swim). Matalo (to lose) takes ma-, while manalo (to win) is mang- + talo;
  both swap the m for n in the past: natalo (lost), nanalo (won). Basketball is
  the national obsession — nearly every barangay has a covered court, and a
  fiesta is not a fiesta without a tournament.
lessons:
  - id: sports-1
    title: Mga isport
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: isport, en: sport }
          - { tl: basketbol, en: basketball }
          - { tl: boksing, en: boxing }
          - { tl: bolibol, en: volleyball }
      - type: choice
        prompt: "'Boksing' means..."
        answer: Boxing
        distractors: [Basketball, Volleyball, Swimming]
        audio: boksing
        audio_text: Boksing
      - type: translate
        prompt_tl: Naglalaro kami ng bolibol.
        answer_en: We are playing volleyball.
        accept: ["We play volleyball"]
        extra_words: [basketball, boxing, running]
        audio: naglalaro_kami_ng_bolibol
      - type: translate
        prompt_en: Basketball is my favorite sport.
        answer_tl: Basketbol ang paborito kong isport.
        accept: ["Paborito kong isport ang basketbol"]
        extra_words: [laro, boksing, koponan]
        audio: basketbol_ang_paborito_kong_isport
      - type: fill_blank
        sentence: "Gusto niyang manood ng ___."
        translation: "He wants to watch boxing."
        answer: boksing
        options: [boksing, kanta, pelikula]
      - type: choice
        prompt: "'Bola' means..."
        answer: Ball
        distractors: [Team, Game, Player]
        audio: bola
        audio_text: Bola
      - type: listen
        audio: naglalaro_sila_ng_bolibol
        answer_tl: Naglalaro sila ng bolibol
        extra_words: [basketbol, kami]
      - type: choice
        prompt: "'Koponan' means..."
        answer: Team
        distractors: [Ball, Court, Score]
        audio: koponan
        audio_text: Koponan
      - type: translate
        prompt_tl: Ano ang paborito mong isport?
        answer_en: What is your favorite sport?
        accept: ["What sport is your favorite?"]
        extra_words: [hobby, song, game]
        audio: ano_ang_paborito_mong_isport
  - id: sports-2
    title: Mag-ehersisyo tayo
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: tumakbo, en: to run }
