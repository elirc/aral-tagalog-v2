        distractors: [To run, To dance, To read]
        audio: lumangoy
        audio_text: Lumangoy
      - type: translate
        prompt_tl: Tumatakbo ako araw-araw.
        answer_en: I run every day.
        accept: ["I run everyday", "I go running every day"]
        extra_words: [swim, walk, night]
        audio: tumatakbo_ako_araw_araw
        grading: { hyphens: true }
