        audio: tara_maglaro_tayo_ng_bolibol_mamaya
      - type: translate
        prompt_en: Can I join?
        answer_tl: Pwede ba akong sumali?
        extra_words: [sumama, ka, tayo]
        audio: pwede_ba_akong_sumali
      - type: translate
        prompt_en: Come on, let's play basketball! Do you want to join?
        answer_tl: Tara, maglaro tayo ng basketbol! Gusto mo bang sumali?
        extra_words: [bolibol, sumama, kami]
        audio: tara_maglaro_tayo_ng_basketbol_gusto_mo_bang_sumali
