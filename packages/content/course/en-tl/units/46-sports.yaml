        translation: "Let's exercise tomorrow."
        answer: Mag-ehersisyo
        options: [Mag-ehersisyo, Kumanta, Magbasa]
      - type: listen
        audio: mag_ehersisyo_tayo
        answer_tl: Mag-ehersisyo tayo
        extra_words: [tumakbo, ako]
      - type: translate
        prompt_tl: Nag-eehersisyo siya sa bahay.
        answer_en: He exercises at home.
        accept:
          ["She exercises at home", "He is exercising at home", "She is exercising at home"]
        extra_words: [school, swims, market]
        audio: nag_eehersisyo_siya_sa_bahay
      - type: translate
        prompt_en: I want to run fast.
        answer_tl: Gusto kong tumakbo nang mabilis.
        extra_words: [lumangoy, mabagal, siya]
        audio: gusto_kong_tumakbo_nang_mabilis
        grading: { ng_nang: true }
        hint: 'Before an adverb of manner, use "nang": tumakbo nang mabilis.'
  - id: sports-3
    title: Manalo at matalo
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: manalo, en: to win }
          - { tl: matalo, en: to lose }
          - { tl: koponan, en: team }
          - { tl: puntos, en: points }
      - type: choice
        prompt: "'Nanalo kami' means..."
        answer: We won
        distractors: [We lost, They won, We are playing]
        audio: nanalo_kami
        audio_text: Nanalo kami.
      - type: translate
        prompt_tl: Nanalo ang koponan namin.
        answer_en: Our team won.
        accept: ["Our team has won"]
        extra_words: [lost, played, their]
        audio: nanalo_ang_koponan_namin
      - type: translate
        prompt_en: They lost yesterday.
        answer_tl: Natalo sila kahapon.
        accept:
          - "Kahapon, natalo sila"
          - "Kahapon sila natalo"
        extra_words: [nanalo, bukas, kami]
        audio: natalo_sila_kahapon
      - type: fill_blank
        sentence: "___ kami sa laro."
        translation: "We lost the game."
        answer: Natalo
        options: [Natalo, Nanalo, Naglalaro]
      - type: choice
        prompt: "'Puntos' means..."
        answer: Points
        distractors: [Team, Player, Ball]
        audio: puntos
        audio_text: Puntos
      - type: choice
        prompt: "'Gusto kong manalo' means..."
