        distractors: [I want to play, I want to lose, I won]
        audio: gusto_kong_manalo
        audio_text: Gusto kong manalo.
      - type: listen
        audio: nanalo_ang_koponan_ko
        answer_tl: Nanalo ang koponan ko
        extra_words: [natalo, kami]
      - type: translate
        prompt_tl: Ilang puntos ang koponan mo?
        answer_en: How many points does your team have?
        accept: ["How many points does your team have", "How many points did your team get?"]
        extra_words: [where, who, ball]
        audio: ilang_puntos_ang_koponan_mo
      - type: translate
        prompt_en: We are happy because our team won.
        answer_tl: Masaya kami kasi nanalo ang koponan namin.
        accept: ["Masaya kami dahil nanalo ang koponan namin"]
        extra_words: [malungkot, natalo, sila]
        audio: masaya_kami_kasi_nanalo_ang_koponan_namin
  - id: sports-4
    title: Sa laban
    xp: 10
