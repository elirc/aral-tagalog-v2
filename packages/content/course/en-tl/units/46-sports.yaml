        prompt_en: I'm dripping with sweat. Let's rest first.
        answer_tl: Pawis na pawis ako. Magpahinga muna tayo.
        extra_words: [pagod, kami, laro]
        audio: pawis_na_pawis_ako_magpahinga_muna_tayo
