id: know-think-hope
title: I Know, I Think, I Hope
description: >-
  Say what you know, think, thought, and hope — alam ko, ewan ko, sa tingin ko,
  akala ko, sana, baka — and join ideas with kung, kapag, and kahit.
tip: >-
  "Alam" (know) takes the ko-set: "Alam ko", "Alam mo ba?", "Hindi ko alam" —
  or the casual shrug "Ewan ko". To know THAT something is so, add the linker:
  "Alam kong pagod ka". To not know IF/WHERE/WHO, use kung: "Hindi ko alam kung
  nasaan siya". "Sa tingin ko" is your opinion now; "Akala ko" is what you
  believed but got wrong. "Sana" makes a wish and "baka" a maybe — both take
  the basic verb form: "Sana manalo tayo", "Baka umulan". "Sigurado" = sure,
  but "siguro" = probably! Finally, "kung" = if (it may not happen), "kapag" or
  short "pag" = when/whenever (you expect it), and "kahit" = even if / even
  though: "Kahit pagod ako, masaya ako".
lessons:
  - id: knowthink-1
    title: Alam ko — I know
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: Alam ko, en: I know }
          - { tl: Hindi ko alam, en: "I don't know" }
          - { tl: Alam mo ba?, en: Do you know? }
          - { tl: Alam niya, en: He knows }
          - { tl: Alam namin, en: We know }
      - type: choice
        prompt: "'Hindi ko alam' means..."
        answer: "I don't know"
        distractors: [I know, "I don't want to", "I don't have any"]
        audio: hindi_ko_alam
        audio_text: Hindi ko alam.
      - type: translate
        prompt_tl: Alam ko ang pangalan niya.
        answer_en: I know his name.
        accept: ["I know her name"]
        extra_words: [your, answer, think]
        audio: alam_ko_ang_pangalan_niya
      - type: choice
        prompt: "Someone asks 'Nasaan si Ana?' and you have no idea. You say:"
        answer: Hindi ko alam.
        distractors: [Alam ko., Wala akong pera., Ayaw ko.]
        audio: hindi_ko_alam
        audio_text: Hindi ko alam.
      - type: listen
        audio: alam_mo_ba_ang_sagot
        answer_tl: Alam mo ba ang sagot
        extra_words: [tanong, ko]
      - type: translate
        prompt_tl: Hindi niya alam ang daan.
        answer_en: "He doesn't know the way."
        accept:
          - "She doesn't know the way"
          - "He does not know the way"
          - "She does not know the way"
          - "He doesn't know the road"
          - "She doesn't know the road"
        extra_words: [name, I, answer]
        audio: hindi_niya_alam_ang_daan
      - type: fill_blank
        sentence: "Hindi ___ alam ang sagot."
        translation: "I don't know the answer."
        answer: ko
        options: [ko, ako, akin]
        hint: '"Alam" takes the ko-set of pronouns: alam ko, alam mo, alam niya.'
      - type: translate
        prompt_en: Do you know her name?
        answer_tl: Alam mo ba ang pangalan niya?
        accept: ["Alam mo ang pangalan niya", "Alam ba ninyo ang pangalan niya", "Alam niyo ba ang pangalan niya"]
        extra_words: [ko, ka, sagot]
        audio: alam_mo_ba_ang_pangalan_niya
      - type: translate
        prompt_en: "I don't know the answer."
        answer_tl: Hindi ko alam ang sagot.
        extra_words: [ako, mo, tanong]
        audio: hindi_ko_alam_ang_sagot
        hint: 'The little pronoun jumps to right after "hindi": Hindi ko alam.'
