        answer_en: I know that he is sick.
        accept:
          - "I know that she is sick"
          - "I know he is sick"
          - "I know she is sick"
          - "I know that he's sick"
          - "I know that she's sick"
          - "I know he's sick"
          - "I know she's sick"
