        audio_text: Hindi ko alam kung darating siya.
      - type: fill_blank
        sentence: "Hindi ko alam ___ saan siya nakatira."
        translation: "I don't know where he lives."
        answer: kung
        options: [kung, na, ang]
        hint: 'After "hindi ko alam", a question word needs "kung" in front: kung saan, kung sino, kung kailan.'
      - type: translate
        prompt_en: I know that you are hungry.
        answer_tl: Alam kong gutom ka.
        accept: ["Alam ko na gutom ka", "Alam kong gutom kayo", "Alam ko na gutom kayo"]
        extra_words: [ko, kung, pagod]
        audio: alam_kong_gutom_ka
        hint: '"I know that..." = Alam kong... — the -ng linker does the job of "that".'
      - type: translate
        prompt_en: Do you know where the market is?
        answer_tl: Alam mo ba kung nasaan ang palengke?
        accept:
          - "Alam mo ba kung saan ang palengke"
          - "Alam mo kung nasaan ang palengke"
          - "Alam ba ninyo kung nasaan ang palengke"
          - "Alam niyo ba kung nasaan ang palengke"
        extra_words: [na, tindahan, ko]
        audio: alam_mo_ba_kung_nasaan_ang_palengke
