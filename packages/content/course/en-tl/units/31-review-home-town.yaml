      - type: translate
        prompt_en: Ride a jeepney at the station.
        answer_tl: Sumakay ka ng jeepney sa istasyon.
        accept: ["Sumakay ka sa jeepney sa istasyon"]
        extra_words: [lumiko, daan, palengke, sa]
