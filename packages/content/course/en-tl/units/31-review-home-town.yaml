      - type: fill_blank
        sentence: "Lumiko ka sa ___, tapos diretso lang."
        translation: "Turn right, then just go straight."
        answer: kanan
        options: [kanan, kanto, tapos]
      - type: listen
        audio: lumiko_ka_sa_kaliwa
        answer_tl: Lumiko ka sa kaliwa
        extra_words: [kanan, diretso]
      - type: choice
        prompt: "'Sumakay kami ng jeepney' means..."
        answer: We rode a jeepney
        distractors: [We are waiting for a jeepney, We got off the jeepney, We saw a jeepney]
        audio: sumakay_kami_ng_jeepney
        audio_text: Sumakay kami ng jeepney
      - type: fill_blank
        sentence: "Lumiko ang jeepney ___ mabilis sa kanto."
        translation: "The jeepney turned quickly at the corner."
        answer: nang
        options: [nang, ng, na]
        hint: '"nang" links a verb to how it was done — quickly.'
      - type: translate
        prompt_tl: Diretso ka, tapos lumiko ka sa kanan sa simbahan.
        answer_en: Go straight, then turn right at the church.
        accept: ["Go straight then turn right at the church"]
        extra_words: [left, market, corner]
        audio: diretso_ka_tapos_lumiko_ka_sa_kanan_sa_simbahan
