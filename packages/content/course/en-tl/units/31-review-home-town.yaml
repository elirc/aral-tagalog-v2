id: review-home-town
title: "Review: Home & Town"
description: Put it all together — find your way around town, run errands, and head back home.
tip: >-
  Refresher: nasaan asks where something IS and the answer starts with nasa
  ("Nasaan ang banyo?" — "Nasa loob."); saan asks where an action happens and
  pairs with sa ("Saan ka pupunta?" — "Sa palengke."). Mix them up and
  Filipinos will still understand you — but now you know better.
lessons:
  - id: revhome-1
    title: Back at the house
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: kusina, en: kitchen }
          - { tl: banyo, en: bathroom }
          - { tl: kwarto, en: bedroom }
          - { tl: hardin, en: garden }
      - type: choice
        prompt: "'Nasaan ang banyo?' means..."
        answer: Where is the bathroom?
        distractors: [The bathroom is small, Is the bathroom near?, I am in the bathroom]
        audio: nasaan_ang_banyo
        audio_text: Nasaan ang banyo?
      - type: translate
        prompt_tl: Nasa kusina ang ref.
        answer_en: The refrigerator is in the kitchen.
        accept: ["The fridge is in the kitchen"]
        extra_words: [bedroom, table, milk]
        audio: nasa_kusina_ang_ref
      - type: translate
        prompt_en: Mom is cleaning the bedroom.
        answer_tl: Naglilinis si Nanay ng kwarto.
        accept: ["Naglilinis ng kwarto si Nanay"]
        extra_words: [nagwawalis, banyo, ako]
        audio: naglilinis_si_nanay_ng_kwarto
      - type: fill_blank
        sentence: "Nagwawalis ako sa ___."
        translation: "I am sweeping in the garden."
        answer: hardin
        options: [hardin, kama, ilaw]
      - type: listen
        audio: nasa_sala_si_tatay
        answer_tl: Nasa sala si Tatay
        extra_words: [kusina, nanay]
      - type: choice
        prompt: "'Naghuhugas' means..."
        answer: Washing
        distractors: [Sweeping, Cleaning, Cooking]
        audio: naghuhugas
        audio_text: Naghuhugas
      - type: translate
        prompt_tl: Nagluluto si Lola ng manok sa kusina.
        answer_en: Grandma is cooking chicken in the kitchen.
        accept: ["Grandmother is cooking chicken in the kitchen"]
        extra_words: [fish, bathroom, washing]
        audio: nagluluto_si_lola_ng_manok_sa_kusina
  - id: revhome-2
    title: Places in town
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: palengke, en: market }
          - { tl: simbahan, en: church }
          - { tl: ospital, en: hospital }
          - { tl: botika, en: pharmacy }
      - type: choice
        prompt: "'Malayo' means..."
        answer: Far
        distractors: [Near, Left, Straight]
        audio: malayo
        audio_text: Malayo
      - type: translate
        prompt_tl: Malapit ang palengke sa bahay namin.
        answer_en: The market is near our house.
        accept: ["The market is close to our house"]
        extra_words: [far, church, school]
        audio: malapit_ang_palengke_sa_bahay_namin
      - type: translate
        prompt_en: Is the church near?
        answer_tl: Malapit ba ang simbahan?
        accept: ["Malapit po ba ang simbahan?"]
        extra_words: [malayo, ospital, saan]
        audio: malapit_ba_ang_simbahan
      - type: fill_blank
        sentence: "___ ang botika?"
        translation: "Where is the pharmacy?"
        answer: Nasaan
        options: [Nasaan, Saan, Sino]
        hint: '"Nasaan" asks where something is; "saan" asks where an action happens.'
      - type: listen
        audio: malayo_ang_ospital
        answer_tl: Malayo ang ospital
        extra_words: [malapit, botika]
      - type: choice
        prompt: "You have a fever and need medicine. Where do you go?"
        answer: Sa botika
        distractors: [Sa palengke, Sa simbahan, Sa istasyon]
        audio: sa_botika
        audio_text: Sa botika
      - type: translate
        prompt_tl: Pumunta si Ana sa ospital kasi may lagnat siya.
        answer_en: Ana went to the hospital because she has a fever.
        accept: ["Ana went to the hospital because he has a fever"]
        extra_words: [church, cough, near]
        audio: pumunta_si_ana_sa_ospital_kasi_may_lagnat_siya
