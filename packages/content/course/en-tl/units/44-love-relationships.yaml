        pairs:
          - { tl: "kilig", en: "giddy thrill" }
          - { tl: "crush", en: "crush" }
          - { tl: "malambing", en: "affectionate" }
          - { tl: "torpe", en: "too shy to confess" }
      - type: choice
        prompt: "Your crush smiles at you and you get butterflies. That feeling is..."
