  - id: love-5
    title: Mahal, sinta
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: "mahal ko", en: "my love" }
          - { tl: "sinta", en: "beloved" }
          - { tl: "puso", en: "heart" }
          - { tl: "yakap", en: "hug" }
      - type: choice
        prompt: "Filipino couples often call each other 'Mahal'. Used this way, it means..."
        answer: Dear / my love
        distractors: [Expensive, Friend, Big brother]
        audio: mahal
        audio_text: Mahal
        hint: 'Same word as "expensive" — something dear, in both senses.'
      - type: choice
        prompt: "'Sinta' is an old-fashioned, poetic word for..."
        answer: A beloved
        distractors: [A wedding, A best friend, A serenade]
        audio: sinta
        audio_text: Sinta
        hint: 'You hear "sinta" in old love songs — the kind sung in a harana.'
      - type: translate
        prompt_tl: Ingat ka, mahal.
        answer_en: Take care, dear.
        accept: ["Take care, my love", "Take care, love"]
        extra_words: [hurry, friend, see]
        audio: ingat_ka_mahal
      - type: fill_blank
        sentence: "Mahal kita, ___ ko."
        translation: "I love you, my beloved."
        answer: sinta
        options: [sinta, ate, guro]
      - type: listen
        audio: miss_na_kita_mahal
        answer_tl: Miss na kita, mahal
        extra_words: [sinta, ka]
      - type: translate
        prompt_en: Good morning, my love.
        answer_tl: Magandang umaga, mahal ko.
        accept: ["Magandang umaga, mahal"]
        extra_words: [gabi, kita, sinta]
        audio: magandang_umaga_mahal_ko
      - type: translate
        prompt_tl: Ikaw ang sinta ng puso ko.
        answer_en: You are the beloved of my heart.
        accept: ["You are my heart's beloved"]
        extra_words: [friend, love, his]
        audio: ikaw_ang_sinta_ng_puso_ko
      - type: translate
        prompt_en: Take care, my love. I love you.
        answer_tl: Ingat ka, mahal ko. Mahal kita.
        extra_words: [sinta, ikaw, ako]
        hint: '"mahal ko" = my love (what you call someone); "mahal kita" = I love you.'
        audio: ingat_ka_mahal_ko_mahal_kita
  - id: love-6
    title: Kilig!
    xp: 10
    exercises:
