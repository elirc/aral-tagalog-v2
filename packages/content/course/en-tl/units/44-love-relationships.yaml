        extra_words: [akin, mo, kita]
        hint: '"sa iyo" = yours / belongs to you.'
        audio: sa_iyo_ang_puso_ko
  - id: love-10
    title: Singsing at pamamanhikan
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: "singsing", en: "ring" }
