        audio: kinikilig_ako
      - type: fill_blank
        sentence: "Kinikilig si Ana kasi tumawag ang ___ niya."
        translation: "Ana is giddy because her crush called."
        answer: crush
        options: [crush, lola, guro]
      - type: listen
        audio: malambing_ang_nobyo_niya
        answer_tl: Malambing ang nobyo niya
