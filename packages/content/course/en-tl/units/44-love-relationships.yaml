        extra_words: [sweet, she, courting]
        hint: '"crush ni Ben" = Ben''s crush.'
        audio: crush_ni_ben_si_ana_pero_torpe_siya
      - type: translate
        prompt_en: I'm giddy because my crush called.
        answer_tl: Kinikilig ako kasi tumawag ang crush ko.
        accept: ["Kinikilig ako dahil tumawag ang crush ko"]
        extra_words: [tatawag, nobya, siya]
        audio: kinikilig_ako_kasi_tumawag_ang_crush_ko
  - id: love-7
    title: Sinagot na niya!
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: "sagot", en: "answer" }
          - { tl: "magkasintahan", en: "a couple" }
          - { tl: "manliligaw", en: "suitor" }
          - { tl: "ligaw", en: "courtship" }
      - type: choice
        prompt: "After months of courtship, he shouts 'Sinagot na niya ako!' It means..."
        answer: She said yes to me!
        distractors: [She is still thinking., She said no to me., She sang for me.]
        audio: sinagot_na_niya_ako
        audio_text: Sinagot na niya ako!
        hint: 'A courted woman "answers" (sagot) her suitor — "sinagot" means she said yes and they are now a couple.'
      - type: translate
        prompt_tl: Magkasintahan na sila.
        answer_en: They are a couple now.
        accept: ["They're a couple now", "They are already a couple", "They are sweethearts now"]
        extra_words: [married, friends, still]
        audio: magkasintahan_na_sila
      - type: fill_blank
        sentence: "___ si Ben kay Ana nang dalawang taon."
        translation: "Ben courted Ana for two years."
        answer: Nanligaw
        options: [Nanligaw, Manligaw, Ligaw]
        hint: 'Completed: manligaw → nanligaw. "nang dalawang taon" = for two years.'
      - type: listen
        audio: sinagot_na_ni_ana_si_ben
        answer_tl: Sinagot na ni Ana si Ben
        extra_words: [niya, nanligaw]
      - type: translate
        prompt_en: Ben is Ana's suitor.
        answer_tl: Manliligaw ni Ana si Ben.
        accept: ["Si Ben ang manliligaw ni Ana"]
        extra_words: [nobyo, kay, ng]
        audio: manliligaw_ni_ana_si_ben
      - type: choice
        prompt: "Ben courted Ana for months, and finally she said yes. Now they are..."
        answer: Magkasintahan
        distractors: [Manliligaw, Torpe, Ikakasal bukas]
        audio: magkasintahan
        audio_text: Magkasintahan
      - type: translate
        prompt_tl: Masaya ako kasi sinagot mo na ako.
        answer_en: I'm happy because you said yes to me.
        accept: ["I am happy because you said yes to me", "I'm happy because you already said yes to me"]
        extra_words: [sad, she, courted]
        audio: masaya_ako_kasi_sinagot_mo_na_ako
      - type: translate
        prompt_en: They have been a couple for one year.
        answer_tl: Isang taon na silang magkasintahan.
        extra_words: [dalawang, sila, kami]
        hint: '"na" + "sila" + the -ng linker → "na silang".'
        audio: isang_taon_na_silang_magkasintahan
  - id: love-8
    title: Tampo
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: "tampo", en: "sulking" }
          - { tl: "pasensya na", en: "sorry" }
          - { tl: "yakap", en: "hug" }
          - { tl: "galit", en: "angry" }
      - type: choice
        prompt: "'Nagtatampo siya' means..."
        answer: She is sulking
        distractors: [She is giddy, She is courting, She is singing]
        audio: nagtatampo_siya
        audio_text: Nagtatampo siya.
        hint: '"Tampo" is quiet hurt feelings — waiting for the other person to notice and make it up to you.'
      - type: translate
        prompt_tl: Pasensya ka na, mahal.
        answer_en: I'm sorry, dear.
        accept: ["Sorry, dear", "I am sorry, dear", "I'm sorry, my love", "Sorry, my love"]
        extra_words: [thanks, angry, friend]
        hint: '"Pasensya ka na" — literally "be patient with me" — the everyday way to say sorry.'
        audio: pasensya_ka_na_mahal
      - type: fill_blank
        sentence: "Huwag ka nang ___, mahal."
        translation: "Don't sulk anymore, dear."
        answer: magtampo
        options: [magtampo, nagtampo, nagtatampo]
        hint: '"Huwag ka nang ___" = don''t ___ anymore; it takes the plain verb form.'
      - type: listen
        audio: bakit_ka_nagtatampo
        answer_tl: Bakit ka nagtatampo
        extra_words: [galit, malungkot]
      - type: translate
        prompt_en: Why are you angry?
        answer_tl: Bakit ka galit?
        extra_words: [nagtatampo, ako, siya]
        audio: bakit_ka_galit
      - type: choice
        prompt: "Your partner is sulking because you forgot your anniversary. Say:"
        answer: Pasensya ka na, mahal.
        distractors: ["Kinikilig ako, mahal.", "Huwag kang kumain, mahal.", "Binabati kita, mahal."]
        audio: pasensya_ka_na_mahal
        audio_text: Pasensya ka na, mahal.
      - type: translate
        prompt_tl: Nagtampo siya kahapon, pero masaya na sila ngayon.
        answer_en: She sulked yesterday, but they are happy now.
        accept: ["He sulked yesterday, but they are happy now", "She sulked yesterday, but they're happy now", "She sulked yesterday but they are happy now"]
        extra_words: [sulking, angry, tomorrow]
        audio: nagtampo_siya_kahapon_pero_masaya_na_sila_ngayon
      - type: translate
        prompt_en: I'm sorry, dear. Don't sulk anymore.
        answer_tl: Pasensya ka na, mahal. Huwag ka nang magtampo.
        extra_words: [nagtatampo, kita, galit]
        audio: pasensya_ka_na_mahal_huwag_ka_nang_magtampo
        grading: { ng_nang: true }
