id: review-food-market
title: "Review: Food & Market"
description: Put your food, number, and shopping skills together — order, count, and haggle at the palengke.
tip: >-
  When counting things, numbers take a linker: -ng after a vowel ("dalawang
  itlog" — two eggs), "na" after a consonant ("anim na itlog" — six eggs). At
  the palengke, soften requests with "po" — "Magkano po?" — and it's perfectly
  normal to ask "May tawad po ba?" (Is there a discount?). Become a suki — a
  regular — and the best prices find you.
lessons:
  - id: revfood-1
    title: Food favorites
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: kanin, en: rice }
          - { tl: tubig, en: water }
          - { tl: itlog, en: egg }
          - { tl: isda, en: fish }
      - type: choice
        prompt: "'Masarap' means..."
        answer: Delicious
        distractors: [Expensive, Cheap, Hungry]
        audio: masarap
        audio_text: Masarap
      - type: translate
        prompt_tl: Gusto ko ng kape at tinapay.
        answer_en: I like coffee and bread.
        accept: ["I want coffee and bread"]
        extra_words: [milk, water, fish]
        audio: gusto_ko_ng_kape_at_tinapay
      - type: translate
        prompt_en: I don't like fish.
        answer_tl: Ayaw ko ng isda.
        accept: ["Ayoko ng isda", "Ayaw ko po ng isda"]
        extra_words: [gusto, manok, siya]
        audio: ayaw_ko_ng_isda
      - type: fill_blank
        sentence: "___ ang manok na ito."
        translation: "This chicken is delicious."
        answer: Masarap
        options: [Masarap, Mahal, Malaki]
      - type: listen
        audio: umiinom_ako_ng_tubig
        answer_tl: Umiinom ako ng tubig
        extra_words: [kape, gatas]
      - type: choice
        prompt: "'Itlog' means..."
        answer: Egg
        distractors: [Fish, Chicken, Rice]
        audio: itlog
        audio_text: Itlog
      - type: translate
        prompt_tl: Kumakain siya ng kanin at manok.
        answer_en: He is eating rice and chicken.
        accept:
          - "She is eating rice and chicken"
          - "He eats rice and chicken"
          - "She eats rice and chicken"
        extra_words: [fish, bread, drinking]
        audio: kumakain_siya_ng_kanin_at_manok
      - type: translate
        prompt_en: I drink coffee every day.
        answer_tl: Umiinom ako ng kape araw-araw.
        accept: ["Araw-araw akong umiinom ng kape"]
        extra_words: [tubig, gabi, kumakain]
        audio: umiinom_ako_ng_kape_araw_araw
        grading: { hyphens: true }
