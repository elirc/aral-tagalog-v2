      - type: translate
        prompt_en: How much is this? Ten pesos.
        answer_tl: Magkano ito? Sampung piso.
        accept:
          - Magkano po ito? Sampung piso
          - Magkano ito? Sampung piso po
        extra_words: [mura, mahal, pera]
        hint: 'A number ending in a vowel takes the -ng linker: sampu → "sampung piso". After a consonant, use na: "apat na piso".'
        audio: magkano_ito_sampung_piso
      - type: choice
        prompt: "'Kahapon' means..."
        answer: Yesterday
        distractors: [Tomorrow, Today, Every day]
        audio: kahapon
        audio_text: Kahapon
      - type: listen
        audio: may_sampung_piso_ako
        answer_tl: May sampung piso ako
        extra_words: [wala, tinapay]
      - type: translate
        prompt_tl: Ilan ang kapatid mo?
        answer_en: How many siblings do you have?
        accept: ["How many brothers and sisters do you have?"]
        extra_words: [cousins, parents, where]
        audio: ilan_ang_kapatid_mo
      - type: fill_blank
        sentence: "Araw-araw ___ nagtatrabaho sa opisina."
        translation: "He works at the office every day."
        answer: siyang
        options: [siyang, siya, niya]
        hint: 'After "araw-araw" the pronoun takes the -ng linker: "araw-araw siyang...".'
        grading: { hyphens: true }
      - type: translate
        prompt_en: Yesterday I bought three eggs and two loaves of bread. I have no money now.
        answer_tl: Kahapon bumili ako ng tatlong itlog at dalawang tinapay. Wala akong pera ngayon.
        accept:
          - Bumili ako kahapon ng tatlong itlog at dalawang tinapay. Wala akong pera ngayon
          - Kahapon ay bumili ako ng tatlong itlog at dalawang tinapay. Wala akong pera ngayon
          - Bumili ako ng tatlong itlog at dalawang tinapay kahapon. Wala akong pera ngayon
        extra_words: [isda, mahal, bukas]
        audio: kahapon_bumili_ako_ng_tatlong_itlog_at_dalawang_tinapay_wala_akong_pera_ngayon
