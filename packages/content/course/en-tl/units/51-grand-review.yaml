id: grand-review
title: The Grand Review
description: One last pass over everything — greetings, numbers, family, verbs in every aspect, and the little words that hold a Tagalog sentence together.
tip: >-
  Three small markers carry most of Tagalog. "ang" points at what the sentence
  is about, "ng" marks the object or the owner, and "sa" marks a place or a
  destination: "Bumili ang tatay ng isda sa palengke" — Dad bought fish at the
  market. Don't confuse "ng" with "nang": "ng" marks an object, but "nang" links
  a verb to how it was done — "kumakain nang mabilis" (eats quickly).
lessons:
  - id: grand-1
    title: Hello again
    xp: 10
    exercises:
      - type: match
        pairs:
          - { tl: magandang umaga, en: good morning }
          - { tl: magandang gabi, en: good evening }
          - { tl: walang anuman, en: you're welcome }
          - { tl: paalam, en: goodbye }
      - type: choice
        prompt: "'Walang anuman' means..."
        answer: You're welcome
        distractors: [Thank you, Good evening, Excuse me]
        audio: walang_anuman
        audio_text: Walang anuman.
      - type: translate
        prompt_tl: Magandang umaga po, kumusta kayo?
        answer_en: Good morning, how are you?
        accept: ["Good morning, how are you doing?"]
        extra_words: [evening, night, goodbye]
        audio: magandang_umaga_po_kumusta_kayo
      - type: fill_blank
        sentence: "Ano ___ pangalan mo?"
        translation: "What is your name?"
        answer: ang
        options: [ang, ng, sa]
        hint: '"ang" marks the topic — the thing the question is about.'
      - type: translate
        prompt_en: My name is Maria and I am a student.
        answer_tl: Maria ang pangalan ko at estudyante ako.
        accept:
          - Ang pangalan ko ay Maria at ako ay estudyante
          - Maria ang pangalan ko at ako ay estudyante
        extra_words: [guro, kaibigan, siya]
        audio: maria_ang_pangalan_ko_at_estudyante_ako
      - type: listen
        audio: mabuti_po_ako_salamat
        answer_tl: Mabuti po ako, salamat
        accept: ["Mabuti po ako salamat"]
        extra_words: [malungkot, pagod]
      - type: choice
        prompt: "A neighbor arrives at your door. You say:"
        answer: Tuloy po kayo.
        distractors: [Paalam po., Salamat po., Walang anuman po.]
        audio: tuloy_po_kayo
        audio_text: Tuloy po kayo.
      - type: translate
        prompt_tl: Ang nanay ko ay guro at ang tatay ko ay magsasaka.
        answer_en: My mom is a teacher and my dad is a farmer.
        accept: ["My mother is a teacher and my father is a farmer"]
        extra_words: [nurse, doctor, sister]
        audio: ang_nanay_ko_ay_guro_at_ang_tatay_ko_ay_magsasaka
      - type: translate
        prompt_en: Good evening! This is my older sister, she is a nurse at the hospital.
        answer_tl: Magandang gabi! Ito ang ate ko, nars siya sa ospital.
        accept:
          - Magandang gabi po! Ito ang ate ko, nars siya sa ospital
          - Magandang gabi! Ito ang ate ko, siya ay nars sa ospital
        extra_words: [kuya, doktor, paaralan]
        hint: '"Ito ang..." introduces someone — literally "this is the...".'
        audio: magandang_gabi_ito_ang_ate_ko_nars_siya_sa_ospital
  - id: grand-2
    title: Numbers, money, and time
