      - type: translate
        prompt_tl: Maganda ang bulaklak na dilaw.
        answer_en: The yellow flower is beautiful.
        extra_words: [red, house, small]
        audio: maganda_ang_bulaklak_na_dilaw
      - type: listen
        audio: may_asong_maliit_sila
        answer_tl: May asong maliit sila
        extra_words: [pusang, malaki]
      - type: choice
        prompt: "Which says 'the greedy cat'?"
        answer: ang pusang matakaw
        distractors: [ang pusa matakaw, ang pusa ng matakaw, ang matakaw pusa]
        audio: ang_pusang_matakaw
        audio_text: Ang pusang matakaw
      - type: translate
        prompt_en: They have a small dog and a greedy cat.
        answer_tl: May asong maliit at pusang matakaw sila.
        accept: ["May maliit na aso at matakaw na pusa sila"]
        extra_words: [malaki, kabayo, na]
        audio: may_asong_maliit_at_pusang_matakaw_sila
      - type: translate
        prompt_en: The small dog is sleeping in the big house.
        answer_tl: Natutulog ang asong maliit sa bahay na malaki.
        accept: ["Natutulog ang maliit na aso sa malaking bahay"]
        extra_words: [pusang, kama, malaking]
        audio: natutulog_ang_asong_maliit_sa_bahay_na_malaki
  - id: linkers-7
    title: Linkers on little words
    xp: 10
    exercises:
      - type: choice
        prompt: "Why does 'ko' become 'kong' in 'Gusto kong kumanta'?"
        answer: The linker -ng attaches to it before a verb
        distractors: [It is plural, It marks past tense, It makes it a question]
        audio: gusto_kong_kumanta
        audio_text: Gusto kong kumanta.
      - type: match
        pairs:
          - { tl: gusto kong, en: I want to }
          - { tl: pwede bang, en: may I }
          - { tl: huwag kang, en: don't you }
          - { tl: sabik akong, en: I am excited to }
      - type: fill_blank
        sentence: "Gusto ___ matulog; pagod na ako."
        translation: "I want to sleep; I'm tired now."
        answer: kong
        options: [kong, ko, akong]
      - type: translate
        prompt_tl: Sabik akong manood ng pelikula.
        answer_en: I am excited to watch a movie.
        accept: ["I'm excited to watch a movie", "I am excited to watch the movie", "I'm excited to watch the movie"]
        extra_words: [tired, sing, book]
        audio: sabik_akong_manood_ng_pelikula
      - type: listen
        audio: pwede_bang_maglaro_dito
        answer_tl: Pwede bang maglaro dito
        extra_words: [umupo, kang]
      - type: fill_blank
        sentence: "Pwede ba ___ sumayaw?"
        translation: "Can we dance?"
        answer: tayong
        options: [tayong, tayo, kayong]
      - type: translate
        prompt_en: I want to buy a beautiful flower.
        answer_tl: Gusto kong bumili ng magandang bulaklak.
        extra_words: [kang, kumain, bahay]
        audio: gusto_kong_bumili_ng_magandang_bulaklak
      - type: translate
        prompt_en: May we sing at the party?
        answer_tl: Pwede ba kaming kumanta sa handaan?
        accept: ["Pwede bang kumanta kami sa handaan", "Pwede ba tayong kumanta sa handaan"]
        extra_words: [bang, sumayaw, bahay]
        audio: pwede_ba_kaming_kumanta_sa_handaan
        hint: '"ba" + "kami" + linker: "Pwede ba kaming..."'
  - id: linkers-8
    title: Kapag — whenever
    xp: 10
    exercises:
      - type: choice
        prompt: "'Kapag' means..."
        answer: When / whenever
        distractors: [If only, Because, While]
        audio: kapag
        audio_text: Kapag
      - type: match
        pairs:
          - { tl: kapag, en: whenever }
          - { tl: kung, en: if }
          - { tl: habang, en: while }
          - { tl: kasi, en: because }
      - type: translate
        prompt_tl: Kapag umuulan, nagbabasa ako ng libro.
        answer_en: When it rains, I read a book.
        accept: ["Whenever it rains, I read a book", "When it is raining, I read a book"]
        extra_words: [if, cooking, sing]
        audio: kapag_umuulan_nagbabasa_ako_ng_libro
        hint: '"kapag" = when/whenever something regularly happens; "kung" = if it might not.'
      - type: fill_blank
        sentence: "___ mainit, pumupunta kami sa dagat."
        translation: "Whenever it's hot, we go to the sea."
        answer: Kapag
        options: [Kapag, Habang, Pero]
      - type: listen
        audio: kapag_malamig_umiinom_ako_ng_kape
        answer_tl: Kapag malamig, umiinom ako ng kape
        extra_words: [kung, mainit]
      - type: choice
        prompt: "'Kapag may pera ako, bumibili ako ng libro' means..."
        answer: Whenever I have money, I buy a book
        distractors:
          - If I had money, I would buy a book
          - I bought a book yesterday
          - While I have money, I read a book
        audio: kapag_may_pera_ako_bumibili_ako_ng_libro
        audio_text: Kapag may pera ako, bumibili ako ng libro.
      - type: translate
        prompt_en: Whenever I am hungry, I eat rice.
        answer_tl: Kapag gutom ako, kumakain ako ng kanin.
        accept: ["Kumakain ako ng kanin kapag gutom ako"]
        extra_words: [kung, uhaw, tubig]
        audio: kapag_gutom_ako_kumakain_ako_ng_kanin
      - type: translate
        prompt_en: Whenever it rains, we don't go to the market.
        answer_tl: Kapag umuulan, hindi kami pumupunta sa palengke.
        accept: ["Hindi kami pumupunta sa palengke kapag umuulan"]
        extra_words: [kung, mainit, tindahan]
        audio: kapag_umuulan_hindi_kami_pumupunta_sa_palengke
  - id: linkers-9
    title: Kaya — so
    xp: 10
    exercises:
      - type: choice
        prompt: "'Kaya' (as a connector) means..."
        answer: "So / that's why"
        distractors: [Because, Maybe, While]
        audio: kaya
        audio_text: Kaya
      - type: match
        pairs:
          - { tl: kaya, en: so }
          - { tl: kasi, en: because }
          - { tl: kapag, en: whenever }
          - { tl: kung, en: if }
      - type: translate
        prompt_tl: Pagod ako, kaya matutulog na ako.
        answer_en: I'm tired, so I'm going to sleep now.
        accept: ["I am tired, so I will sleep now", "I'm tired, so I will sleep now", "I am tired, so I'm going to sleep now"]
        extra_words: [because, hungry, eat]
        audio: pagod_ako_kaya_matutulog_na_ako
        hint: '"kasi" gives the reason; "kaya" gives the result.'
      - type: fill_blank
        sentence: "Mahal ang sapatos, ___ hindi ako bumili."
        translation: "The shoes are expensive, so I didn't buy them."
