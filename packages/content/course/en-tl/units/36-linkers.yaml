          - { tl: asong maliit, en: small dog }
          - { tl: pusang matakaw, en: greedy cat }
          - { tl: bulaklak na maganda, en: beautiful flower }
      - type: fill_blank
        sentence: "Bumili kami ng bahay ___ malaki."
        translation: "We bought a big house."
        answer: na
