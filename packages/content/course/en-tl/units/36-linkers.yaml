        answer: If
        distractors: [While, Because, But]
        audio: kung
        audio_text: Kung
      - type: match
        pairs:
          - { tl: kung, en: if }
          - { tl: habang, en: while }
          - { tl: pero, en: but }
          - { tl: kasi, en: because }
      - type: translate
        prompt_tl: Kung umuulan, hindi kami pupunta sa palengke.
        answer_en: If it's raining, we won't go to the market.
        accept:
          - "If it rains, we won't go to the market"
          - "If it is raining, we will not go to the market"
        extra_words: [while, store, but]
        audio: kung_umuulan_hindi_kami_pupunta_sa_palengke
      - type: translate
        prompt_en: She is singing while cooking.
        answer_tl: Kumakanta siya habang nagluluto.
        accept: ["Habang nagluluto, kumakanta siya"]
        extra_words: [kung, sumasayaw, kumakain]
        audio: kumakanta_siya_habang_nagluluto
      - type: fill_blank
        sentence: "Naglilinis ako ng bahay ___ natutulog ang anak ko."
        translation: "I am cleaning the house while my child is sleeping."
        answer: habang
        options: [habang, kung, pero]
      - type: listen
        audio: kumakain_sila_habang_nanonood_ng_pelikula
        answer_tl: Kumakain sila habang nanonood ng pelikula
        extra_words: [kung, naglalaro]
      - type: fill_blank
        sentence: "___ mainit, umiinom ako ng malamig na tubig."
        translation: "If it's hot, I drink cold water."
        answer: Kung
        options: [Kung, Habang, Pero]
      - type: translate
        prompt_tl: Nagbabasa ako ng libro habang umuulan.
        answer_en: I am reading a book while it's raining.
        accept:
          - "I read a book while it rains"
          - "I am reading a book while it is raining"
        extra_words: [if, sleeping, cold]
        audio: nagbabasa_ako_ng_libro_habang_umuulan
      - type: translate
        prompt_en: We are eating and drinking at the party while they are singing.
        answer_tl: Kumakain at umiinom kami sa handaan habang kumakanta sila.
        accept: ["Habang kumakanta sila, kumakain at umiinom kami sa handaan"]
        extra_words: [kung, pero, sumasayaw]
        audio: kumakain_at_umiinom_kami_sa_handaan_habang_kumakanta_sila
  - id: linkers-5
