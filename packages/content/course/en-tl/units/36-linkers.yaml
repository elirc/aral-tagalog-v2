      - type: match
        pairs:
          - { tl: ulang malakas, en: strong rain }
          - { tl: hanging malamig, en: cold wind }
          - { tl: kaning mainit, en: hot rice }
          - { tl: masarap na ulam, en: delicious dish }
      - type: fill_blank
        sentence: "Ayaw ko ng ___ malamig."
        translation: "I don't like cold wind."
        answer: hanging
        options: [hanging, hangin, hangin na]
        hint: '"hangin" ends in -n, so just add -g: hanging malamig.'
      - type: translate
        prompt_tl: Gusto ko ng kaning mainit.
        answer_en: I want hot rice.
        accept: ["I like hot rice", "I want some hot rice"]
        extra_words: [cold, bread, soup]
        audio: gusto_ko_ng_kaning_mainit
      - type: listen
        audio: malakas_ang_ulan_at_malamig_ang_hangin
        answer_tl: Malakas ang ulan at malamig ang hangin
        extra_words: [mainit, bagyo]
      - type: choice
        prompt: "'Hanging malamig' means..."
        answer: Cold wind
        distractors: [Strong wind, Cold rain, Hot air]
        audio: hanging_malamig
        audio_text: Hanging malamig
      - type: translate
        prompt_en: There was strong rain yesterday.
        answer_tl: May ulang malakas kahapon.
        accept: ["May malakas na ulan kahapon"]
        extra_words: [hangin, mainit, na]
        audio: may_ulang_malakas_kahapon
      - type: translate
        prompt_en: I ate hot rice and delicious fish.
        answer_tl: Kumain ako ng kaning mainit at masarap na isda.
        accept: ["Kumain ako ng mainit na kanin at masarap na isda"]
        extra_words: [malamig, manok, hanging]
        audio: kumain_ako_ng_kaning_mainit_at_masarap_na_isda
  - id: linkers-6
    title: Flip it around
    xp: 10
    exercises:
      - type: choice
        prompt: "'Malaking bahay' and 'bahay na malaki' are..."
        answer: Both correct — the same meaning
        distractors: [Different meanings, Only the first is correct, Only the second is correct]
      - type: match
