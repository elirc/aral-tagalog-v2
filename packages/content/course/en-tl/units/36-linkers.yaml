        audio: umuulan_kaya_malungkot_ako
        answer_tl: Umuulan, kaya malungkot ako
        extra_words: [kasi, masaya]
      - type: choice
        prompt: "'Malakas ang ulan, kaya hindi kami pupunta sa simbahan' means..."
        answer: "The rain is strong, so we won't go to church"
        distractors:
          - "The rain is strong because we won't go to church"
          - "It might rain, and we will still go to church"
          - "The rain stopped, so we went to church"
        audio: malakas_ang_ulan_kaya_hindi_kami_pupunta_sa_simbahan
        audio_text: Malakas ang ulan, kaya hindi kami pupunta sa simbahan.
      - type: translate
        prompt_en: The food is delicious, so the guests are happy.
        answer_tl: Masarap ang handa, kaya masaya ang mga bisita.
        accept: ["Masaya ang mga bisita kasi masarap ang handa"]
        extra_words: [kasi, malungkot, regalo]
        audio: masarap_ang_handa_kaya_masaya_ang_mga_bisita
      - type: translate
        prompt_en: I don't have money, so I am not buying the dress.
        answer_tl: Wala akong pera, kaya hindi ako bibili ng bestida.
        accept: ["Hindi ako bibili ng bestida kasi wala akong pera"]
        extra_words: [may, kasi, sapatos]
        audio: wala_akong_pera_kaya_hindi_ako_bibili_ng_bestida
  - id: linkers-10
    title: Tapos — little stories
    xp: 10
    exercises:
      - type: choice
        prompt: "'Tapos' (between two sentences) means..."
        answer: Then / after that
        distractors: [Before that, Because, Or]
        audio: tapos
        audio_text: Tapos
      - type: match
        pairs:
