      - type: translate
        prompt_tl: Ito po ang nanay ko.
        answer_en: This is my mom.
        accept: ["This is my mother"]
        extra_words: [dad, grandmother, friend]
        audio: ito_po_ang_nanay_ko
      - type: translate
        prompt_en: This is my older brother. His name is Juan.
        answer_tl: Ito ang kuya ko. Juan ang pangalan niya.
        accept: ["Ito po ang kuya ko. Juan po ang pangalan niya", "Kuya ko ito. Juan ang pangalan niya"]
        extra_words: [ate, siya, pamilya]
        audio: ito_ang_kuya_ko_juan_ang_pangalan_niya
      - type: fill_blank
        sentence: "Ito ___ ang lolo ko."
        translation: "This is my grandfather. (polite)"
        answer: po
        options: [po, ba, si]
        hint: '"po" slips in right after the first word.'
      - type: listen
        audio: ako_si_ana_at_ito_ang_pamilya_ko
        answer_tl: Ako si Ana at ito ang pamilya ko
        extra_words: [siya, kaibigan]
      - type: translate
        prompt_tl: Kumusta po kayo? Ako po si Ana.
        answer_en: How are you? I am Ana.
        accept: ["How are you? I'm Ana"]
        extra_words: [she, name, goodbye]
        audio: kumusta_po_kayo_ako_po_si_ana
      - type: choice
        prompt: "You meet your friend's grandfather for the first time. Greet him:"
        answer: Magandang hapon po, Lolo.
        distractors: [Kumusta ka?, Paalam!, Oo.]
        audio: magandang_hapon_po_lolo
        audio_text: Magandang hapon po, Lolo.
      - type: translate
        prompt_tl: Kumakain ang pamilya ko sa bahay ng lola ko.
        answer_en: My family is eating at my grandmother's house.
        accept: ["My family eats at my grandmother's house", "My family is eating at my grandma's house"]
        extra_words: [school, cooking, dad]
        audio: kumakain_ang_pamilya_ko_sa_bahay_ng_lola_ko
