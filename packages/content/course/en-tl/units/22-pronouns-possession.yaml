        audio: maganda_ang_hardin_ng_lola_ko
      - type: translate
        prompt_en: Whose money is this?
        answer_tl: Kanino ang perang ito?
        accept: ["Kaninong pera ito"]
        extra_words: [regalo, iyo, magkano]
