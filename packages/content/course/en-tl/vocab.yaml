# Unit 13 — Feelings & Opinions
- id: masaya
  lemma: masaya
  translation: happy / fun
  audio: masaya
  notes: ma- + saya (joy). "Masaya ako." = I am happy.
- id: malungkot
  lemma: malungkot
  translation: sad
  audio: malungkot
  notes: ma- + lungkot (sadness).
- id: galit
  lemma: galit
  translation: angry
  audio: galit
- id: sabik
  lemma: sabik
  translation: excited / eager
  audio: sabik
  notes: '"Sabik akong pumunta" = I am excited to go. In everyday speech many Filipinos just say the English "excited".'
- id: takot
  lemma: takot
  translation: afraid / scared
  audio: takot
  notes: 'Takes sa for the thing feared: "Takot ako sa bagyo."'
- id: gutom
  lemma: gutom
  translation: hungry
  audio: gutom
- id: uhaw
  lemma: uhaw
  translation: thirsty
  audio: uhaw
- id: pakiramdam
  lemma: pakiramdam
  translation: feeling
  audio: pakiramdam
  notes: '"Kumusta ang pakiramdam mo?" = How do you feel?'
- id: ayos_lang
  lemma: ayos lang
  translation: it's fine / I'm okay
  audio: ayos_lang
  notes: The everyday answer to "Kumusta ka?" when nothing much is wrong.
- id: bakit
  lemma: bakit
  translation: why
  audio: bakit
  notes: 'Short pronouns hop in right after it: "Bakit ka malungkot?"'
- id: kasi
  lemma: kasi
  translation: because
  audio: kasi
  notes: The everyday spoken "because" — it starts the reason, never the sentence.
- id: dahil
  lemma: dahil
  translation: because
  audio: dahil
  notes: The more formal twin of "kasi". "Dahil sa" + a noun = because of.
- id: nakakatawa
  lemma: nakakatawa
  translation: funny
  audio: nakakatawa
  notes: naka- + repeated syllable = "causes laughter". Formal spelling is nakatatawa.
- id: nakakainis
  lemma: nakakainis
  translation: annoying
  audio: nakakainis
  notes: Same naka- pattern as nakakatawa — this one causes inis (irritation).
- id: sa_tingin_ko
  lemma: sa tingin ko
  translation: I think / in my opinion
  audio: sa_tingin_ko
  notes: 'Literally "in my view". Swap the pronoun to ask — "Sa tingin mo?"'
- id: medyo
  lemma: medyo
  translation: a bit / somewhat
  audio: medyo
  notes: Goes before the adjective — "Medyo pagod ako."
- id: sobra
  lemma: sobra
  translation: too much / excessive
  audio: sobra
  notes: 'Takes -ng before an adjective: "Sobrang pagod ako." = I am so tired.'
- id: talaga
  lemma: talaga
  translation: really
  audio: talaga
  notes: On its own, "Talaga?" = Really? / Is that so?

