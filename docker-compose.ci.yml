# CI only: use Caddy's localhost CA and expose PostgreSQL to integration tests.
services:
  db:
    ports:
      - "127.0.0.1:5433:5432"
  api:
    environment:
      CORS_ORIGIN: https://localhost
  web:
    environment:
      DATABASE_URL: postgres://aral:ci-only-postgres-password@db:5432/aral
      JWT_SECRET: ${JWT_SECRET}
      VERCEL: "1"
  proxy:
    environment:
      DOMAIN: localhost
